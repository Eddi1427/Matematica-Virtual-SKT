      const list=roster(cid);
      if(!cid){alert("Selecciona un curso.");return;}
      if(!list.length){alert("Este curso no tiene estudiantes matriculados.");return;}
      const btn=document.getElementById("saveAtt24");btn.disabled=true;btn.textContent="Guardando...";

      /* Reemplazar la sesión del mismo curso y fecha permite corregir asistencia. */
      const del=await db().from("attendance").delete().eq("course_id",cid).eq("attendance_date",date);
      if(del.error){alert("No se pudo preparar la sesión:\n"+del.error.message);btn.disabled=false;btn.textContent="Guardar asistencia";return;}

      const rows=list.map(s=>({course_id:cid,student_id:s.id,attendance_date:date,status:document.getElementById("as_"+s.id).value}));
      const ins=await db().from("attendance").insert(rows);
      if(ins.error){alert("No se pudo guardar la asistencia:\n"+ins.error.message);btn.disabled=false;btn.textContent="Guardar asistencia";return;}

      alert("Asistencia guardada correctamente.");
      teacherAttendancePortal24();
    };
  };

  const oldPage=window.page;
  window.page=function(p){
    if(window.currentUser?.role==="Docente" && p==="asistencia")return teacherAttendancePortal24();
    return oldPage(p);
  };

  setTimeout(()=>{if(window.currentUser?.role==="Docente")teacherAttendancePortal24()},1100);
})();
</script>

<script>
/* ===== v3.4: PORTAL ESTUDIANTE FUNCIONAL =====
   Esta versión usa una sola fuente de navegación y obtiene el rol directamente
   desde la sesión de Supabase + public.profiles.
*/
(function(){
  "use strict";

  const nav = document.getElementById("nav");
  const app = document.getElementById("app");

  if(nav) nav.classList.add("skt34-pending");

  const esc = v => String(v ?? "").replace(/[&<>"']/g,
    m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  const avg = a => a.length ? a.reduce((s,v)=>s+Number(v),0)/a.length : 0;

  async function resolveUser(){
    const c = window.sktSupabase;
    if(!c?.auth) return null;

    const session = await c.auth.getSession();
    const user = session?.data?.session?.user;
    if(!user) return null;

    let name = user.email || "Usuario";
    let role = "Estudiante";

    const p = await c.from("profiles")
      .select("full_name,role,active")
      .eq("id", user.id)
      .limit(1);

    if(!p.error && p.data && p.data.length){
      const profile = p.data[0];
      name = profile.full_name || name;
      role = profile.role || role;
      if(profile.active === false) return null;
    }

    window.currentUser = {
      id:user.id,
      email:user.email || "",
      name:name,
      role:role
    };

    return window.currentUser;
  }

  async function getStudentData(){
    const c=window.sktSupabase, uid=window.currentUser?.id;
    if(!c || !uid) throw new Error("No hay sesión de Supabase.");

    const st=await c.from("students")
      .select("id,code,full_name,grade,section,email,phone,active,user_id")
      .eq("user_id",uid).maybeSingle();
    if(st.error) throw st.error;
    if(!st.data) return {linked:false};

    const en=await c.from("enrollments")
      .select("id,student_id,course_id,enrolled_at")
      .eq("student_id",st.data.id);
    if(en.error) throw en.error;

    const enrollments=en.data||[];
    const ids=[...new Set(enrollments.map(x=>x.course_id))];
    let courses=[],evaluations=[],grades=[],attendance=[];

    if(ids.length){
      const cr=await c.from("courses")
        .select("id,code,name,grade,section,teacher_id,active")
        .in("id",ids).eq("active",true).order("code");
      if(cr.error) throw cr.error;
      courses=cr.data||[];

      const ev=await c.from("evaluations")
        .select("id,course_id,title,evaluation_date,weight")
        .in("course_id",ids).order("evaluation_date");
      if(ev.error) throw ev.error;
      evaluations=ev.data||[];

      const eids=evaluations.map(x=>x.id);
      if(eids.length){
        const g=await c.from("grades")
          .select("id,evaluation_id,student_id,score")
          .eq("student_id",st.data.id).in("evaluation_id",eids);
        if(g.error) throw g.error;
        grades=g.data||[];
      }

      const at=await c.from("attendance")
        .select("id,course_id,student_id,attendance_date,status")
        .eq("student_id",st.data.id).in("course_id",ids)
        .order("attendance_date",{ascending:false});
      if(at.error) throw at.error;
      attendance=at.data||[];
    }

    return {linked:true,student:st.data,enrollments,courses,evaluations,grades,attendance};
  }

  function setMenu(){ return; }

  async function dashboard(){
    try{
      const r=await getStudentData();
      if(!r.linked){
        app.innerHTML=`<div class="head"><div><h1>Portal Estudiante</h1>
        <div class="muted">${esc(window.currentUser?.email)}</div></div></div>
        <div class="panel"><h3>Cuenta pendiente de vinculación</h3>
        <p>Esta cuenta no está vinculada a un registro de estudiante.</p></div>`;
        return;
      }
      const overall=avg(r.grades.map(g=>g.score));
      const at=r.attendance.length?Math.round(r.attendance.filter(a=>a.status!=="Falta").length/r.attendance.length*100):100;
      const pending=r.evaluations.filter(e=>!r.grades.some(g=>g.evaluation_id===e.id)).length;
      app.innerHTML=`
        <div class="head"><div><h1>Mi Dashboard</h1>
        <div class="muted">${esc(r.student.full_name)} · ${esc(r.student.grade)} · ${esc(r.student.section)}</div></div>
        <button class="secondary" onclick="window.skt34Dashboard()">↻ Actualizar</button></div>
        <div class="cards">
          <div class="card"><small>MIS CURSOS</small><div class="num">${r.courses.length}</div></div>
          <div class="card"><small>PROMEDIO</small><div class="num">${overall.toFixed(1)}</div></div>
          <div class="card"><small>ASISTENCIA</small><div class="num">${at}%</div></div>
          <div class="card"><small>PENDIENTES</small><div class="num">${pending}</div></div>
        </div>
        <div class="grid">
          <div class="panel"><h3>Mis cursos</h3>
          ${r.courses.map(c=>`<div class="row"><span><b>${esc(c.name)}</b><br>
          <span class="muted">${esc(c.grade)} · ${esc(c.section)} · ${esc(c.code)}</span></span>
          <span>${r.evaluations.filter(e=>e.course_id===c.id).length} evaluaciones</span></div>`).join("")
          ||'<div class="empty">No tienes cursos matriculados.</div>'}</div>
          <div class="panel"><h3>Próximas evaluaciones</h3>
          ${r.evaluations.slice(0,5).map(e=>{const c=r.courses.find(x=>x.id===e.course_id);
          return `<div class="row"><span><b>${esc(e.title)}</b><br><span class="muted">${esc(c?.name||"Curso")}</span></span>
          <span>${esc(e.evaluation_date)}</span></div>`}).join("")
          ||'<div class="empty">No hay evaluaciones.</div>'}</div>
        </div>`;
    }catch(e){ alert("No se pudo cargar el portal: "+(e.message||e)); }
  }

  async function courses(){
    const r=await getStudentData(); if(!r.linked){dashboard();return;}
    app.innerHTML=`<div class="head"><div><h1>Mis cursos</h1><div class="muted">${esc(r.student.full_name)}</div></div></div>
    <div class="cards">${r.courses.map(c=>`<div class="card"><small>${esc(c.code)}</small>
    <div class="num" style="font-size:20px">${esc(c.name)}</div>
    <div class="muted">${esc(c.grade)} · ${esc(c.section)}</div>
    <br>${r.evaluations.filter(e=>e.course_id===c.id).length} evaluaciones</div>`).join("")
    ||'<div class="empty">No tienes cursos matriculados.</div>'}</div>`;
  }

  async function grades(){
    const r=await getStudentData(); if(!r.linked){dashboard();return;}
    app.innerHTML=`<div class="head"><div><h1>Mis calificaciones</h1>
    <div class="muted">Promedio general: <b>${avg(r.grades.map(g=>g.score)).toFixed(1)}</b></div></div></div>
    <div class="panel" style="overflow:auto"><table class="table"><thead><tr>
    <th>Evaluación</th><th>Curso</th><th>Fecha</th><th>Nota</th></tr></thead><tbody>
    ${r.evaluations.map(e=>{const g=r.grades.find(x=>x.evaluation_id===e.id),c=r.courses.find(x=>x.id===e.course_id);
    return `<tr><td><b>${esc(e.title)}</b></td><td>${esc(c?.name||"Curso")}</td><td>${esc(e.evaluation_date)}</td>
    <td>${g?`<b>${Number(g.score).toFixed(2)}</b>`:'<span class="badge warn">Pendiente</span>'}</td></tr>`}).join("")
    ||'<tr><td colspan="4" class="empty">No hay evaluaciones.</td></tr>'}</tbody></table></div>`;
  }

  async function attendance(){
    const r=await getStudentData(); if(!r.linked){dashboard();return;}
    const p=r.attendance.filter(a=>a.status==="Presente").length;
    const t=r.attendance.filter(a=>a.status==="Tardanza").length;
    const f=r.attendance.filter(a=>a.status==="Falta").length;
    const pct=r.attendance.length?Math.round((p+t)/r.attendance.length*100):100;
    app.innerHTML=`<div class="head"><div><h1>Mi asistencia</h1><div class="muted">${esc(r.student.full_name)}</div></div></div>
    <div class="cards"><div class="card"><small>ASISTENCIA</small><div class="num">${pct}%</div></div>
    <div class="card"><small>PRESENTES</small><div class="num">${p}</div></div>
    <div class="card"><small>TARDANZAS</small><div class="num">${t}</div></div>
    <div class="card"><small>FALTAS</small><div class="num">${f}</div></div></div>
    <div class="panel" style="overflow:auto"><table class="table"><thead><tr>
    <th>Fecha</th><th>Curso</th><th>Estado</th></tr></thead><tbody>
    ${r.attendance.map(a=>{const c=r.courses.find(x=>x.id===a.course_id);return `<tr>
    <td>${esc(a.attendance_date)}</td><td>${esc(c?.name||"Curso")}</td>
    <td><span class="badge ${a.status==="Presente"?"":"warn"}">${esc(a.status)}</span></td></tr>`}).join("")
    ||'<tr><td colspan="3" class="empty">No hay registros.</td></tr>'}</tbody></table></div>`;
  }

  async function report(){
    const r=await getStudentData(); if(!r.linked){dashboard();return;}
    const overall=avg(r.grades.map(g=>g.score));
    const at=r.attendance.length?Math.round(r.attendance.filter(a=>a.status!=="Falta").length/r.attendance.length*100):100;
    app.innerHTML=`<div class="head"><div><h1>Mi reporte académico</h1>
    <div class="muted">${esc(r.student.full_name)} · ${esc(r.student.grade)} · ${esc(r.student.section)}</div></div></div>
    <div class="cards"><div class="card"><small>PROMEDIO</small><div class="num">${overall.toFixed(1)}</div></div>
    <div class="card"><small>ASISTENCIA</small><div class="num">${at}%</div></div>
    <div class="card"><small>CURSOS</small><div class="num">${r.courses.length}</div></div>
    <div class="card"><small>NOTAS</small><div class="num">${r.grades.length}</div></div></div>`;
  }

  window.skt34Dashboard=dashboard;
  window.sktStudentActions={courses,grades,attendance,report};

  /* Wait for the base Supabase boot to expose the role. */
  let tries=0;
  const timer=setInterval(async()=>{
    if(window.currentUser?.role){
      clearInterval(timer);
      if(window.currentUser?.role==="Estudiante"){
        setMenu();
        await dashboard();
      }else{
        if(nav) nav.classList.remove("skt34-pending"), nav.classList.add("skt34-ready");
      }
    }else if(++tries>=80){
      clearInterval(timer);
      if(nav) nav.classList.remove("skt34-pending"), nav.classList.add("skt34-ready");
    }
  },250);

  window.addEventListener("load",async()=>{
    try{
      const u=await resolveUser();
      if(u?.role==="Estudiante"){
        setMenu();
        await dashboard();
      }
    }catch(e){
      console.warn("v3.4 resolveUser",e);
    }
  });

})();
</script>

function student(){var box=reset();if(!box)return;section(box,'PORTAL ESTUDIANTE');var first=add(box,'dashboard','⌂  Mi Dashboard',function(){return window.skt34Dashboard&&window.skt34Dashboard();});add(box,'courses','▣  Mis cursos',function(){return window.sktStudentActions&&window.sktStudentActions.courses&&window.sktStudentActions.courses();});add(box,'grades','★  Mis calificaciones',function(){return window.sktStudentActions&&window.sktStudentActions.grades&&window.sktStudentActions.grades();});add(box,'attendance','◷  Mi asistencia',function(){return window.sktStudentActions&&window.sktStudentActions.attendance&&window.sktStudentActions.attendance();});add(box,'report','▥  Mi reporte',function(){return window.sktStudentActions&&window.sktStudentActions.report&&window.sktStudentActions.report();});first.classList.add('active');renderedRole='Estudiante';safe(function(){return window.skt34Dashboard&&window.skt34Dashboard();});}
function teacher(){var box=reset();if(!box)return;section(box,'PORTAL DOCENTE');var first=add(box,'dashboard','⌂  Mi Dashboard',function(){return window.sktTeacherDashboardByUser?window.sktTeacherDashboardByUser():window.page&&window.page('dashboard');});add(box,'cursos','▣  Mis cursos',function(){return window.sktTeacherCoursesByUser?window.sktTeacherCoursesByUser():window.page&&window.page('cursos');});add(box,'evaluaciones','✓  Mis evaluaciones',function(){return window.sktTeacherEvaluationsByUser?window.sktTeacherEvaluationsByUser():window.page&&window.page('evaluaciones');});add(box,'calificaciones','★  Mis calificaciones',function(){return window.sktTeacherGradesByUser?window.sktTeacherGradesByUser():window.page&&window.page('calificaciones');});add(box,'asistencia','◷  Mi asistencia',function(){return window.teacherAttendancePortal24?window.teacherAttendancePortal24():window.page&&window.page('asistencia');});add(box,'reportes','▥  Mis reportes',function(){return window.sktTeacherReportsByUser?window.sktTeacherReportsByUser():window.page&&window.page('reportes');});first.classList.add('active');renderedRole='Docente';safe(function(){return window.sktTeacherDashboardByUser?window.sktTeacherDashboardByUser():window.page&&window.page('dashboard');});}
function admin(){var box=reset();if(!box)return;section(box,'PRINCIPAL');var first=add(box,'dashboard','⌂  Dashboard',function(){return window.page&&window.page('dashboard');});section(box,'GESTIÓN ACADÉMICA');add(box,'estudiantes','◉  Estudiantes',function(){return window.page&&window.page('estudiantes');});add(box,'docentes','◉  Docentes',function(){return window.page&&window.page('docentes');});add(box,'cursos','▣  Cursos',function(){return window.page&&window.page('cursos');});add(box,'clases','▦  Clases',function(){return window.page&&window.page('clases');});add(box,'evaluaciones','✓  Evaluaciones',function(){return window.page&&window.page('evaluaciones');});add(box,'calificaciones','★  Calificaciones',function(){return window.page&&window.page('calificaciones');});add(box,'asistencia','◷  Asistencia',function(){return window.page&&window.page('asistencia');});section(box,'RECURSOS');add(box,'reportes','▥  Reportes',function(){return window.page&&window.page('reportes');});add(box,'biblioteca','▤  Biblioteca',function(){return window.page&&window.page('biblioteca');});add(box,'configuracion','⚙  Configuración',function(){return window.page&&window.page('configuracion');});add(box,'usuarios','👤  Usuarios y roles',function(){return window.page&&window.page('usuarios');});first.classList.add('active');renderedRole='Administrador';safe(function(){return window.page&&window.page('dashboard');});}
function apply(force){var r=role();if(!nav||!r)return;var box=nav.querySelector('.skt48-menu');if(!force&&renderedRole===r&&box)return;if(r==='Estudiante')student();else if(r==='Docente')teacher();else if(r==='Administrador')admin();}

<script id="skt-v54-clases-js">
(function(){
  "use strict";
  const KEY="skt_clases_v54";
  const weekdays=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
  const appEl=()=>document.getElementById("app");
  const esc=v=>String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':'&quot;'}[m]));
  const getData=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch{return []}};
  const setData=x=>localStorage.setItem(KEY,JSON.stringify(x));
  let cachedCourses=[];
  let cachedStudents=[];
  let cachedEnrollments=[];
  async function loadCoursesFromSupabase(){
    const client=window.sktSupabase;
    if(!client){
      cachedCourses = (window.acad?.courses || []).filter(c=>c.active!==false);
      return cachedCourses;
    }
    try{
      const {data,error}=await client.from("courses").select("id,code,name,grade,section,active").eq("active",true).order("code",{ascending:true});
      if(error){
        console.error("SKT clases courses:", error);
        cachedCourses = (window.acad?.courses || []).filter(c=>c.active!==false);
        return cachedCourses;
      }
      cachedCourses = (data||[]).map(c=>({ ...c, id:String(c.id) }));
      return cachedCourses;
    }catch(err){
      console.error("SKT clases courses:", err);
      cachedCourses = (window.acad?.courses || []).filter(c=>c.active!==false);
      return cachedCourses;
    }
  }
  async function loadClassesReadData(){
    const client=window.sktSupabase;
    if(!client){
      cachedStudents=[];
      cachedEnrollments=[];
      return {students:[],courses:courseList(),enrollments:[]};
    }
    try{
      const [studentsRes, enrollmentsRes, coursesRes]=await Promise.all([
        client.from("students").select("id,code,full_name,grade,section,active").order("code", { ascending: true }),
        client.from("enrollments").select("id,student_id,course_id").order("id", { ascending: true }),
        client.from("courses").select("id,code,name,grade,section,active").order("code", { ascending: true })
      ]);
      if(studentsRes.error) throw studentsRes.error;
      if(enrollmentsRes.error) throw enrollmentsRes.error;
      if(coursesRes.error) throw coursesRes.error;
      cachedStudents = studentsRes.data || [];
      cachedEnrollments = enrollmentsRes.data || [];
      cachedCourses = coursesRes.data || [];
      return {students:cachedStudents, courses:cachedCourses, enrollments:cachedEnrollments};
    }catch(err){
      console.error("SKT clases read data:", err);
      cachedStudents=[];
      cachedEnrollments=[];
      return {students:[], courses:courseList(), enrollments:[]};
    }
  }
  function courseList(){
    try{ if(cachedCourses.length)return cachedCourses; if(window.acad?.courses?.length)return window.acad.courses.filter(c=>c.active===true); }catch{}
    return [];
  }
  function studentList(){
    return cachedStudents.length ? cachedStudents : [];
  }
  function studentLabel(id){
    const s=studentList().find(x=>String(x.id)===String(id));
    if(!s) return "Estudiante no encontrado";
    const name=s.full_name || s.name || "Estudiante";
    return `${name} · ${s.code || s.id}`;
  }
  function seed(){
    let data=getData();
    if(data.length)return data;
    const cs=courseList();
    data=cs.slice(0,4).map((c,i)=>({
      id:`CLS-${String(i+1).padStart(3,"0")}`,course_id:c.id,day:weekdays[i],start:i===0?"08:00":"10:00",end:i===0?"09:30":"11:30",room:i%2?"Aula 202":"Aula 201",modality:"Presencial",topic:i===0?"Números y operaciones":"Sesión de aprendizaje",active:true
    }));
    setData(data);return data;
  }
  function courseLabel(id){
    const c=courseList().find(x=>String(x.id)===String(id));
    if(!c) return String(id||"Curso");

  }
  window.sktRenderClases=render;

    const data=getData(), current=data.find(x=>x.id===id)||{id:"",course_id:"",day:"Lunes",start:"08:00",end:"09:30",room:"",modality:"Presencial",topic:"",active:true};

    app.innerHTML=`<div class="head"><div><h1>${id?"Editar":"Nueva"} clase</h1><div class="muted">Programación de sesión académica</div></div><button class="secondary" onclick="sktRenderClases()">← Volver</button></div>
      <div class="panel"><form id="sktClaseForm" class="form"><label>Curso<select name="course_id" required><option value="">Seleccione</option>${cs.map(c=>`<option value="${esc(c.id)}" ${String(c.id)===String(current.course_id)?"selected":""}>${esc(courseLabel(c.id))}</option>`).join("")}</select></label>
      ${students.length ? `<label>Estudiante<select name="student_id"><option value="">Seleccione</option>${students.map(s=>`<option value="${esc(String(s.id))}">${esc((s.full_name || s.name || "Estudiante") + " · " + (s.code || s.id))}</option>`).join("")}</select></label>` : ""}
      <label>Día<select name="day">${weekdays.map(d=>`<option ${d===current.day?"selected":""}>${d}</option>`).join("")}</select></label>

    const form=document.getElementById("sktClaseForm");
    form.onsubmit=e=>{e.preventDefault();const f=new FormData(form);const start=String(f.get("start")),end=String(f.get("end"));if(end<=start){alert("La hora final debe ser posterior a la hora inicial.");return;}const obj={id:current.id||`CLS-${Date.now()}`,course_id:String(f.get("course_id")),day:String(f.get("day")),start,end,room:String(f.get("room")||""),modality:String(f.get("modality")),topic:String(f.get("topic")||""),active:true};const next=current.id?data.map(x=>x.id===current.id?obj:x):[...data,obj];setData(next);sktRenderClases();};

<script>
/* ===== v5.5 ADMIN: Evaluaciones y calificaciones completas ===== */
(function(){
  'use strict';
  function csvEscape(v){
    const x=String(v??'');
    return '"'+x.replace(/"/g,'""')+'"';
  }
  function db(){return window.sktSupabase||null;}

  window.exportGradesCSV=async function(){
    const client=db();
    if(!client){alert('Supabase no está conectado.');return;}
    try{
      const [ev,st,en,c,g,teacherProfiles]=await Promise.all([
        client.from('evaluations').select('id,title,evaluation_date,weight,course_id').order('evaluation_date'),
        client.from('students').select('id,code,full_name,grade,section').eq('active',true).order('code'),
        client.from('enrollments').select('student_id,course_id'),
        client.from('courses').select('id,code,name,grade,section,teacher_id').order('code'),
        client.from('grades').select('evaluation_id,student_id,score'),
        client.from('teachers').select('id,full_name')
      ]);
      for(const r of [ev,st,en,c,g,teacherProfiles]) if(r.error) throw r.error;
      const courses=c.data||[], students=st.data||[], enrollments=en.data||[], evals=ev.data||[], grades=g.data||[];
      const cby=new Map(courses.map(x=>[x.id,x]));
      const sby=new Map(students.map(x=>[x.id,x]));
      const eby=new Map(grades.map(x=>[x.evaluation_id+'_'+x.student_id,x.score]));
      const rows=[['Evaluación','Fecha','Curso','Código curso','Estudiante','Código estudiante','Grado','Sección','Nota','Peso']];
      for(const e of evals){
        const roster=enrollments.filter(x=>x.course_id===e.course_id);
        const c=cby.get(e.course_id)||{};
        for(const r of roster){
          const st=sby.get(r.student_id); if(!st) continue;
          rows.push([e.title,e.evaluation_date,c.name||'',c.code||'',st.full_name,st.code,st.grade,st.section,eby.get(e.id+'_'+st.id)??'',e.weight??1]);
        }
      }
      const csv='\\ufeff'+rows.map(r=>r.map(csvEscape).join(',')).join('\\r\\n');
      const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SKT_calificaciones.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    }catch(err){console.error(err);alert('No se pudo exportar las calificaciones.\\n\\n'+(err.message||err));}
  };

  const oldRender=window.renderGradesDB;
  window.renderGradesDB=async function(){
    if(typeof oldRender!=='function') return;
    await oldRender();
    if(window.currentUser?.role!=='Administrador') return;
    const head=document.querySelector('.head');
    if(head && !document.getElementById('exportGradesCSVBtn')){
      const b=document.createElement('button');
      b.id='exportGradesCSVBtn'; b.className='secondary'; b.type='button'; b.textContent='⬇ Exportar CSV'; b.onclick=window.exportGradesCSV;
      head.appendChild(b);
    }
  };

  const prevPage=window.page;
  window.page=function(p){
    if(p==='calificaciones') return window.renderGradesDB();
    if(p==='evaluaciones' && typeof window.renderEval==='function') return window.renderEval();
    return typeof prevPage==='function' ? prevPage(p) : undefined;
  };

  window.addEventListener('skt:role-ready',()=>{
    if(window.currentUser?.role==='Administrador'){
      const b=[...document.querySelectorAll('#nav button')].find(x=>/Calificaciones/.test(x.textContent));
      if(b) b.title='Libro de calificaciones conectado a Supabase';
    }
  });
})();
</script>

<script>
(function(){
  // v5.7: Reportes académicos. Se integra sin reemplazar el shell ni el login.
  function esc7(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
  async function reportesSKT(){
    if(!window.currentUser || window.currentUser.role!=='Administrador') return;
    const app=document.getElementById('app'); if(!app) return;
    app.innerHTML=`<div class="card" style="padding:24px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">

    const body=document.getElementById('rptBody');

      const c=window.client;

        c.from('students').select('id,code,full_name,grade,section,active'),

        const pres=as.filter(a=>String(a.status).toLowerCase().includes('pres')).length;
        const att=as.length?Math.round(pres/as.length*100):null;
        return {codigo:x.code||'',estudiante:x.full_name||'',grado:x.grade||'',seccion:x.section||'',promedio:avg==null?'':avg.toFixed(1),asistencia:att==null?'':att+'%'};
      });
      const avgAll=rows.filter(r=>r.promedio!=='').map(r=>Number(r.promedio));
      const attAll=rows.filter(r=>r.asistencia!=='').map(r=>Number(r.asistencia.replace('%','')));

        <div class="card"><b>${students.length}</b><div class="muted">Estudiantes</div></div>
        <div class="card"><b>${avgAll.length?(avgAll.reduce((a,b)=>a+b,0)/avgAll.length).toFixed(1):'—'}</b><div class="muted">Promedio general</div></div>
        <div class="card"><b>${attAll.length?Math.round(attAll.reduce((a,b)=>a+b,0)/attAll.length)+'%':'—'}</b><div class="muted">Asistencia promedio</div></div>
      </div>
      <div style="overflow:auto"><table class="table" style="width:100%"><thead><tr><th>Código</th><th>Estudiante</th><th>Grado</th><th>Sección</th><th>Promedio</th><th>Asistencia</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc7(r.codigo)}</td><td>${esc7(r.estudiante)}</td><td>${esc7(r.grado)}</td><td>${esc7(r.seccion)}</td><td>${esc7(r.promedio||'—')}</td><td>${esc7(r.asistencia||'—')}</td></tr>`).join('')}</tbody></table></div>`;
      document.getElementById('rptCsv').onclick=()=>{
        const csv=['Código,Estudiante,Grado,Sección,Promedio,Asistencia',...rows.map(r=>[r.codigo,r.estudiante,r.grado,r.seccion,r.promedio,r.asistencia].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','))].join('\n');
        const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='reporte_academico_skt.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
      };
    }catch(e){body.innerHTML='<div class="alert">No se pudo cargar el reporte: '+esc7(e.message||e)+'</div>';}
  }
  window.sktReportes=reportesSKT;
  // Intercepta únicamente el acceso al módulo Reportes del administrador.
  document.addEventListener('click',function(e){
    const el=e.target.closest && e.target.closest('[data-page="reportes"], [data-page="reports"], a, button');
    if(!el) return;
    const t=(el.textContent||'').trim().toLowerCase();
    if(t==='reportes' || t.includes('reportes')) setTimeout(()=>{if(window.currentUser?.role==='Administrador') reportesSKT();},80);
  });
})();
</script>


<script id="skt58-biblioteca">
(function(){
  const TABLE='biblioteca_recursos';
  const seed=[
    {titulo:'Álgebra y ecuaciones',tipo:'PDF',categoria:'Matemática',url:'#',descripcion:'Material de apoyo para álgebra y resolución de ecuaciones.',estado:'Activo'},
    {titulo:'Funciones y gráficas',tipo:'PDF',categoria:'Matemática',url:'#',descripcion:'Guía de funciones, dominio, rango y representación gráfica.',estado:'Activo'},
    {titulo:'Ficha de práctica – Inecuaciones',tipo:'Ficha',categoria:'Práctica',url:'#',descripcion:'Ejercicios para reforzar inecuaciones y problemas aplicados.',estado:'Activo'}
  ];

  function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
  function normalizeTitle(v){const s=String(v??'').trim().toLowerCase();return s.normalize? s.normalize('NFD').replace(/[\u0300-\u036f]/g,'') : s;}
  function canonicalTitle(v){
    let s=String(v??'').trim();
    s=s.replace(/\s*[-–—]\s*(?:editado|editada|validado|validada)\b.*$/gi,'').trim();
    s=s.replace(/\s+(?:editado|editada|validado|validada)\s+\d{10,}\s*$/gi,'').trim();
    s=s.replace(/\s*[-–—]\s*\d{10,}\s*$/,'').trim();
    s=s.replace(/\s+\d{13,}\s*$/,'').trim();
    return normalizeTitle(s);
  }
  function isGeneratedTitle(v){
    const s=String(v??'').trim();
    return /(?:editado|editada|validado|validada)/i.test(s) && /\d{10,}/.test(s);
  }
  function dedupeResources(rows){
    const map=new Map();
    for(const row of rows||[]){
      const item={...(row||{}), titulo:(String(row?.titulo ?? 'Sin título').trim() || 'Sin título')};
      const key=canonicalTitle(item.titulo);
      if(!key) continue;
      if(!map.has(key)) map.set(key, item);
      else {
        const current=map.get(key);
        const preferItem = isGeneratedTitle(current.titulo) && !isGeneratedTitle(item.titulo) ? item : (!isGeneratedTitle(current.titulo) && isGeneratedTitle(item.titulo) ? current : current);
        map.set(key, preferItem);
      }
    }
    return Array.from(map.values());
  }
  function getClient(){return window.sktSupabase || window.client || null;}

  function localSeedRows(){
    return seed.map((item, index) => ({
      id: `local-${index + 1}`,
      titulo: item.titulo,
      tipo: item.tipo,
      categoria: item.categoria,
      url: item.url || '#',
      descripcion: item.descripcion,
      estado: item.estado || 'Activo'
    }));
  }

  async function ensureSeedRows(client){
    const { data, error } = await client.from(TABLE).select('id,titulo');
    if(error) throw error;
    const existing=new Set((data||[]).map(r => normalizeTitle(r.titulo)));
    const rows=seed.filter(r => !existing.has(normalizeTitle(r.titulo))).map(r => ({
      titulo:r.titulo,
      tipo:r.tipo,
      categoria:r.categoria,
      url:r.url||'#',
      descripcion:r.descripcion,
      estado:r.estado||'Activo'
    }));
    if(!rows.length) return;
    const { error: insertError } = await client.from(TABLE).insert(rows);
    if(insertError) throw insertError;
  }

  function mapDbRows(rows){
    return (rows||[]).map(r => ({
      id:r.id ?? r.uuid ?? r._id ?? `legacy-${Math.random().toString(16).slice(2)}`,
      titulo:r.titulo || 'Sin título',
      tipo:r.tipo || 'PDF',
      categoria:r.categoria || 'Otros',
      url:r.url || '#',
      descripcion:r.descripcion || '',
      estado:r.estado || 'Activo'
    }));
  }

  async function getResources(){
    const client=getClient();
    const fallback=dedupeResources(mapDbRows(localSeedRows()));
    if(!client) return fallback;
    try{
      await ensureSeedRows(client);
      const { data, error } = await client.from(TABLE).select('*').order('titulo',{ascending:true});
      if(error) throw error;
      if(!Array.isArray(data) || !data.length) return fallback;
      return dedupeResources(mapDbRows(data));
    }catch(err){
      console.warn('Biblioteca: error al cargar recursos desde Supabase; usando fallback local.', err);
      return fallback;
    }
  }

  async function persistResource(obj){
    const client=getClient();
    if(!client) return {ok:false, message:'Supabase no está conectado.'};
    const payload={
      titulo:String(obj.titulo||'').trim(),
      tipo:String(obj.tipo||'PDF'),
      categoria:String(obj.categoria||'Otros').trim() || 'Otros',
      url:String(obj.url||'#').trim() || '#',
      descripcion:String(obj.descripcion||'').trim(),
      estado:String(obj.estado||'Activo')
    };
    if(!payload.titulo){ return {ok:false, message:'Ingresa el título del recurso.'}; }

    const current=await getResources();
    const duplicate=current.find(r => canonicalTitle(r.titulo)===canonicalTitle(payload.titulo) && (!obj.id || String(r.id) !== String(obj.id)));
    if(duplicate){ return {ok:false, message:'Ya existe un recurso con ese título.'}; }

    try{
      if(obj.id && String(obj.id).length>0 && !String(obj.id).startsWith('r')){
        const { error } = await client.from(TABLE).update(payload).eq('id', obj.id);
        if(error) throw error;
        return {ok:true};
      }
      const { data, error } = await client.from(TABLE).insert([payload]).select().single();
      if(error) throw error;
      if(data){ obj.id=data.id; }
      return {ok:true};
    }catch(err){
      console.error('Biblioteca: error al guardar en Supabase.', err);
      return {ok:false, message: err?.message || 'No se pudo guardar el recurso.'};
    }
  }

  async function removeResource(id){
    const client=getClient();
    if(!client) return {ok:false, message:'Supabase no está conectado.'};
    try{
      const { error } = await client.from(TABLE).delete().eq('id', id);
      if(error) throw error;
      return {ok:true};
    }catch(err){
      console.error('Biblioteca: error al eliminar en Supabase.', err);
      return {ok:false, message: err?.message || 'No se pudo eliminar el recurso.'};
    }
  }

  function isAdmin(){return (window.currentUser?.role||'')==='Administrador';}

  async function renderBiblioteca(){
    const app=document.getElementById('app');
    if(!app) return;
    const data=await getResources();
    app.innerHTML=`<div class="head"><div><h1>Biblioteca</h1><div class="muted">Recursos educativos de Matemática Virtual “SKT”</div></div>${isAdmin()?'<button class="primary" id="libAdd">+ Nuevo recurso</button>':''}</div>
    <div class="panel"><div class="toolbar"><input id="libSearch" placeholder="Buscar por título, categoría o descripción" style="min-width:280px"><select id="libCat"><option value="">Todas las categorías</option><option>Matemática</option><option>Práctica</option><option>Video</option><option>Otros</option></select><select id="libType"><option value="">Todos los tipos</option><option>PDF</option><option>Ficha</option><option>Video</option><option>Enlace</option></select></div>
    <table class="table"><thead><tr><th>Recurso</th><th>Tipo</th><th>Categoría</th><th>Descripción</th><th>Acceso</th>${isAdmin()?'<th>Acciones</th>':''}</tr></thead><tbody id="libRows"></tbody></table></div>`;
    const draw=()=>{const q=(document.getElementById('libSearch').value||'').toLowerCase(),c=document.getElementById('libCat').value,t=document.getElementById('libType').value;const rows=data.filter(r=>(!q||[r.titulo,r.categoria,r.descripcion].join(' ').toLowerCase().includes(q))&&(!c||r.categoria===c)&&(!t||r.tipo===t));document.getElementById('libRows').innerHTML=rows.length?rows.map(r=>`<tr><td><b>${esc(r.titulo)}</b></td><td>${esc(r.tipo)}</td><td>${esc(r.categoria)}</td><td>${esc(r.descripcion)}</td><td><a href="${esc(r.url||'#')}" target="_blank" rel="noopener" class="secondary" style="display:inline-block;text-decoration:none">Abrir</a></td>${isAdmin()?`<td class="actions"><button type="button" class="lib-edit" data-lib-id="${esc(r.id)}">Editar</button><button type="button" class="lib-delete" data-lib-id="${esc(r.id)}">Eliminar</button></td>`:''}</tr>`).join(''):'<tr><td colspan="6" class="empty">No hay recursos que coincidan con la búsqueda.</td></tr>';
    };
    ['libSearch','libCat','libType'].forEach(id=>document.getElementById(id).addEventListener('input',draw));
    draw();
    if(isAdmin()) {
      const addBtn=document.getElementById('libAdd');
      if(addBtn) addBtn.addEventListener('click', () => form());
    }
    app.dataset.bibliotecaBound='1';
    app.addEventListener('click', async (event) => {
      const editBtn = event.target.closest('.lib-edit');
      if(editBtn){
        event.preventDefault();
        await window.bibliotecaEdit(editBtn.dataset.libId);
        return;
      }
      const deleteBtn = event.target.closest('.lib-delete');
      if(deleteBtn){
        event.preventDefault();
        await window.bibliotecaDelete(deleteBtn.dataset.libId);
        return;
      }
      const cancelBtn = event.target.closest('#lfCancel');
      if(cancelBtn){
        event.preventDefault();
        renderBiblioteca();
      }
    }, { once: false });
  }
  window.renderBiblioteca = renderBiblioteca;

  function form(item){
    const x=item||{titulo:'',tipo:'PDF',categoria:'Matemática',url:'',descripcion:''};
    const html=`<div class="panel"><h3>${item?'Editar recurso':'Nuevo recurso'}</h3><div class="form"><label>Título<input id="lfTitle" value="${esc(x.titulo)}"></label><label>Tipo<select id="lfType"><option ${x.tipo==='PDF'?'selected':''}>PDF</option><option ${x.tipo==='Ficha'?'selected':''}>Ficha</option><option ${x.tipo==='Video'?'selected':''}>Video</option><option ${x.tipo==='Enlace'?'selected':''}>Enlace</option></select></label><label>Categoría<input id="lfCat" value="${esc(x.categoria)}"></label><label>Enlace / URL<input id="lfUrl" value="${esc(x.url)}"></label><label class="full">Descripción<input id="lfDesc" value="${esc(x.descripcion)}"></label></div><br><button class="primary" id="lfSave" type="button">Guardar</button> <button class="secondary" id="lfCancel" type="button">Cancelar</button></div>`;
    document.getElementById('app').insertAdjacentHTML('afterbegin',html);
    const saveBtn=document.getElementById('lfSave');
    const cancelBtn=document.getElementById('lfCancel');
    if(cancelBtn) cancelBtn.addEventListener('click', () => renderBiblioteca(), { once: true });
    if(saveBtn) saveBtn.addEventListener('click', async () => {
      const obj={
        id:x.id || `r${Date.now()}`,
        titulo:document.getElementById('lfTitle').value.trim(),
        tipo:document.getElementById('lfType').value,
        categoria:document.getElementById('lfCat').value.trim()||'Otros',
        url:document.getElementById('lfUrl').value.trim()||'#',
        descripcion:document.getElementById('lfDesc').value.trim(),
        estado:'Activo'
      };
      if(!obj.titulo){ alert('Ingresa el título del recurso.'); return; }
      const result=await persistResource(obj);
      if(!result.ok){ alert(result.message || 'No se pudo guardar.'); return; }
      renderBiblioteca();
    }, { once: true });
  }

  window.bibliotecaEdit = async id => {
    if(!isAdmin()) return;
    const targetId=String(id);
    const x=(await getResources()).find(r => String(r.id)===targetId);
    if(x) form(x);
  };

  window.bibliotecaDelete = async id => {
    if(!isAdmin()) return;
    const targetId=String(id);
    if(!confirm('¿Eliminar este recurso de la biblioteca?')) return;
    const res=await removeResource(targetId);
    if(!res.ok){ alert(res.message || 'No se pudo eliminar el recurso.'); return; }
    renderBiblioteca();
  };

  const old=window.page;
  window.page=function(p){
    if(p==='biblioteca') return renderBiblioteca();
    return old ? old(p) : undefined;
  };
})();
</script>


<script>
/* ===== v6.1 DOCENTE: ASISTENCIA Y EVALUACIONES OPERATIVAS ===== */
(function(){
  "use strict";
  const db=()=>window.sktSupabase;
  const E=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;", "'":"&#39;"}[m]));
  const role=()=>String(window.currentUser?.role||"").trim();
  async function teacher(){
    const uid=window.currentUser?.id;
    if(!db()||!uid) return {ok:false,message:"No hay conexión con Supabase o sesión activa."};
    const tr=await db().from("teachers").select("id,code,full_name,specialty,active,user_id").eq("user_id",uid).maybeSingle();
    if(tr.error)return {ok:false,message:tr.error.message};
    if(!tr.data)return {ok:true,linked:false};
    const cr=await db().from("courses").select("id,code,name,grade,section,teacher_id,active").eq("teacher_id",tr.data.id).eq("active",true).order("code");
    if(cr.error)return {ok:false,message:cr.error.message};
    const courses=cr.data||[], ids=courses.map(x=>x.id);
    let enroll=[], students=[], evals=[], grades=[], attendance=[];
    if(ids.length){
      const [en,ev,at]=await Promise.all([
        db().from("enrollments").select("id,student_id,course_id,enrolled_at").in("course_id",ids),
        db().from("evaluations").select("id,course_id,title,evaluation_date,weight").in("course_id",ids).order("evaluation_date",{ascending:false}),
        db().from("attendance").select("id,course_id,student_id,attendance_date,status").in("course_id",ids).order("attendance_date",{ascending:false})
      ]);
      for(const x of [en,ev,at])if(x.error)return {ok:false,message:x.error.message};
      enroll=en.data||[];evals=ev.data||[];attendance=at.data||[];
      const sids=[...new Set(enroll.map(x=>x.student_id))];
      if(sids.length){const st=await db().from("students").select("id,code,full_name,grade,section,active").in("id",sids).order("code");if(st.error)return {ok:false,message:st.error.message};students=st.data||[];}
      const eids=evals.map(x=>x.id);
      if(eids.length){const g=await db().from("grades").select("id,evaluation_id,student_id,score,created_at").in("evaluation_id",eids);if(g.error)return {ok:false,message:g.error.message};grades=g.data||[];}
    }
    return {ok:true,linked:true,teacher:tr.data,courses,enroll,students,evals,grades,attendance};
  }
  function fail(r){if(!r.ok)alert(r.message);else if(!r.linked)alert("La cuenta docente aún no está vinculada en Supabase.");}
  function courseLabel(c){return `${E(c.name)} · ${E(c.grade)} ${E(c.section)} · ${E(c.code)}`;}

  window.sktTeacherAttendanceForm=async function(){
    if(role()!=="Docente")return;
    const r=await teacher();if(!r.ok||!r.linked){fail(r);return;}
    const today=new Date().toISOString().slice(0,10);
    app.innerHTML=`<div class="head"><div><h1>Registrar asistencia</h1><div class="muted">${E(r.teacher.full_name)} · solo estudiantes de mis cursos</div></div><button class="secondary" onclick="sktTeacherAttendanceByUser()">← Volver</button></div>
    <div class="panel"><form id="sktTAForm"><div class="form"><label>Fecha<input id="sktTADate" type="date" value="${today}" required></label><label>Curso<select id="sktTACourse" required>${r.courses.map(c=>`<option value="${c.id}">${courseLabel(c)}</option>`).join("")}</select></label></div><br><div id="sktTARoster"></div><br><button class="primary" id="sktTASave">Guardar asistencia</button></form></div>`;
    const draw=async()=>{
      const cid=document.getElementById("sktTACourse").value,date=document.getElementById("sktTADate").value;
      const ids=new Set(r.enroll.filter(x=>x.course_id===cid).map(x=>x.student_id));
      const roster=r.students.filter(s=>ids.has(s.id));
      const existing=r.attendance.filter(a=>a.course_id===cid&&a.attendance_date===date);
      const val=sid=>existing.find(a=>a.student_id===sid)?.status||"Presente";
      document.getElementById("sktTARoster").innerHTML=`<div style="overflow:auto"><table class="table"><thead><tr><th>Código</th><th>Estudiante</th><th>Estado</th></tr></thead><tbody>${roster.map(s=>`<tr><td>${E(s.code)}</td><td><b>${E(s.full_name)}</b></td><td><select name="st_${s.id}"><option ${val(s.id)==="Presente"?"selected":""}>Presente</option><option ${val(s.id)==="Tardanza"?"selected":""}>Tardanza</option><option ${val(s.id)==="Falta"?"selected":""}>Falta</option></select></td></tr>`).join("")||'<tr><td colspan="3" class="empty">No hay estudiantes matriculados en este curso.</td></tr>'}</tbody></table></div>`;
    };
    document.getElementById("sktTACourse").onchange=draw;document.getElementById("sktTADate").onchange=draw;await draw();
    document.getElementById("sktTAForm").onsubmit=async e=>{
      e.preventDefault();const btn=document.getElementById("sktTASave");btn.disabled=true;btn.textContent="Guardando...";
      const cid=document.getElementById("sktTACourse").value,date=document.getElementById("sktTADate").value,f=new FormData(e.target),ids=new Set(r.enroll.filter(x=>x.course_id===cid).map(x=>x.student_id));
      let error=null;
      for(const s of r.students.filter(x=>ids.has(x.id))){
        const status=String(f.get("st_"+s.id)||"Presente");
        const old=r.attendance.find(a=>a.course_id===cid&&a.attendance_date===date&&a.student_id===s.id);
        const res=old?await db().from("attendance").update({status}).eq("id",old.id):await db().from("attendance").insert({course_id:cid,student_id:s.id,attendance_date:date,status});
        if(res.error){error=res.error.message;break;}
      }
      if(error){alert("No se pudo guardar la asistencia:\n"+error);btn.disabled=false;btn.textContent="Guardar asistencia";return;}
      alert("Asistencia guardada correctamente en Supabase.");await sktTeacherAttendanceByUser();
    };
  };

  window.sktTeacherCreateEvaluation=async function(){
    if(role()!=="Docente")return;const r=await teacher();if(!r.ok||!r.linked){fail(r);return;}
    app.innerHTML=`<div class="head"><div><h1>Nueva evaluación</h1><div class="muted">Se guardará únicamente en uno de tus cursos.</div></div><button class="secondary" onclick="sktTeacherEvaluationsByUser()">← Volver</button></div>
    <div class="panel"><form id="sktTEForm" class="form"><label>Título<input name="title" required placeholder="Ej. Examen de unidad 1"></label><label>Curso<select name="course_id" required>${r.courses.map(c=>`<option value="${c.id}">${courseLabel(c)}</option>`).join("")}</select></label><label>Fecha<input name="evaluation_date" type="date" required value="${new Date().toISOString().slice(0,10)}"></label><label>Peso<input name="weight" type="number" min="0" max="100" step="0.01" value="100"></label><div class="full"><button class="primary" id="sktTESave">Crear evaluación</button></div></form></div>`;
    document.getElementById("sktTEForm").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("sktTESave");b.disabled=true;b.textContent="Guardando...";const f=new FormData(e.target);const payload={course_id:String(f.get("course_id")),title:String(f.get("title")).trim(),evaluation_date:String(f.get("evaluation_date")),weight:Number(f.get("weight"))};const c=r.courses.find(x=>x.id===payload.course_id);if(!c){alert("Curso no válido.");b.disabled=false;return;}const q=await db().from("evaluations").insert(payload).select().single();if(q.error){alert("No se pudo crear la evaluación:\n"+q.error.message);b.disabled=false;b.textContent="Crear evaluación";return;}alert("Evaluación creada correctamente.");sktTeacherEvaluationsByUser();};
  };

  const oldEval=window.sktTeacherEvaluationsByUser;
  window.sktTeacherEvaluationsByUser=async function(){
    await oldEval();
    if(role()==="Docente"){
      const h=document.querySelector(".head");if(h&&!document.getElementById("sktNewEvalBtn")){const b=document.createElement("button");b.id="sktNewEvalBtn";b.className="primary";b.textContent="+ Nueva evaluación";b.onclick=window.sktTeacherCreateEvaluation;h.appendChild(b);}
    }
  };
  const oldAtt=window.sktTeacherAttendanceByUser;
  window.sktTeacherAttendanceByUser=async function(){
    await oldAtt();
    if(role()==="Docente"){
      const h=document.querySelector(".head");if(h&&!document.getElementById("sktNewAttBtn")){const b=document.createElement("button");b.id="sktNewAttBtn";b.className="primary";b.textContent="+ Registrar asistencia";b.onclick=window.sktTeacherAttendanceForm;h.appendChild(b);}
    }
  };
})();
</script>

<script>
/* ===== v7.0 CENTRO DE PRUEBAS FINAL ===== */
(function(){
'use strict';
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function isAdmin(){return window.currentUser?.role==='Administrador'}
window.sktCentroPruebas=async function(){
 if(!isAdmin()){alert('Solo el Administrador puede ejecutar las pruebas integrales.');return;}
 const app=document.getElementById('app'); if(!app)return;
 const tests=[
  ['Autenticación','currentUser y rol disponibles',()=>!!window.currentUser&&!!window.currentUser.role],
  ['Interfaz','Contenedor #app',()=>!!document.getElementById('app')],
  ['Interfaz','Navegación #nav',()=>!!document.getElementById('nav')],

  ['Módulo','Configuración',()=>typeof window.sktConfiguracion==='function'],
  ['Módulo','Usuarios y roles',()=>!!document.querySelector("#nav button[data-page='usuarios']")]
 ];
 let html=`<div class="head"><div><h1>Centro de pruebas</h1><div class="muted">Verificación integral de la plataforma sin modificar datos.</div></div><button class="primary" id="sktRunAll">Ejecutar pruebas</button></div><div class="panel"><div id="sktTestSummary">Preparado para ejecutar.</div><div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Área</th><th>Prueba</th><th>Resultado</th></tr></thead><tbody id="sktTestBody"></tbody></table></div></div>`;
 app.innerHTML=html;
 async function run(){

  summary.innerHTML=`<strong>${ok}/${tests.length}</strong> comprobaciones correctas. ${ok===tests.length?'La estructura principal está lista para las pruebas funcionales.':'Hay comprobaciones que requieren revisión.'}`;
 }
 document.getElementById('sktRunAll').onclick=run; run();
};
function addMenu(){if(!isAdmin())return;const nav=document.getElementById('nav');if(!nav||nav.querySelector('[data-skt-tests]'))return;const b=document.createElement('button');b.type='button';b.className='nav-item';b.dataset.sktTests='1';b.innerHTML='🧪 <span>Centro de pruebas</span>';b.onclick=()=>window.sktCentroPruebas();nav.appendChild(b)}
let n=0;const t=setInterval(()=>{addMenu();if(++n>60)clearInterval(t)},250);window.addEventListener('skt:role-ready',()=>setTimeout(addMenu,300));
})();

<script>
/* ===== v7.2 QA REAL: comprobaciones de datos y relaciones Supabase ===== */
(function(){
'use strict';
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
window.sktQAReal=async function(){
  if(window.currentUser?.role!=='Administrador'){alert('Solo el Administrador puede ejecutar la prueba integral.');return;}
  const app=document.getElementById('app'); if(!app)return;
  const tests=[];
  const add=async(name,fn)=>{try{const r=await fn();tests.push([name,!!r,typeof r==='string'?r:'OK']);}catch(e){tests.push([name,false,String(e?.message||e)]);}};
  app.innerHTML=`<div class="head"><div><h1>Prueba funcional real</h1><div class="muted">Verifica conexión, datos y relaciones de Supabase sin modificar registros.</div></div><button class="primary" id="qaRealRun">Ejecutar nuevamente</button></div><div class="panel"><div id="qaRealSummary">Ejecutando…</div><div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Prueba</th><th>Resultado</th><th>Detalle</th></tr></thead><tbody id="qaRealBody"></tbody></table></div></div>`;
  async function run(){
    const body=document.getElementById('qaRealBody'),summary=document.getElementById('qaRealSummary');
    body.innerHTML='';tests.length=0;
    if(!(window.client||window.sktSupabase)){tests.push(['Cliente Supabase disponible',false,'No existe cliente Supabase']);}
    else{
      await add('Sesión autenticada',async()=>!!window.currentUser?.id||'No hay usuario actual');
      for(const t of ['profiles','students','teachers','courses','enrollments','evaluations','grades','attendance']){
        await add('Lectura de tabla '+t,async()=>{const r=await (window.client||window.sktSupabase).from(t).select('*',{count:'exact',head:true}); if(r.error)throw r.error; return (r.count??0)+' registros';});
      }
      await add('Perfil Administrador existe',async()=>{const r=await (window.client||window.sktSupabase).from('profiles').select('id,role').eq('role','Administrador').limit(1);if(r.error)throw r.error;return r.data?.length?'Encontrado':'No encontrado';});
      await add('Docente vinculado a usuario',async()=>{const r=await (window.client||window.sktSupabase).from('teachers').select('id,user_id').not('user_id','is',null).limit(1);if(r.error)throw r.error;return r.data?.length?'Vínculo encontrado':'Sin vínculo';});
      await add('Estudiante vinculado a usuario',async()=>{const r=await (window.client||window.sktSupabase).from('students').select('id,user_id').not('user_id','is',null).limit(1);if(r.error)throw r.error;return r.data?.length?'Vínculo encontrado':'Sin vínculo';});
      await add('Cursos con matrícula',async()=>{const r=await (window.client||window.sktSupabase).from('enrollments').select('id,course_id').limit(1);if(r.error)throw r.error;return r.data?.length?'Matrícula encontrada':'Sin matrículas';});
      await add('Evaluaciones registradas',async()=>{const r=await (window.client||window.sktSupabase).from('evaluations').select('id,course_id').limit(1);if(r.error)throw r.error;return r.data?.length?'Evaluación encontrada':'Sin evaluaciones';});
      await add('Calificaciones registradas',async()=>{const r=await (window.client||window.sktSupabase).from('grades').select('id').limit(1);if(r.error)throw r.error;return r.data?.length?'Calificación encontrada':'Sin calificaciones';});
      await add('Asistencia registrada',async()=>{const r=await (window.client||window.sktSupabase).from('attendance').select('id').limit(1);if(r.error)throw r.error;return r.data?.length?'Registro encontrado':'Sin asistencia';});
    }
    let ok=0;for(const [name,pass,detail] of tests){if(pass)ok++;body.insertAdjacentHTML('beforeend',`<tr><td>${esc(name)}</td><td>${pass?'✓ Correcto':'✗ Revisar'}</td><td>${esc(detail)}</td></tr>`)}
    summary.innerHTML=`<strong>${ok}/${tests.length}</strong> pruebas correctas. ${ok===tests.length?'La conexión y las relaciones principales responden correctamente.':'Hay pruebas que requieren revisión.'}`;
  }
  document.getElementById('qaRealRun').onclick=run;run();
};

(function(){
  'use strict';
  const previousPage=window.page;
  if(typeof window.sktVirtualClassesRender==='function')window.sktRenderClases=window.sktVirtualClassesRender;
  window.page=function(page){
    if(page==='clases'&&typeof window.sktRenderClases==='function')return window.sktRenderClases();
    return previousPage&&previousPage(page);
  };
  if(typeof window.sktVirtualClassForm==='function')window.sktClaseForm=window.sktVirtualClassForm;
  if(typeof window.sktVirtualClassDelete==='function')window.sktClaseDelete=window.sktVirtualClassDelete;
  function addStudentVirtualClasses(){
    if(String(window.currentUser?.role||'').trim()!=='Estudiante')return;
    const menu=document.querySelector('#nav .skt48-menu');
    if(!menu||menu.querySelector('[data-skt-virtual-classes]'))return;
    const button=document.createElement('button');
    button.type='button';
    button.textContent='🎥  Clases Virtuales';
    button.setAttribute('data-skt-virtual-classes','1');
    button.setAttribute('data-role-page','clases');
    button.onclick=function(){
      menu.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
      button.classList.add('active');
      window.sktRenderClases();
    };
    menu.appendChild(button);
  }
  const nav=document.getElementById('nav');
  if(nav)new MutationObserver(addStudentVirtualClasses).observe(nav,{childList:true,subtree:true});
  window.addEventListener('skt:role-ready',()=>setTimeout(addStudentVirtualClasses,50));
  window.addEventListener('skt:student-ready',()=>setTimeout(addStudentVirtualClasses,50));
  window.addEventListener('load',()=>setTimeout(addStudentVirtualClasses,100));
})();

<script>
/* ===== v5.9 CONFIGURACIÓN Y USUARIOS/ROLES ===== */
(function(){
  'use strict';
  const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const isAdmin=()=>window.currentUser?.role==='Administrador';
  const getCfg=()=>{try{return JSON.parse(localStorage.getItem('skt_platform_config')||'{}')}catch(e){return {}}};
  const saveCfg=x=>localStorage.setItem('skt_platform_config',JSON.stringify(x));

  window.sktConfiguracion=async function(){
    if(!isAdmin()){alert('Solo el Administrador puede acceder a Configuración.');return;}
    const c=getCfg();
    app.innerHTML=`<div class="head"><div><h1>Configuración</h1><div class="muted">Configuración general de Matemática Virtual “SKT” – Pisco</div></div></div>
      <div class="panel"><h3>Datos de la institución</h3>
      <form id="sktCfgForm" class="form">
        <label>Nombre de la plataforma<input name="name" value="${esc(c.name||'Matemática Virtual “SKT” – Pisco')}"></label>
        <label>Institución educativa<input name="school" value="${esc(c.school||'Matemática Virtual “SKT” – Pisco')}"></label>
        <label>Periodo académico<input name="period" value="${esc(c.period||'2026')}"></label>
        <label>Ciudad<input name="city" value="${esc(c.city||'Pisco')}"></label>
        <label class="full">Descripción<textarea name="description" rows="4">${esc(c.description||'Plataforma educativa para gestión académica y aprendizaje de Matemática.')}</textarea></label>
        <div class="full"><button class="primary" id="sktCfgSave">Guardar configuración</button></div>
      </form></div>
      <div class="panel"><h3>Estado de la plataforma</h3><div class="toolbar">
        <div class="badge">Supabase: ${window.sktSupabase?'Conectado':'No conectado'}</div>
        <div class="badge">Rol actual: ${esc(window.currentUser?.role||'—')}</div>
      </div></div>`;
    document.getElementById('sktCfgForm').onsubmit=e=>{
      e.preventDefault();const f=new FormData(e.target);const n={name:String(f.get('name')),school:String(f.get('school')),period:String(f.get('period')),city:String(f.get('city')),description:String(f.get('description'))};saveCfg(n);
      document.title=n.name+' | '+(window.currentUser?.role||'');alert('Configuración guardada correctamente.');
    };
  };

  const oldPage=window.page;
  window.page=function(p){if(p==='configuracion')return window.sktConfiguracion();return oldPage(p)};

  /* Garantiza que el acceso de Usuarios y roles esté disponible al Administrador. */
  function ensureUsers(){
    if(!isAdmin())return;
    const nav=document.getElementById('nav');if(!nav)return;
    let b=nav.querySelector("button[data-page='usuarios']");
    if(!b){b=document.createElement('button');b.dataset.page='usuarios';b.innerHTML='👤 &nbsp; Usuarios y roles';nav.appendChild(b);}
    b.onclick=()=>window.page('usuarios');
  }
  setTimeout(ensureUsers,800);setTimeout(ensureUsers,1800);window.addEventListener('load',()=>setTimeout(ensureUsers,300));
})();
</script>


<script>
/* ===== v7.3: botón de prueba funcional persistente ===== */
(function(){
  'use strict';
  function installQA(){
    const nav=document.getElementById('nav');
    if(!nav || !window.currentUser || window.currentUser.role!=='Administrador') return;
    if(nav.querySelector('[data-skt-qa-visible]')) return;
    const b=document.createElement('button');
    b.type='button';
    b.className='nav-item';
    b.setAttribute('data-skt-qa-visible','1');
    b.innerHTML='🔬 <span>Prueba funcional real</span>';
    b.style.cssText='display:flex!important;width:100%;text-align:left;cursor:pointer;';
    b.onclick=function(){
      if(typeof window.sktQAReal==='function') window.sktQAReal();
      else alert('La prueba funcional todavía no está disponible.');
    };
    nav.appendChild(b);
  }
  function watch(){
    installQA();
    const nav=document.getElementById('nav');
    if(nav && !nav.__sktQaObserver){
      const obs=new MutationObserver(function(){
        if(window.currentUser?.role==='Administrador') installQA();
      });
      obs.observe(nav,{childList:true,subtree:true});
      nav.__sktQaObserver=obs;
    }
  }
  const timer=setInterval(watch,300);
  setTimeout(()=>clearInterval(timer),120000);
  window.addEventListener('skt:role-ready',()=>setTimeout(watch,50));
  window.addEventListener('load',watch);
})();
</script>
