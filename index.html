<script>
/* ===== v1.6: EVALUACIONES + CALIFICACIONES 100% SUPABASE ===== */
(function(){
  "use strict";
  const db=()=>window.sktSupabase;
  let evaluations=[],courses=[],students=[],enrollments=[],grades=[];
  const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

  async function loadGradesViewData(){
    if(!db()){ alert("Supabase no está conectado."); return false; }

    const [ev,cr,gr]=await Promise.all([
      db().from("evaluations").select("id,course_id,title,evaluation_date,weight,created_at").order("evaluation_date",{ascending:true}),
      db().from("courses").select("id,code,name,grade,section,active").eq("active",true).order("code"),
      db().from("grades").select("id,evaluation_id,student_id,score,created_at")
    ]);

    for(const r of [ev,cr,gr]){
      if(r.error){ alert("Error de Supabase:\n"+r.error.message); console.error(r.error); return false; }
    }

    evaluations=ev.data||[];
    courses=cr.data||[];
    grades=gr.data||[];
    return true;
  }

  async function loadCourseRoster(courseId){
    if(!db() || !courseId){ return {roster:[], enrollments:[]}; }

    const [en,st]=await Promise.all([
      db().from("enrollments").select("id,student_id,course_id,enrolled_at").eq("course_id",courseId),
      db().from("students").select("id,code,full_name,grade,section,active").eq("active",true).order("code")
    ]);

    if(en.error){ alert("Error de Supabase:\n"+en.error.message); console.error(en.error); return {roster:[], enrollments:[]}; }
    if(st.error){ alert("Error de Supabase:\n"+st.error.message); console.error(st.error); return {roster:[], enrollments:[]}; }

    const enrollList=en.data||[];
    const ids=[...new Set(enrollList.map(x=>x.student_id))];
    const rosterData = ids.length ? (st.data||[]).filter(s=>ids.includes(s.id)) : [];

    const seenStudents=new Set(students.map(s=>s.id));
    const mergedStudents=[...students];
    for(const s of rosterData){ if(!seenStudents.has(s.id)){ seenStudents.add(s.id); mergedStudents.push(s); } }
    students=mergedStudents;

    const seenEnrollments=new Set(enrollments.map(e=>e.id));
    const mergedEnrollments=[...enrollments];
    for(const e of enrollList){ if(!seenEnrollments.has(e.id)){ seenEnrollments.add(e.id); mergedEnrollments.push(e); } }
    enrollments=mergedEnrollments;

    return {roster:rosterData, enrollments:enrollList};
  }

  function courseById(id){ return courses.find(c=>c.id===id); }
  function courseLabel(id){
    const c=courseById(id);
    return c ? `${c.name} · ${c.grade} ${c.section} · ${c.code}` : "Curso";
  }
  function roster(courseId){
    const ids=new Set((enrollments||[]).filter(e=>e.course_id===courseId).map(e=>e.student_id));
    return students.filter(s=>ids.has(s.id));
  }
  function gradeOf(eid,sid){
    const g=grades.find(x=>x.evaluation_id===eid && x.student_id===sid);
    return g ? g.score : "";
  }

  async function renderEval(){
    if(!(await loadGradesViewData())) return;
    app.innerHTML=`
      <div class="head">
        <div><h1>Evaluaciones</h1><div class="muted">Datos reales en Supabase · ${evaluations.length} evaluaciones</div></div>
        <button class="primary" onclick="newEvaluationDB()">+ Nueva evaluación</button>
      </div>
      <div class="panel">
        <div class="toolbar">
          <input id="evSearchDB" placeholder="Buscar evaluación o curso..." oninput="filterEvaluationsDB()">
        </div>
        <div style="overflow:auto">
          <table class="table">
            <thead><tr><th>Evaluación</th><th>Curso</th><th>Fecha</th><th>Peso</th><th>Estudiantes</th><th>Acciones</th></tr></thead>
            <tbody id="evRowsDB"></tbody>
          </table>
        </div>
      </div>`;
    filterEvaluationsDB();
  }

  window.filterEvaluationsDB=function(){
    const q=(document.getElementById("evSearchDB")?.value||"").toLowerCase();
    const rows=evaluations.filter(e=>{
      const text=`${e.title} ${courseLabel(e.course_id)} ${e.evaluation_date}`.toLowerCase();
      return !q || text.includes(q);
    });
    const el=document.getElementById("evRowsDB");
    if(!el)return;
    el.innerHTML=rows.map(e=>{
      const gradedCount=grades.filter(g=>g.evaluation_id===e.id).length;
      const total=roster(e.course_id).length || 0;
      const totalText=total ? `${gradedCount}/${total}` : `${gradedCount} nota${gradedCount===1?"":"s"}`;
      return `<tr>
        <td><b>${esc(e.title)}</b></td>
        <td>${esc(courseLabel(e.course_id))}</td>
        <td>${esc(e.evaluation_date)}</td>
        <td>${Number(e.weight??1).toFixed(2)}</td>
        <td>${totalText}</td>
        <td class="actions">
          <button onclick="gradeBookDB('${e.id}')">Calificar</button>
          <button onclick="editEvaluationDB('${e.id}')">Editar</button>
          <button onclick="deleteEvaluationDB2('${e.id}')">Eliminar</button>
        </td>
      </tr>`;
    }).join("") || `<tr><td colspan="6" class="empty">No hay evaluaciones registradas.</td></tr>`;
  };

  window.newEvaluationDB=function(id){
    const e=id ? evaluations.find(x=>x.id===id) : null;
    app.innerHTML=`
      <div class="head">
        <div><h1>${id?"Editar":"Nueva"} evaluación</h1><div class="muted">Registro directo en public.evaluations</div></div>
        <button class="secondary" onclick="renderEval()">← Volver</button>
      </div>
      <div class="panel">
        <form id="evalDBForm" class="form">
          <label>Nombre
            <input name="title" required value="${esc(e?.title||"")}" placeholder="Ej. Ecuaciones de primer grado">
          </label>
          <label>Curso
            <select name="course_id" required>
              <option value="">Seleccione un curso</option>
              ${courses.map(c=>`<option value="${c.id}" ${e&&e.course_id===c.id?"selected":""}>${esc(c.name)} · ${esc(c.grade)} ${esc(c.section)} · ${esc(c.code)}</option>`).join("")}
            </select>
          </label>
          <label>Fecha
            <input name="evaluation_date" type="date" required value="${esc(e?.evaluation_date||new Date().toISOString().slice(0,10))}">
          </label>
          <label>Peso
            <input name="weight" type="number" min="0.01" step="0.01" required value="${Number(e?.weight??1)}">
          </label>
          <div class="full">
            <button class="primary" id="evalSaveBtn">${id?"Actualizar evaluación":"Guardar evaluación"}</button>
            <button type="button" class="secondary" onclick="renderEval()">Cancelar</button>
          </div>
        </form>
      </div>`;

    document.getElementById("evalDBForm").onsubmit=async ev=>{
      ev.preventDefault();
      const btn=document.getElementById("evalSaveBtn");
      btn.disabled=true; btn.textContent="Guardando...";

      const f=new FormData(ev.target);
      const payload={
        title:String(f.get("title")||"").trim(),
        course_id:String(f.get("course_id")||""),
        evaluation_date:String(f.get("evaluation_date")||""),
        weight:Number(f.get("weight")||1)
      };

      if(!payload.title || !payload.course_id || !payload.evaluation_date){
        alert("Completa todos los campos obligatorios.");
        btn.disabled=false; btn.textContent=id?"Actualizar evaluación":"Guardar evaluación";
        return;
      }

      const result=id
        ? await db().from("evaluations").update(payload).eq("id",id).select().single()
        : await db().from("evaluations").insert(payload).select().single();

      if(result.error){
        console.error("Evaluación:",result.error);
        alert("NO se guardó la evaluación.\n\n"+result.error.message);
        btn.disabled=false; btn.textContent=id?"Actualizar evaluación":"Guardar evaluación";
        return;
      }

      alert(id ? "Evaluación actualizada correctamente." : "Evaluación guardada correctamente.");
      await renderEval();
    };
  };

  window.editEvaluationDB=function(id){ newEvaluationDB(id); };

  window.deleteEvaluationDB2=async function(id){
    const e=evaluations.find(x=>x.id===id);
    if(!e)return;
    if(!confirm(`¿Eliminar "${e.title}"? Se eliminarán también sus calificaciones.`))return;
    const {error}=await db().from("evaluations").delete().eq("id",id);
    if(error){alert("No se pudo eliminar:\n"+error.message);return;}
    await renderEval();
  };

  window.gradeBookDB=async function(eid){
    if(!(await loadGradesViewData()))return;
    const e=evaluations.find(x=>x.id===eid);
    if(!e){alert("Evaluación no encontrada.");return;}

    let r = roster(e.course_id);
    if(!r.length){
      const loaded=await loadCourseRoster(e.course_id);
      r = loaded.roster || [];
      if(!r.length && !(loaded.enrollments||[]).length){
        alert("No hay estudiantes matriculados en este curso.");
        return;
      }
    }

    app.innerHTML=`
      <div class="head">
        <div>
          <h1>Calificaciones</h1>
          <div class="muted"><b>${esc(e.title)}</b> · ${esc(courseLabel(e.course_id))} · escala 0–20</div>
        </div>
        <button class="secondary" onclick="renderGradesDB()">← Volver a calificaciones</button>
      </div>
      <div class="panel">
        <div style="overflow:auto">
          <table class="table">
            <thead><tr><th>Código</th><th>Estudiante</th><th>Grado</th><th>Nota</th></tr></thead>
            <tbody>
              ${r.map(s=>{
                const v=gradeOf(e.id,s.id);
                return `<tr>
                  <td>${esc(s.code)}</td>
                  <td><b>${esc(s.full_name)}</b></td>
                  <td>${esc(s.grade)} ${esc(s.section)}</td>
                  <td><input id="score_${s.id}" type="number" min="0" max="20" step="0.01" value="${v}" style="width:100px;padding:8px;border:1px solid #dce4ee;border-radius:7px"></td>
                </tr>`;
              }).join("") || `<tr><td colspan="4" class="empty">No hay estudiantes matriculados en este curso.</td></tr>`}
            </tbody>
          </table>
        </div>
        <br>
        <button class="primary" id="saveGradesDB">Guardar calificaciones en Supabase</button>
      </div>`;

    document.getElementById("saveGradesDB").onclick=async()=>{
      const btn=document.getElementById("saveGradesDB");
      btn.disabled=true; btn.textContent="Guardando...";

      const rows=[];
      for(const s of r){
        const input=document.getElementById("score_"+s.id);
        if(input && input.value!==""){
          const score=Number(input.value);
          if(!Number.isFinite(score)||score<0||score>20){
            alert(`La nota de ${s.full_name} debe estar entre 0 y 20.`);
            btn.disabled=false; btn.textContent="Guardar calificaciones en Supabase";
            return;
          }
          rows.push({evaluation_id:e.id,student_id:s.id,score});
        }
      }

      /* Upsert evita duplicados gracias a unique(evaluation_id, student_id). */
      let saveAccepted=false;
      if(rows.length){
        const upsertResult=await db().from("grades").upsert(rows,{onConflict:"evaluation_id,student_id"});
        if(upsertResult.error){
          const message=String(upsertResult.error.message||"");
          const timeoutLike=/gateway timeout|timed out|timeout|504/i.test(message);
          if(timeoutLike){
            const verify=await db().from("grades").select("evaluation_id,student_id,score").eq("evaluation_id",e.id);
            if(!verify.error){
              const persisted=new Map((verify.data||[]).map(r=>[`${r.evaluation_id}:${r.student_id}`, Number(r.score)]));
              saveAccepted=rows.every(r=>persisted.get(`${r.evaluation_id}:${r.student_id}`)===r.score);
            }
          }
          if(!saveAccepted){
            console.error("Calificaciones:",upsertResult.error);
            alert("NO se pudieron guardar las calificaciones.\n\n"+message);
            btn.disabled=false; btn.textContent="Guardar calificaciones en Supabase";
            return;
          }
        } else {
          saveAccepted=true;
        }
      } else {
        saveAccepted=true;
      }

      if(!saveAccepted){
        alert("No se pudo confirmar que las calificaciones quedaron guardadas.");
        btn.disabled=false; btn.textContent="Guardar calificaciones en Supabase";
        return;
      }

      alert("Calificaciones guardadas correctamente en Supabase.");
      btn.disabled=false; btn.textContent="Guardar calificaciones en Supabase";
      await loadGradesViewData();
      gradeBookDB(e.id);
    };
  };

  window.renderGradesDB=async function(){
    if(!(await loadGradesViewData()))return;

    const totalGrades=grades.length;
    const avg=totalGrades ? grades.reduce((a,g)=>a+Number(g.score),0)/totalGrades : 0;

    app.innerHTML=`
      <div class="head">
        <div><h1>Calificaciones</h1><div class="muted">Libro de calificaciones conectado a Supabase</div></div>
      </div>
      <div class="cards">
        <div class="card"><small>EVALUACIONES</small><div class="num">${evaluations.length}</div></div>
        <div class="card"><small>NOTAS REGISTRADAS</small><div class="num">${totalGrades}</div></div>
        <div class="card"><small>PROMEDIO</small><div class="num">${avg.toFixed(1)}</div></div>
        <div class="card"><small>CURSOS</small><div class="num">${courses.length}</div></div>
      </div>
      <div class="panel" style="margin-top:16px">
        <h3>Seleccione una evaluación para calificar</h3>
        ${evaluations.map(e=>`
          <div class="row">
            <span><b>${esc(e.title)}</b><br><span class="muted">${esc(courseLabel(e.course_id))} · ${esc(e.evaluation_date)}</span></span>
            <button class="primary" onclick="gradeBookDB('${e.id}')">Calificar</button>
          </div>
        `).join("") || `<div class="empty">Primero cree una evaluación.</div>`}
      </div>`;
  };

  /* Sobrescribir los accesos de Evaluaciones y Calificaciones. */
  const oldPage=window.page;
  window.page=function(p){
    if(p==="evaluaciones") return renderEval();
    if(p==="calificaciones") return renderGradesDB();
    return oldPage(p);
  };

  /* Activar también botones internos que apunten a las funciones antiguas. */
  window.evalsModule=renderEval;
  window.gradesModule=renderGradesDB;

  window.addEventListener("skt:role-ready",()=>setTimeout(async()=>{
    if(db()) await loadGradesViewData();
  },180),{once:true});
})();
</script>


<script>
/* ===== v1.7: ASISTENCIA REAL EN SUPABASE ===== */
(function(){
  "use strict";
  const db=()=>window.sktSupabase;
  let students=[], courses=[], enrollments=[], attendance=[];

  const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

  async function loadAttendanceData(){
    if(!db()){ alert("Supabase no está conectado."); return false; }
    const [s,c,e,a]=await Promise.all([
      db().from("students").select("id,code,full_name,grade,section,active").eq("active",true).order("code"),
      db().from("courses").select("id,code,name,grade,section,active").eq("active",true).order("code"),
      db().from("enrollments").select("id,student_id,course_id,enrolled_at"),
      db().from("attendance").select("id,course_id,student_id,attendance_date,status,created_at").order("attendance_date",{ascending:false})
    ]);
    for(const r of [s,c,e,a]){
      if(r.error){ alert("Error de Supabase:\n"+r.error.message); console.error(r.error); return false; }
    }
    students=s.data||[]; courses=c.data||[]; enrollments=e.data||[]; attendance=a.data||[];
    return true;
  }

  async function ensureAttendanceCatalog(){
    if(!db()){ alert("Supabase no está conectado."); return false; }
    if(students.length && courses.length && enrollments.length) return true;

    const [s,c,e]=await Promise.all([
      db().from("students").select("id,code,full_name,grade,section,active").eq("active",true).order("code"),
      db().from("courses").select("id,code,name,grade,section,active").eq("active",true).order("code"),
      db().from("enrollments").select("id,student_id,course_id,enrolled_at")
    ]);

    for(const r of [s,c,e]){
      if(r.error){ alert("Error de Supabase:\n"+r.error.message); console.error(r.error); return false; }
    }

    students=s.data||[]; courses=c.data||[]; enrollments=e.data||[];
    return true;
  }

  function courseLabel(id){
    const c=courses.find(x=>x.id===id);
    return c ? `${c.name} · ${c.grade} ${c.section} · ${c.code}` : "Curso";
  }
  function studentName(id){
    const s=students.find(x=>x.id===id);
    return s ? `${s.full_name} · ${s.code}` : "Estudiante";
  }
  function roster(cid){
    const ids=new Set(enrollments.filter(e=>e.course_id===cid).map(e=>e.student_id));
    return students.filter(s=>ids.has(s.id));
  }
  function statusClass(st){ return st==="Presente"?"":"warn"; }

  window.attendanceModuleDB=async function(){
    if(!(await loadAttendanceData())) return;

    app.innerHTML=`
      <div class="head">
        <div><h1>Asistencia</h1><div class="muted">Registro real en Supabase · ${attendance.length} asistencias</div></div>
        <button class="primary" onclick="attendanceFormDB()">+ Nueva sesión</button>
      </div>
      <div class="panel">
        <div class="toolbar">
          <input id="attSearchDB" placeholder="Buscar curso, estudiante o fecha..." oninput="renderAttendanceRowsDB()">
        </div>
        <div style="overflow:auto">
          <table class="table">
            <thead><tr><th>Fecha</th><th>Curso</th><th>Estudiante</th><th>Estado</th></tr></thead>
            <tbody id="attRowsDB"></tbody>
          </table>
        </div>
      </div>`;
    renderAttendanceRowsDB();
  };

  window.renderAttendanceRowsDB=function(){
    const q=(document.getElementById("attSearchDB")?.value||"").toLowerCase();
    const rows=attendance.filter(a=>{
      const text=`${a.attendance_date} ${courseLabel(a.course_id)} ${studentName(a.student_id)} ${a.status}`.toLowerCase();
      return !q||text.includes(q);
    });
    const el=document.getElementById("attRowsDB"); if(!el)return;
    el.innerHTML=rows.map(a=>`
      <tr>
        <td>${esc(a.attendance_date)}</td>
        <td>${esc(courseLabel(a.course_id))}</td>
        <td>${esc(studentName(a.student_id))}</td>
        <td><span class="badge ${statusClass(a.status)}">${esc(a.status)}</span></td>
      </tr>`).join("") ||
      `<tr><td colspan="4" class="empty">No hay registros de asistencia.</td></tr>`;
  };

  window.attendanceFormDB=async function(){
    if(!(await ensureAttendanceCatalog())) return;
    app.innerHTML=`
      <div class="head">
        <div><h1>Nueva sesión de asistencia</h1><div class="muted">Selecciona un curso y registra el estado de cada estudiante.</div></div>
        <button class="secondary" onclick="attendanceModuleDB()">← Volver</button>
      </div>
      <div class="panel">
        <form id="attendanceDBForm">
          <div class="form">
            <label>Fecha
              <input name="attendance_date" type="date" required value="${new Date().toISOString().slice(0,10)}">
            </label>
            <label>Curso
              <select name="course_id" id="attendanceCourseDB" required>
                <option value="">Seleccione un curso</option>
                ${courses.map(c=>`<option value="${c.id}">${esc(courseLabel(c.id))}</option>`).join("")}
              </select>
            </label>
          </div>
          <br>
          <div id="attendanceRosterDB" class="empty">Selecciona un curso.</div>
          <br>
          <button class="primary" id="saveAttendanceDB">Guardar asistencia en Supabase</button>
          <button type="button" class="secondary" onclick="attendanceModuleDB()">Cancelar</button>
        </form>
      </div>`;

    const form=document.getElementById("attendanceDBForm");
    const courseSel=document.getElementById("attendanceCourseDB");
    const rosterBox=document.getElementById("attendanceRosterDB");

    function draw(){
      const r=roster(courseSel.value);
      rosterBox.innerHTML=r.length?`
        <div style="overflow:auto">
          <table class="table">
            <thead><tr><th>Estudiante</th><th>Estado</th></tr></thead>
            <tbody>${r.map(s=>`
              <tr>
                <td><b>${esc(s.full_name)}</b><div class="muted">${esc(s.code)} · ${esc(s.grade)} ${esc(s.section)}</div></td>
                <td>
                  <select name="status_${s.id}">
                    <option value="Presente">Presente</option>
                    <option value="Tardanza">Tardanza</option>
                    <option value="Falta">Falta</option>
                  </select>
                </td>
              </tr>`).join("")}</tbody>
          </table>
        </div>` : "No hay estudiantes matriculados en este curso.";
    }

    courseSel.onchange=draw;
    draw();

    form.onsubmit=async ev=>{
      ev.preventDefault();
      const cid=courseSel.value, date=form.elements.attendance_date.value;
      if(!cid){alert("Selecciona un curso.");return;}
      const r=roster(cid);
      if(!r.length){alert("Este curso no tiene estudiantes matriculados.");return;}

      const btn=document.getElementById("saveAttendanceDB");
      btn.disabled=true; btn.textContent="Guardando...";

      /* Eliminar registros existentes de esa misma sesión para poder corregirla y guardar de nuevo. */
      const {error:delError}=await db().from("attendance").delete()
        .eq("course_id",cid).eq("attendance_date",date);

      if(delError){
        alert("No se pudo preparar la sesión:\n"+delError.message);
        btn.disabled=false; btn.textContent="Guardar asistencia en Supabase";
        return;
      }

      const rows=r.map(s=>({
        course_id:cid,
        student_id:s.id,
        attendance_date:date,
        status:form.elements["status_"+s.id].value
      }));

      const {error}=await db().from("attendance").insert(rows);
      if(error){
        alert("NO se pudo guardar la asistencia:\n"+error.message);
        btn.disabled=false; btn.textContent="Guardar asistencia en Supabase";
        return;
      }

      alert("Asistencia guardada correctamente en Supabase.");
      attendanceModuleDB();
    };
  };

  const oldPage=window.page;
  window.page=function(p){
    if(p==="asistencia") return attendanceModuleDB();
    return oldPage(p);
  };
  window.attendanceModule=attendanceModuleDB;

  window.addEventListener("skt:role-ready",()=>setTimeout(()=>{if(db())loadAttendanceData()},220),{once:true});
})();
</script>


<script>
/* ===== v1.8: DASHBOARD + REPORTES REALES DESDE SUPABASE ===== */
(function(){
  "use strict";
  const db=()=>window.sktSupabase;
  let students=[], teachers=[], courses=[], enrollments=[], evaluations=[], grades=[], attendance=[];

  const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  const avg=a=>a.length?a.reduce((x,y)=>x+Number(y),0)/a.length:0;

  async function loadDashboardData(){
    if(!db()){alert("Supabase no está conectado.");return false;}
    const rs=await Promise.all([
      db().from("students").select("id,code,full_name,grade,section,active"),
      db().from("teachers").select("id,code,full_name,active"),
      db().from("courses").select("id,code,name,grade,section,teacher_id,active"),
      db().from("enrollments").select("id,student_id,course_id,enrolled_at"),
      db().from("evaluations").select("id,course_id,title,evaluation_date,weight"),
      db().from("grades").select("id,evaluation_id,student_id,score"),
      db().from("attendance").select("id,course_id,student_id,attendance_date,status")
    ]);
    for(const r of rs){
      if(r.error){console.error(r.error);alert("Error al cargar datos del Dashboard:\n"+r.error.message);return false;}
    }
    students=rs[0].data||[]; teachers=rs[1].data||[]; courses=rs[2].data||[];
    enrollments=rs[3].data||[]; evaluations=rs[4].data||[]; grades=rs[5].data||[]; attendance=rs[6].data||[];
    return true;
  }

  function studentGrades(sid){return grades.filter(g=>g.student_id===sid).map(g=>Number(g.score));}
  function studentAttendance(sid){
    const a=attendance.filter(x=>x.student_id===sid);
    return a.length ? Math.round(a.filter(x=>x.status!=="Falta").length/a.length*100) : 100;
  }
  function studentAvg(sid){return avg(studentGrades(sid));}
  function riskStudents(){
    return students.filter(s=>studentAvg(s.id)>0&&studentAvg(s.id)<11 || studentAttendance(s.id)<85);
  }
  function courseLabel(cid){
    const c=courses.find(x=>x.id===cid);
    return c ? `${c.name} · ${c.grade} ${c.section}` : "Curso";
  }

  window.dashboardSupabase=async function(){
    if(!(await loadDashboardData()))return;
    const activeStudents=students.filter(s=>s.active!==false);
    const activeTeachers=teachers.filter(t=>t.active!==false);
    const activeCourses=courses.filter(c=>c.active!==false);
    const gradeValues=grades.map(g=>Number(g.score));
    const generalAvg=avg(gradeValues);
    const passed=gradeValues.length?Math.round(gradeValues.filter(x=>x>=11).length/gradeValues.length*100):0;
    const risk=riskStudents();

    const byGrade=["1.º","2.º","3.º","4.º","5.º"].map(g=>{
      const ss=activeStudents.filter(s=>s.grade===g);
      return {g,n:ss.length,a:ss.length?avg(ss.map(s=>studentAvg(s.id)).filter(x=>x>0)):0};
    });

    const upcoming=evaluations.slice().sort((a,b)=>String(a.evaluation_date).localeCompare(String(b.evaluation_date))).slice(0,5);

    app.innerHTML=`
      <div class="head">
        <div><h1>Panel principal</h1><div class="muted">Matemática Virtual “SKT” – Pisco · datos reales de Supabase</div></div>
        <button class="secondary" onclick="dashboardSupabase()">↻ Actualizar</button>
      </div>

      <div class="cards">
        <div class="card"><small>ESTUDIANTES</small><div class="num">${activeStudents.length}</div><div class="good">● Supabase</div></div>
        <div class="card"><small>DOCENTES</small><div class="num">${activeTeachers.length}</div><div class="good">● Supabase</div></div>
        <div class="card"><small>CURSOS ACTIVOS</small><div class="num">${activeCourses.length}</div><div class="good">● Supabase</div></div>
        <div class="card"><small>PROMEDIO GENERAL</small><div class="num">${generalAvg.toFixed(1)}</div><div class="good">● ${grades.length} notas</div></div>
      </div>

      <div class="grid">
        <div>
          <div class="panel">
            <h3>Resumen por grado</h3>
            ${byGrade.map(x=>`<div class="row"><span>${x.g} secundaria <span class="muted">(${x.n} estudiantes)</span></span><b>${x.a?x.a.toFixed(1):"—"}</b></div>`).join("")}
          </div>

          <div class="panel">
            <h3>Indicadores académicos</h3>
            <div class="metricgrid">
              <div class="metric">Aprobación<br><b>${passed}%</b></div>
              <div class="metric">Evaluaciones<br><b>${evaluations.length}</b></div>
              <div class="metric">Matrículas<br><b>${enrollments.length}</b></div>
              <div class="metric">Asistencias<br><b>${attendance.length}</b></div>
              <div class="metric">En riesgo<br><b>${risk.length}</b></div>
              <div class="metric">Docentes<br><b>${activeTeachers.length}</b></div>
            </div>
          </div>
        </div>

        <div>
          <div class="panel">
            <h3>Atención académica</h3>
            ${risk.slice(0,8).map(s=>`
              <div class="row">
                <span><b>${esc(s.full_name)}</b><br><span class="muted">${esc(s.grade)} · ${esc(s.section)}</span></span>
                <span class="badge warn">${studentAvg(s.id).toFixed(1)} · ${studentAttendance(s.id)}%</span>
              </div>`).join("") || `<div class="empty">No hay estudiantes en riesgo.</div>`}
          </div>

          <div class="panel">
            <h3>Próximas evaluaciones</h3>
            ${upcoming.map(e=>`
              <div class="row">
                <span><b>${esc(e.title)}</b><br><span class="muted">${esc(courseLabel(e.course_id))}</span></span>
                <span>${esc(e.evaluation_date)}</span>
              </div>`).join("") || `<div class="empty">No hay evaluaciones.</div>`}
          </div>
        </div>
      </div>`;
  };

  window.reportesSupabase=async function(){
    if(!(await loadDashboardData()))return;
    const activeStudents=students.filter(s=>s.active!==false);
    const values=grades.map(g=>Number(g.score));
    const overall=avg(values);
    const pass=values.length?Math.round(values.filter(x=>x>=11).length/values.length*100):0;
    const atRisk=riskStudents();

    const rows=activeStudents.map(s=>({
      s,
      a:studentAvg(s.id),
      p:studentAttendance(s.id),
      n:studentGrades(s.id).length
    })).sort((a,b)=>b.a-a.b);

    const attendanceAvg=activeStudents.length?Math.round(avg(activeStudents.map(x=>studentAttendance(x.id)))):0;

    const courseStats=courses.map(c=>{
      const enr=enrollments.filter(e=>e.course_id===c.id).map(e=>e.student_id);
      const g=grades.filter(x=>{
        const ev=evaluations.find(e=>e.id===x.evaluation_id);
        return ev&&ev.course_id===c.id;
      }).map(x=>Number(x.score));
      return {c,n:enr.length,avg:avg(g),grades:g.length};
    });

    app.innerHTML=`
      <div class="head">
        <div><h1>Reportes académicos</h1><div class="muted">Indicadores calculados directamente desde Supabase</div></div>
        <button class="secondary" onclick="reportesSupabase()">↻ Actualizar</button>
      </div>

      <div class="cards">
        <div class="card"><small>PROMEDIO GENERAL</small><div class="num">${overall.toFixed(1)}</div></div>
        <div class="card"><small>APROBACIÓN</small><div class="num">${pass}%</div></div>
        <div class="card"><small>ASISTENCIA PROM.</small><div class="num">${attendanceAvg}%</div></div>
        <div class="card"><small>EN RIESGO</small><div class="num">${atRisk.length}</div></div>
      </div>

      <div class="panel">
        <h3>Rendimiento por estudiante</h3>
        <div style="overflow:auto">
          <table class="table">
            <thead><tr><th>Estudiante</th><th>Grado</th><th>Promedio</th><th>Asistencia</th><th>Notas</th><th>Estado</th></tr></thead>
            <tbody>
              ${rows.map(x=>`
                <tr>
                  <td><b>${esc(x.s.full_name)}</b><div class="muted">${esc(x.s.code)}</div></td>
                  <td>${esc(x.s.grade)} ${esc(x.s.section)}</td>
                  <td>${x.a?x.a.toFixed(1):"—"}</td>
                  <td>${x.p}%</td>
                  <td>${x.n}</td>
                  <td>${(x.a>0&&x.a<11)||x.p<85?'<span class="badge warn">Atención</span>':'<span class="badge">Activo</span>'}</td>
                </tr>`).join("") || `<tr><td colspan="6" class="empty">Sin estudiantes.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <h3>Rendimiento por curso</h3>
        <div style="overflow:auto">
          <table class="table">
            <thead><tr><th>Curso</th><th>Grado</th><th>Estudiantes</th><th>Promedio</th><th>Notas</th></tr></thead>
            <tbody>
              ${courseStats.map(x=>`
                <tr>
                  <td><b>${esc(x.c.name)}</b><div class="muted">${esc(x.c.code)}</div></td>
                  <td>${esc(x.c.grade)} ${esc(x.c.section)}</td>
                  <td>${x.n}</td>
                  <td>${x.grades?x.avg.toFixed(1):"—"}</td>
                  <td>${x.grades}</td>
                </tr>`).join("") || `<tr><td colspan="5" class="empty">Sin cursos.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>`;
  };

  /* Los accesos del menú pasan a datos reales. */
  const oldPage=window.page;
  window.page=function(p){
    if(p==="dashboard") return dashboardSupabase();
    if(p==="reportes") return reportesSupabase();
    return oldPage(p);
  };

  window.addEventListener("skt:role-ready",()=>setTimeout(()=>{if(db() && window.currentUser?.role==="Administrador")dashboardSupabase()},300),{once:true});
})();
</script>


<script>
/* ===== v1.9: ROLES Y PERMISOS DE INTERFAZ ===== */
(function(){
  "use strict";

  const ROLE_ADMIN="Administrador", ROLE_TEACHER="Docente", ROLE_STUDENT="Estudiante";

  function getRole(){
    const raw = window.currentUser?.role ?? window.sktProfile?.role ?? "";
    return String(raw).normalize("NFKC").trim();
  }

  function roleAllows(page){
    const role=getRole();

    /* El administrador conserva todos los módulos del prototipo. */
    if(role===ROLE_ADMIN) return true;

    if(role===ROLE_TEACHER){
      return ["dashboard","cursos","clases","evaluaciones","calificaciones","asistencia","reportes","configuracion"].includes(page);
    }

    if(role===ROLE_STUDENT){
      return ["dashboard","cursos","calificaciones","asistencia","reportes","configuracion"].includes(page);
    }

    /* Si aún no se cargó el perfil, NO ocultar el menú: evita dejar la aplicación inutilizable. */
    if(!role) return true;

    return page==="dashboard";
  }

  function applyRoleUI(){
    const role=getRole();
    document.querySelectorAll("#nav button").forEach(btn=>{
      const p=btn.dataset.page;
      btn.style.display=roleAllows(p) ? "" : "none";
    });

    /* Biblioteca / usuarios no son visibles todavía para Docente/Estudiante. */
    document.querySelectorAll("#nav button[data-page='usuarios']").forEach(b=>{
      b.style.display=role===ROLE_ADMIN ? "" : "none";
    });

    const profileBox=document.querySelector(".profile");
    if(profileBox && role){
      const name=window.currentUser?.name || window.sktProfile?.full_name || role;
      profileBox.innerHTML=`🔔 <div class="avatar">${escRole(name)}</div><div><b>${escRole(name)}</b><div class="muted">${escRole(role)} · Matemática Virtual “SKT”</div></div>`;
    }
  }

  function escRole(v){
    return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }

  function deny(){
    alert("No tienes permisos para acceder a este módulo con tu rol actual.");
    if(typeof window.page==="function") window.page("dashboard");
  }

  const oldPage=window.page;
  window.page=function(p){
    if(!roleAllows(p)) return deny();
    return oldPage(p);
  };

  window.sktRoleAllows=roleAllows;

  function refreshRoleUI(){
    try{
      applyRoleUI();
      if(getRole()===ROLE_ADMIN){
        document.querySelectorAll("#nav button").forEach(btn=>btn.style.display="");
      }
    }catch(e){
      console.error("SKT roles UI:",e);
      /* Nunca dejar el menú completamente oculto por un error de roles. */
      document.querySelectorAll("#nav button").forEach(btn=>btn.style.display="");
    }
  }

  setTimeout(refreshRoleUI,1200);
  window.addEventListener("load",()=>setTimeout(refreshRoleUI,500));
  setTimeout(refreshRoleUI,2500);

  /* Cambia la visibilidad de acciones sensibles. */
  setInterval(()=>{
    const role=getRole();
    if(!role || role===ROLE_ADMIN) return;
    document.querySelectorAll(".primary").forEach(btn=>{
      const txt=(btn.textContent||"").trim().toLowerCase();

      /* Los botones de alta/gestión se reservan al Administrador en esta fase. */
      if(/nuevo estudiante|nuevo docente|nuevo curso|nueva evaluación|nueva sesión|nueva matrícula|guardar en supabase|guardar calificaciones/.test(txt)){
        btn.style.display="none";
      }
    });
  },800);
})();
</script>


<script>

(function(){

  const db=()=>window.sktSupabase;

  const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

  async function loadProfiles(){

    const {data,error}=await db()
      .from("profiles")
      .select("id,full_name,role,active,created_at")

  function initials(name){

                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="userRowsDB"></tbody>
          </table>

      </div>

      <div class="panel">
        <h3>Cómo crear una cuenta nueva</h3>
        <div class="muted">
          1. Crea la cuenta en Supabase → Authentication → Users.
          2. El sistema crea automáticamente su perfil.
          3. Regresa aquí y asigna el rol correspondiente.
        </div>
      </div>`;

    renderUsersDB();
  };

  window.renderUsersDB=function(){
    const q=(document.getElementById("uqDB")?.value||"").toLowerCase();
    const r=document.getElementById("urDB")?.value||"";
    const a=document.getElementById("uaDB")?.value||"";

    const rows=profiles.filter(p=>{
      const text=`${p.full_name} ${p.id}`.toLowerCase();

      return (!q||text.includes(q)) && (!r||p.role===r) && (!a||(a==="Activo"&&active)||(a==="Inactivo"&&!active));
    });

    const el=document.getElementById("userRowsDB");
    if(!el)return;

    el.innerHTML=rows.map(p=>`
      <tr>

            <div><b>${esc(p.full_name)}</b><div class="muted" style="font-size:10px">${esc(p.id)}</div></div>
          </div>
        </td>
        <td><span class="badge">${esc(p.role)}</span></td>
        <td><span class="badge ${p.active===false?"warn":""}">${p.active===false?"Inactivo":"Activo"}</span></td>

      </tr>`).join("") ||
      `<tr><td colspan="5" class="empty">No hay usuarios que coincidan.</td></tr>`;
  };

  window.editProfileRole=async function(id){
    const p=profiles.find(x=>x.id===id);
    if(!p)return;

    app.innerHTML=`
      <div class="head">
        <div><h1>Editar usuario</h1><div class="muted">${esc(p.full_name)}</div></div>
        <button class="secondary" onclick="usersSupabase()">← Volver</button>
      </div>
      <div class="panel">
        <form id="profileRoleForm" class="form">
          <label>Nombre
            <input value="${esc(p.full_name)}" disabled>
          </label>
          <label>Rol
            <select name="role">
              <option ${p.role==="Administrador"?"selected":""}>Administrador</option>
              <option ${p.role==="Docente"?"selected":""}>Docente</option>
              <option ${p.role==="Estudiante"?"selected":""}>Estudiante</option>
            </select>
          </label>
          <label>Estado
            <select name="active">
              <option value="true" ${p.active!==false?"selected":""}>Activo</option>
              <option value="false" ${p.active===false?"selected":""}>Inactivo</option>
            </select>
          </label>
          <div></div>
          <div class="full">
            <button class="primary" id="profileSaveBtn">Guardar cambios</button>
            <button type="button" class="secondary" onclick="usersSupabase()">Cancelar</button>
          </div>
        </form>
      </div>`;

    document.getElementById("profileRoleForm").onsubmit=async ev=>{
      ev.preventDefault();
      const f=new FormData(ev.target);
      const newRole=String(f.get("role"));
      const active=String(f.get("active"))==="true";

      if(p.id===window.currentUser?.id && newRole!=="Administrador"){
        if(!confirm("Estás cambiando tu propio rol de Administrador. ¿Continuar?"))return;
      }

      const btn=document.getElementById("profileSaveBtn");
      btn.disabled=true;btn.textContent="Guardando...";

      const {error}=await db().from("profiles").update({role:newRole,active}).eq("id",id);
      if(error){
        alert("No se pudieron guardar los cambios:\n"+error.message);
        btn.disabled=false;btn.textContent="Guardar cambios";
        return;
      }

      if(p.id===window.currentUser?.id){
        window.currentUser.role=newRole;
        window.currentUser.active=active;
      }

      alert("Usuario actualizado correctamente.");
      await usersSupabase();
    };
  };

  window.showUserInstructions=function(){
    app.innerHTML=`
      <div class="head">
        <div><h1>Nuevo usuario</h1><div class="muted">Creación segura de cuenta mediante Supabase Authentication</div></div>
        <button class="secondary" onclick="usersSupabase()">← Volver</button>
      </div>
      <div class="panel">
        <h3>Paso 1 — Crear la cuenta</h3>
        <p>En otra pestaña abre <b>Supabase → Authentication → Users → Add user</b>.</p>
        <p class="muted">Introduce el correo y la contraseña del nuevo usuario y confirma la creación.</p>

        <h3 style="margin-top:24px">Paso 2 — Asignar el rol</h3>
        <p>Vuelve a esta plataforma y el nuevo usuario aparecerá automáticamente en <b>Usuarios y roles</b>.</p>
        <p class="muted">Por seguridad, la cuenta de Auth se crea en Supabase y aquí solo administramos el perfil, rol y estado.</p>

        <button class="primary" onclick="usersSupabase()">Ver usuarios</button>
      </div>`;
  };

  /* Acceso directo desde el menú Configuración si contiene usuarios; no rompe el resto. */
  const oldPage=window.page;
  window.page=function(p){
    if(p==="usuarios") return usersSupabase();
    return oldPage(p);
  };

  /* Agregar el menú Usuarios al bloque de recursos para el Administrador. */
  setTimeout(()=>{
    if(window.currentUser?.role==="Administrador" && document.getElementById("nav") && !document.querySelector("#nav button[data-page='usuarios']")){
      const b=document.createElement("button");
      b.dataset.page="usuarios";
      b.innerHTML="👤 &nbsp; Usuarios y roles";
      document.getElementById("nav").appendChild(b);
      b.addEventListener("click",()=>window.page("usuarios"));
    }
  },1400);
})();
</script>


<style>
#sktLogoutBtn{
  border:1px solid #d9e1ec;
  background:#fff;
  color:#31527f;
  padding:9px 12px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
  margin-left:8px;
}
#sktLogoutBtn:hover{background:#f3f6fb}
</style>
<script>
/* ===== v2.0.1: BOTÓN CERRAR SESIÓN ===== */
(function(){
  function addLogout(){
    const top=document.querySelector(".top");
    if(!top || document.getElementById("sktLogoutBtn")) return;

    const profile=top.querySelector(".profile");
    if(!profile) return;

    const btn=document.createElement("button");
    btn.id="sktLogoutBtn";
    btn.type="button";
    btn.textContent="Cerrar sesión";
    btn.addEventListener("click", async ()=>{
      if(!confirm("¿Deseas cerrar la sesión?")) return;

      btn.disabled=true;
      btn.textContent="Cerrando...";

      try{
        /* Cerrar la sesión de Supabase en el cliente. */
        if(window.sktSupabase?.auth){
          try{
            await window.sktSupabase.auth.signOut({scope:"local"});
          }catch(e){
            console.warn("Supabase signOut:", e);
          }
        }

        /* Limpiar cualquier sesión local de versiones anteriores del prototipo,
           pero conservar la configuración de conexión de Supabase. */
        try{
          sessionStorage.clear();
          const keys=[];
          for(let i=0;i<localStorage.length;i++){
            const k=localStorage.key(i);
            if(k && (k.startsWith("sb-") || k==="skt_session")){
              keys.push(k);
            }
          }
          keys.forEach(k=>localStorage.removeItem(k));
        }catch(e){
          console.warn("Limpieza de sesión:", e);
        }

        /* Mostrar el login sin depender de que el preview reinicie el archivo. */
        if(typeof window.loginScreen==="function"){
          window.currentUser=null;
          window.loginScreen();
        }else{
          location.reload();
        }
      }catch(e){
        console.error(e);
        window.currentUser=null;
        try{sessionStorage.clear();}catch(_){}
        location.reload();
      }
    });
    top.appendChild(btn);
  }

  setTimeout(addLogout,700);
  setTimeout(addLogout,1800);
  window.addEventListener("load",()=>setTimeout(addLogout,300));
})();
</script>

<script>
/* ===== v2.0.3: CAMBIO DE USUARIO ROBUSTO ===== */
(function(){
  "use strict";

  function esc(v){
    return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }

  async function getRoleFor(user){
    let role="Estudiante", name=user?.email||"Usuario";
    try{
      if(window.sktSupabase){
        const {data}=await window.sktSupabase.from("profiles")
          .select("full_name,role,active")
          .eq("id",user.id).single();
        if(data){
          name=data.full_name||user.email||"Usuario";
          role=data.role||"Estudiante";
          if(data.active===false) throw new Error("Esta cuenta está inactiva.");
        }
      }
    }catch(e){
      if(e.message==="Esta cuenta está inactiva.") throw e;
    }
    return {name,role};
  }

  function showSwitchUser(){
    if(document.getElementById("sktSwitchOverlay"))return;
    const overlay=document.createElement("div");
    overlay.id="sktSwitchOverlay";
    overlay.innerHTML=`
      <div id="sktSwitchCard">
        <h2 style="margin:0 0 8px">Cambiar usuario</h2>
        <p style="color:#64748b;margin-top:0">Ingresa otra cuenta de Matemática Virtual “SKT”.</p>
        <form id="sktSwitchForm">
          <label>Correo<input name="email" type="email" required placeholder="docente1@skt.edu.pe"></label>
          <label style="display:block;margin-top:14px">Contraseña<input name="password" type="password" required placeholder="••••••••"></label>
          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
            <button type="button" class="secondary" id="sktCancelSwitch">Cancelar</button>
            <button type="submit" class="primary" id="sktDoSwitch">Entrar con este usuario</button>
          </div>
          <div id="sktSwitchMsg" style="margin-top:12px;color:#be123c;font-size:13px"></div>
        </form>
      </div>`;
    document.body.appendChild(overlay);

    document.getElementById("sktCancelSwitch").onclick=()=>overlay.remove();
    overlay.onclick=e=>{if(e.target===overlay)overlay.remove()};

    document.getElementById("sktSwitchForm").onsubmit=async e=>{
      e.preventDefault();
      const btn=document.getElementById("sktDoSwitch");
      const msg=document.getElementById("sktSwitchMsg");
      btn.disabled=true;btn.textContent="Verificando...";
      msg.textContent="";

      try{
        if(!window.sktSupabase) throw new Error("Supabase no está conectado.");
        const f=new FormData(e.target);
        const email=String(f.get("email")).trim();
        const password=String(f.get("password"));

        /* 1) Cerrar explícitamente la sesión anterior. */
        try{
          await window.sktSupabase.auth.signOut({scope:"local"});
        }catch(signoutError){
          console.warn("No se pudo cerrar la sesión previa:",signoutError);
        }

        /* 2) Iniciar sesión con la cuenta solicitada. */
        const {data,error}=await window.sktSupabase.auth.signInWithPassword({email,password});
        if(error)throw error;
        if(!data?.user)throw new Error("Supabase no devolvió el usuario autenticado.");

        /* 3) Leer el perfil REAL de public.profiles y mostrarlo para verificarlo. */
        const info=await getRoleFor(data.user);

        window.currentUser={
          id:data.user.id,
          email:data.user.email||email,
          name:info.name,
          role:info.role
        };

        const prof=document.querySelector(".profile");
        if(prof){
          const initials=(info.name||email).split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();
          prof.innerHTML=`🔔 <div class="avatar">${esc(initials)}</div><div><b>${esc(info.name)}</b><div class="muted">${esc(info.role)} · Matemática Virtual “SKT”</div></div>`;
        }
        document.title='Matemática Virtual “SKT” – Pisco | '+info.role;

        overlay.remove();

        /* 4) Volver a cargar el Dashboard con el token de la nueva cuenta,
              sin location.reload(), que en Vista previa podía restaurar la sesión anterior. */
        if(typeof window.dashboardSupabase==="function"){
          await window.dashboardSupabase();
        }

        /* 5) Refrescar visibilidad del menú cuando la función exista. */
        setTimeout(()=>{
          try{
            if(typeof window.sktRoleAllows==="function") window.sktRoleAllows("dashboard");
            if(typeof window.applyRoleUI==="function") window.applyRoleUI();
          }catch(_){}
        },100);

        const ok=document.createElement("div");
        ok.style.cssText="position:fixed;right:22px;bottom:22px;z-index:100000;background:#166534;color:#fff;padding:13px 17px;border-radius:10px;box-shadow:0 10px 30px #0003;font-weight:700";
        ok.textContent=`Sesión activa: ${info.name} · Rol: ${info.role}`;
        document.body.appendChild(ok);
        setTimeout(()=>ok.remove(),5000);
      }catch(err){
        console.error(err);
        msg.textContent=err.message||"No se pudo iniciar sesión.";
        btn.disabled=false;btn.textContent="Entrar con este usuario";
      }
    };
  }

  function addSwitchButton(){
    const top=document.querySelector(".top");
    if(!top || document.getElementById("sktSwitchUserBtn"))return;
    const btn=document.createElement("button");
    btn.id="sktSwitchUserBtn";
    btn.type="button";
    btn.textContent="Cambiar usuario";
    btn.onclick=showSwitchUser;
    top.appendChild(btn);
  }

  setTimeout(addSwitchButton,1000);
  setTimeout(addSwitchButton,2200);
  window.addEventListener("load",()=>setTimeout(addSwitchButton,500));

  /* También mejoramos el logout: limpiamos las claves sb-* y cualquier sesión del prototipo. */
  window.sktForceLogout=async function(){
    try{
      if(window.sktSupabase?.auth) await window.sktSupabase.auth.signOut({scope:"local"});
    }catch(e){console.warn(e)}
    try{sessionStorage.clear();}catch(e){}
    window.currentUser=null;
    if(typeof window.loginScreen==="function")window.loginScreen();
    else location.reload();
  };
})();
</script>

<script>
/* ===== v2.2.5: PORTAL DOCENTE USA user_id DE SUPABASE ===== */
(function(){
  "use strict";
  const db=()=>window.sktSupabase;
  const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

  async function getTeacherByUser(){
    if(!db()) return {ok:false,message:"Supabase no está conectado."};
    const uid=window.currentUser?.id;
    if(!uid) return {ok:false,message:"No se encontró el ID de la cuenta."};

    const {data,error}=await db().from("teachers")
      .select("id,code,full_name,specialty,email,phone,active,user_id")
      .eq("user_id",uid)
      .maybeSingle();

    if(error) return {ok:false,message:error.message};
    if(!data) return {ok:true,linked:false,teacher:null};
    if(data.active===false) return {ok:false,message:"El registro docente está inactivo."};

    const cr=await db().from("courses")
      .select("id,code,name,grade,section,teacher_id,active")
      .eq("teacher_id",data.id)
      .eq("active",true)
      .order("code");
    if(cr.error) return {ok:false,message:cr.error.message};
    const courses=cr.data||[];
    const ids=courses.map(c=>c.id);

    let enrollments=[], evaluations=[], attendance=[], students=[], grades=[];
    if(ids.length){
      const [en,ev,at]=await Promise.all([
        db().from("enrollments").select("id,student_id,course_id,enrolled_at").in("course_id",ids),
        db().from("evaluations").select("id,course_id,title,evaluation_date,weight").in("course_id",ids).order("evaluation_date"),
        db().from("attendance").select("id,course_id,student_id,attendance_date,status").in("course_id",ids).order("attendance_date",{ascending:false})
      ]);
      for(const r of [en,ev,at]) if(r.error) return {ok:false,message:r.error.message};
      enrollments=en.data||[]; evaluations=ev.data||[]; attendance=at.data||[];

      const studentIds=[...new Set(enrollments.map(x=>x.student_id))];
      if(studentIds.length){
        const st=await db().from("students")
          .select("id,code,full_name,grade,section,active")
          .in("id",studentIds).order("code");
        if(st.error) return {ok:false,message:st.error.message};
        students=st.data||[];
      }

      const evaluationIds=evaluations.map(x=>x.id);
      if(evaluationIds.length){
        const g=await db().from("grades")
          .select("id,evaluation_id,student_id,score,created_at")
          .in("evaluation_id",evaluationIds);
        if(g.error) return {ok:false,message:g.error.message};
        grades=g.data||[];
      }
    }

    return {ok:true,linked:true,teacher:data,courses,enrollments,evaluations,attendance,students,grades};
  }

  function teacherLinkedError(){
    app.innerHTML=`
      <div class="head"><div><h1>Portal Docente</h1><div class="muted">Cuenta autenticada · falta vinculación docente</div></div></div>
      <div class="panel">
        <h3>Cuenta aún no vinculada</h3>
        <p>La cuenta <b>${esc(window.currentUser?.email)}</b> no tiene un <b>user_id</b> vinculado en la tabla <b>teachers</b>.</p>
        <p class="muted">Entra como Administrador → Docentes → 🔗 Vincular cuenta y selecciona esta cuenta.</p>
      </div>`;
  }

  function avg(a){return a.length?a.reduce((x,y)=>x+Number(y),0)/a.length:0;}

  window.sktTeacherDashboardByUser=async function(){
    const r=await getTeacherByUser();
    if(!r.ok){alert(r.message);return;}
    if(!r.linked){teacherLinkedError();return;}

    const gradeValues=r.grades.map(g=>Number(g.score));
    const overall=avg(gradeValues);
    const students=r.students;
    const studentAvg=sid=>avg(r.grades.filter(g=>g.student_id===sid).map(g=>Number(g.score)));
    const studentAtt=sid=>{
      const a=r.attendance.filter(x=>x.student_id===sid);
      return a.length?Math.round(a.filter(x=>x.status!=="Falta").length/a.length*100):100;
    };
    const risk=students.filter(s=>(studentAvg(s.id)>0&&studentAvg(s.id)<11)||studentAtt(s.id)<85);

    app.innerHTML=`
      <div class="head">
        <div><h1>Mi Dashboard</h1><div class="muted">${esc(r.teacher.full_name)} · ${esc(r.teacher.specialty||"Docente")}</div></div>
        <button class="secondary" onclick="sktTeacherDashboardByUser()">↻ Actualizar</button>
      </div>
      <div class="cards">
        <div class="card"><small>MIS CURSOS</small><div class="num">${r.courses.length}</div><div class="good">● Asignados</div></div>
        <div class="card"><small>MIS ESTUDIANTES</small><div class="num">${students.length}</div><div class="good">● Matriculados</div></div>
        <div class="card"><small>EVALUACIONES</small><div class="num">${r.evaluations.length}</div><div class="good">● Mis cursos</div></div>
        <div class="card"><small>PROMEDIO</small><div class="num">${overall.toFixed(1)}</div><div class="good">● ${r.grades.length} notas</div></div>
      </div>
      <div class="grid">
        <div class="panel"><h3>Mis cursos</h3>
          ${r.courses.map(c=>`<div class="row"><span><b>${esc(c.name)}</b><br><span class="muted">${esc(c.grade)} ${esc(c.section)} · ${esc(c.code)}</span></span><span>${r.enrollments.filter(e=>e.course_id===c.id).length} estudiantes</span></div>`).join("")||'<div class="empty">No hay cursos asignados.</div>'}
        </div>
        <div class="panel"><h3>Atención académica</h3>
          ${risk.slice(0,8).map(s=>`<div class="row"><span><b>${esc(s.full_name)}</b><br><span class="muted">${esc(s.grade)} ${esc(s.section)}</span></span><span class="badge warn">${studentAvg(s.id).toFixed(1)} · ${studentAtt(s.id)}%</span></div>`).join("")||'<div class="empty">No hay estudiantes en riesgo.</div>'}
        </div>
      </div>
      <div class="panel"><h3>Próximas evaluaciones</h3>
        ${r.evaluations.slice(0,6).map(e=>{const c=r.courses.find(c=>c.id===e.course_id);return `<div class="row"><span><b>${esc(e.title)}</b><br><span class="muted">${esc(c?c.name:"Curso")} · ${esc(c?c.grade+" "+c.section:"")}</span></span><span>${esc(e.evaluation_date)}</span></div>`}).join("")||'<div class="empty">No hay evaluaciones.</div>'}
      </div>`;
  };

  window.sktTeacherCoursesByUser=async function(){
    const r=await getTeacherByUser();
    if(!r.ok){alert(r.message);return;}
    if(!r.linked){teacherLinkedError();return;}
    app.innerHTML=`
      <div class="head"><div><h1>Mis cursos</h1><div class="muted">${esc(r.teacher.full_name)}</div></div></div>
      <div class="cards">${r.courses.map(c=>`
        <div class="card"><small>${esc(c.code)}</small><div class="num" style="font-size:20px">${esc(c.name)}</div>
        <div class="muted">${esc(c.grade)} · Sección ${esc(c.section)}</div><br>
        <b>${r.enrollments.filter(e=>e.course_id===c.id).length}</b> estudiantes ·
        <b>${r.evaluations.filter(e=>e.course_id===c.id).length}</b> evaluaciones</div>`).join("")||'<div class="empty">No hay cursos asignados.</div>'}</div>`;
  };

  window.sktTeacherEvaluationsByUser=async function(){
    const r=await getTeacherByUser();
    if(!r.ok){alert(r.message);return;}
    if(!r.linked){teacherLinkedError();return;}
    app.innerHTML=`
      <div class="head"><div><h1>Mis evaluaciones</h1><div class="muted">Solo de mis cursos</div></div></div>
      <div class="panel" style="overflow:auto"><table class="table"><thead><tr><th>Evaluación</th><th>Curso</th><th>Fecha</th><th>Calificadas</th><th></th></tr></thead><tbody>
      ${r.evaluations.map(e=>{const c=r.courses.find(c=>c.id===e.course_id);const n=r.grades.filter(g=>g.evaluation_id===e.id).length;const t=r.enrollments.filter(x=>x.course_id===e.course_id).length;return `<tr><td><b>${esc(e.title)}</b></td><td>${esc(c?c.name+" · "+c.grade+" "+c.section:"Curso")}</td><td>${esc(e.evaluation_date)}</td><td>${n}/${t}</td><td><button onclick="sktTeacherGradeBookByUser('${e.id}')">Calificar</button></td></tr>`}).join("")||'<tr><td colspan="5" class="empty">No hay evaluaciones.</td></tr>'}

        id:g.id,

      ${rows.map(x=>`<tr><td><b>${esc(x.student)}</b></td><td>${esc(x.title)}</td><td>${esc(x.course)}</td><td>${esc(x.date)}</td><td><b>${Number(x.score).toFixed(2)}</b></td></tr>`).join("")||'<tr><td colspan="5" class="empty">No hay calificaciones registradas.</td></tr>'}

  window.sktTeacherGradeBookByUser=async function(eid){

    if(!r.ok){alert(r.message);return;}
    const e=r.evaluations.find(x=>x.id===eid);
    if(!e){alert("Evaluación no encontrada.");return;}
    const c=r.courses.find(x=>x.id===e.course_id);
    const ids=new Set(r.enrollments.filter(x=>x.course_id===e.course_id).map(x=>x.student_id));
    const roster=r.students.filter(s=>ids.has(s.id));
    const old=sid=>r.grades.find(g=>g.evaluation_id===e.id&&g.student_id===sid)?.score??"";
    app.innerHTML=`
      <div class="head"><div><h1>Calificar evaluación</h1><div class="muted">${esc(e.title)} · ${esc(c?c.name:"Curso")} · escala 0–20</div></div><button class="secondary" onclick="sktTeacherEvaluationsByUser()">← Volver</button></div>
      <div class="panel"><div style="overflow:auto"><table class="table"><thead><tr><th>Código</th><th>Estudiante</th><th>Nota</th></tr></thead><tbody>
      ${roster.map(s=>`<tr><td>${esc(s.code)}</td><td><b>${esc(s.full_name)}</b></td><td><input id="sktTS_${s.id}" type="number" min="0" max="20" step=".01" value="${old(s.id)}" style="width:100px"></td></tr>`).join("")||'<tr><td colspan="3" class="empty">No hay estudiantes matriculados.</td></tr>'}
      </tbody></table></div><br><button class="primary" id="sktSaveTeacherGrades">Guardar calificaciones</button></div>`;

    document.getElementById("sktSaveTeacherGrades").onclick=async()=>{

      const rows=[];
      for(const s of roster){
        const el=document.getElementById("sktTS_"+s.id);

          if(!Number.isFinite(score)||score<0||score>20){alert(`La nota de ${s.full_name} debe estar entre 0 y 20.`);btn.disabled=false;btn.textContent="Guardar calificaciones";return;}
          rows.push({evaluation_id:e.id,student_id:s.id,score});
        }
      }
      if(rows.length){
        const {error}=await db().from("grades").upsert(rows,{onConflict:"evaluation_id,student_id"});
        if(error){alert("No se pudieron guardar las calificaciones:\n"+error.message);btn.disabled=false;btn.textContent="Guardar calificaciones";return;}
      }
      alert("Calificaciones guardadas correctamente.");
      sktTeacherGradeBookByUser(eid);
    };
  };

  window.sktTeacherAttendanceByUser=async function(){
    const r=await getTeacherByUser();
    if(!r.ok){alert(r.message);return;}
    if(!r.linked){teacherLinkedError();return;}
    const name=id=>r.students.find(s=>s.id===id)?.full_name||"";
    const course=id=>{const c=r.courses.find(c=>c.id===id);return c?`${c.name} · ${c.grade} ${c.section}`:"Curso"};
    app.innerHTML=`
      <div class="head"><div><h1>Asistencia</h1><div class="muted">Mis cursos</div></div><button class="secondary" onclick="sktTeacherAttendanceByUser()">↻ Actualizar</button></div>
      <div class="panel" style="overflow:auto"><table class="table"><thead><tr><th>Fecha</th><th>Curso</th><th>Estudiante</th><th>Estado</th></tr></thead><tbody>
      ${r.attendance.map(a=>`<tr><td>${esc(a.attendance_date)}</td><td>${esc(course(a.course_id))}</td><td>${esc(name(a.student_id))}</td><td><span class="badge ${a.status==="Presente"?"":"warn"}">${esc(a.status)}</span></td></tr>`).join("")||'<tr><td colspan="4" class="empty">No hay asistencia registrada.</td></tr>'}
      </tbody></table></div>`;
  };

  window.sktTeacherReportsByUser=async function(){
    const r=await getTeacherByUser();
    if(!r.ok){alert(r.message);return;}
    if(!r.linked){teacherLinkedError();return;}
    const avgStudent=sid=>avg(r.grades.filter(g=>g.student_id===sid).map(g=>Number(g.score)));
    const attStudent=sid=>{const a=r.attendance.filter(x=>x.student_id===sid);return a.length?Math.round(a.filter(x=>x.status!=="Falta").length/a.length*100):100};
    app.innerHTML=`
      <div class="head"><div><h1>Mis reportes</h1><div class="muted">${esc(r.teacher.full_name)}</div></div></div>
      <div class="panel" style="overflow:auto"><table class="table"><thead><tr><th>Estudiante</th><th>Promedio</th><th>Asistencia</th><th>Notas</th></tr></thead><tbody>
      ${r.students.map(s=>`<tr><td><b>${esc(s.full_name)}</b><div class="muted">${esc(s.code)}</div></td><td>${avgStudent(s.id)?avgStudent(s.id).toFixed(1):"—"}</td><td>${attStudent(s.id)}%</td><td>${r.grades.filter(g=>g.student_id===s.id).length}</td></tr>`).join("")||'<tr><td colspan="4" class="empty">No hay estudiantes.</td></tr>'}
      </tbody></table></div>`;
  };

  /* Reemplazar los accesos del menú docente por las funciones robustas. */
  const oldPage=window.page;
  window.page=function(p){
    if(String(window.currentUser?.role||"").trim()==="Docente"){
      if(p==="dashboard")return sktTeacherDashboardByUser();
      if(p==="mis-cursos")return sktTeacherCoursesByUser();
      if(p==="evaluaciones"||p==="calificaciones")return sktTeacherEvaluationsByUser();
      if(p==="asistencia")return sktTeacherAttendanceByUser();
      if(p==="reportes")return sktTeacherReportsByUser();

<script>
/* ===== v2.3: PORTAL DOCENTE — EVALUACIONES Y CALIFICACIONES ===== */
(function(){
  "use strict";
  const db=()=>window.sktSupabase;
  const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

  async function teacherData(){
    const uid=window.currentUser?.id;
    if(!uid) return {ok:false,message:"No hay usuario autenticado."};

    const tr=await db().from("teachers")
      .select("id,code,full_name,specialty,email,phone,active,user_id")
      .eq("user_id",uid).maybeSingle();

    if(tr.error)return {ok:false,message:tr.error.message};
    if(!tr.data)return {ok:true,linked:false};

    const c=await db().from("courses")
      .select("id,code,name,grade,section,teacher_id,active")
      .eq("teacher_id",tr.data.id).eq("active",true).order("code");
    if(c.error)return {ok:false,message:c.error.message};
    const courses=c.data||[], ids=courses.map(x=>x.id);

    let evaluations=[], enrollments=[], students=[], grades=[];
    if(ids.length){
      const [ev,en]=await Promise.all([
        db().from("evaluations").select("id,course_id,title,evaluation_date,weight").in("course_id",ids).order("evaluation_date"),
        db().from("enrollments").select("id,student_id,course_id,enrolled_at").in("course_id",ids)
      ]);
      if(ev.error)return {ok:false,message:ev.error.message};
      if(en.error)return {ok:false,message:en.error.message};
      evaluations=ev.data||[]; enrollments=en.data||[];

      const studentIds=[...new Set(enrollments.map(x=>x.student_id))];
      if(studentIds.length){
        const st=await db().from("students").select("id,code,full_name,grade,section,active").in("id",studentIds).order("code");
        if(st.error)return {ok:false,message:st.error.message};
        students=st.data||[];
      }
      const evalIds=evaluations.map(x=>x.id);
      if(evalIds.length){
        const g=await db().from("grades").select("id,evaluation_id,student_id,score").in("evaluation_id",evalIds);
        if(g.error)return {ok:false,message:g.error.message};
        grades=g.data||[];
      }
    }

    return {ok:true,linked:true,teacher:tr.data,courses,evaluations,enrollments,students,grades};
  }

  function noLink(){
    app.innerHTML=`<div class="head"><div><h1>Portal Docente</h1><div class="muted">La cuenta no está vinculada a un docente.</div></div></div>
    <div class="panel"><h3>Falta vincular la cuenta</h3><p>Vincula esta cuenta con un docente desde el perfil Administrador → Docentes → 🔗 Vincular cuenta.</p></div>`;
  }

  window.teacherEvalPortal23=async function(){
    if(window.currentUser?.role!=="Docente"){alert("Esta pantalla es para usuarios Docente.");return;}
    const r=await teacherData();
    if(!r.ok){alert(r.message);return;}
    if(!r.linked){noLink();return;}

    app.innerHTML=`
      <div class="head">
        <div><h1>Mis evaluaciones</h1><div class="muted">${esc(r.teacher.full_name)} · solo evaluaciones de sus cursos</div></div>
        <button class="secondary" onclick="teacherEvalPortal23()">↻ Actualizar</button>
      </div>
      <div class="panel" style="overflow:auto">
        <table class="table">
          <thead><tr><th>Evaluación</th><th>Curso</th><th>Fecha</th><th>Peso</th><th>Calificadas</th><th>Acción</th></tr></thead>
          <tbody>
          ${r.evaluations.map(e=>{
            const c=r.courses.find(x=>x.id===e.course_id);
            const total=r.enrollments.filter(x=>x.course_id===e.course_id).length;
            const done=r.grades.filter(g=>g.evaluation_id===e.id).length;
            return `<tr>
              <td><b>${esc(e.title)}</b></td>
              <td>${esc(c?c.name:"Curso")} · ${esc(c?c.grade:"")} ${esc(c?c.section:"")}</td>
              <td>${esc(e.evaluation_date)}</td>
              <td>${Number(e.weight||1).toFixed(2)}</td>
              <td>${done}/${total}</td>
              <td><button class="primary" onclick="teacherGradePortal23('${e.id}')">Calificar</button></td>
            </tr>`;
          }).join("")||`<tr><td colspan="6" class="empty">No hay evaluaciones en tus cursos.</td></tr>`}
          </tbody>
        </table>
      </div>`;
  };

  window.teacherGradePortal23=async function(eid){
    const r=await teacherData();
    if(!r.ok){alert(r.message);return;}
    if(!r.linked){noLink();return;}
    const e=r.evaluations.find(x=>x.id===eid);
    if(!e){alert("Evaluación no encontrada.");return;}
    const c=r.courses.find(x=>x.id===e.course_id);
    const ids=new Set(r.enrollments.filter(x=>x.course_id===e.course_id).map(x=>x.student_id));
    const roster=r.students.filter(s=>ids.has(s.id));

    app.innerHTML=`
      <div class="head">
        <div><h1>Calificar: ${esc(e.title)}</h1><div class="muted">${esc(c?c.name:"Curso")} · ${esc(c?c.grade:"")} ${esc(c?c.section:"")} · escala 0–20</div></div>
        <button class="secondary" onclick="teacherEvalPortal23()">← Volver</button>
      </div>
      <div class="panel">
        <div style="overflow:auto">
          <table class="table">
            <thead><tr><th>Código</th><th>Estudiante</th><th>Nota</th><th>Estado</th></tr></thead>
            <tbody>
            ${roster.map(s=>{
              const old=r.grades.find(g=>g.evaluation_id===e.id&&g.student_id===s.id);
              return `<tr>
                <td>${esc(s.code)}</td>
                <td><b>${esc(s.full_name)}</b></td>
                <td><input id="score23_${s.id}" type="number" min="0" max="20" step="0.01" value="${old?old.score:""}" style="width:100px;padding:8px;border:1px solid #d5deea;border-radius:7px"></td>
                <td>${old?'<span class="badge">Registrada</span>':'<span class="badge warn">Pendiente</span>'}</td>
              </tr>`;
            }).join("")||`<tr><td colspan="4" class="empty">No hay estudiantes matriculados en este curso.</td></tr>`}
            </tbody>
          </table>
        </div>
        <br>
        <button class="primary" id="saveTeacherGrades23">Guardar calificaciones</button>
      </div>`;

    document.getElementById("saveTeacherGrades23").onclick=async()=>{
      const btn=document.getElementById("saveTeacherGrades23");
      btn.disabled=true;btn.textContent="Guardando...";
      const rows=[];
      for(const s of roster){
        const input=document.getElementById("score23_"+s.id);
        if(input && input.value!==""){
          const score=Number(input.value);
          if(!Number.isFinite(score)||score<0||score>20){
            alert(`La nota de ${s.full_name} debe estar entre 0 y 20.`);
            btn.disabled=false;btn.textContent="Guardar calificaciones";return;
          }
          rows.push({evaluation_id:e.id,student_id:s.id,score});
        }
      }
      if(rows.length){
        const {error}=await db().from("grades").upsert(rows,{onConflict:"evaluation_id,student_id"});
        if(error){
          alert("No se pudieron guardar las calificaciones:\n"+error.message);
          btn.disabled=false;btn.textContent="Guardar calificaciones";return;
        }
      }
      alert("Calificaciones guardadas correctamente en Supabase.");
      teacherGradePortal23(eid);
    };
  };

  const oldPage=window.page;
  window.page=function(p){
    if(window.currentUser?.role==="Docente"){
      if(p==="evaluaciones") return teacherEvalPortal23();
      if(p==="calificaciones") return teacherEvalPortal23();
    }
    return oldPage(p);
  };

  setTimeout(()=>{
    if(window.currentUser?.role==="Docente") teacherEvalPortal23();
  },900);
})();
</script>

<script>
/* ===== v2.4: PORTAL DOCENTE — ASISTENCIA ===== */
(function(){
  "use strict";
  const db=()=>window.sktSupabase;
  const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

  async function loadTeacherAttendance(){
    const uid=window.currentUser?.id;

    if(tr.error)return {ok:false,message:tr.error.message};
    if(!tr.data)return {ok:true,linked:false};

    const cr=await db().from("courses")
      .select("id,code,name,grade,section,teacher_id,active")
      .eq("teacher_id",tr.data.id).eq("active",true).order("code");
    if(cr.error)return {ok:false,message:cr.error.message};
    const courses=cr.data||[], ids=courses.map(c=>c.id);

    ]);
    if(en.error)return {ok:false,message:en.error.message};
    if(at.error)return {ok:false,message:at.error.message};

    const enrollments=en.data||[], attendance=at.data||[];
    const studentIds=[...new Set(enrollments.map(e=>e.student_id))];
    let students=[];
    if(studentIds.length){
      const st=await db().from("students")
        .select("id,code,full_name,grade,section,active")
        .in("id",studentIds).order("code");
      if(st.error)return {ok:false,message:st.error.message};
      students=st.data||[];
    }

  function noLink(){
    app.innerHTML=`<div class="head"><div><h1>Asistencia docente</h1><div class="muted">Cuenta sin vinculación docente.</div></div></div>
    <div class="panel"><h3>Falta vincular la cuenta</h3><p>Usa el Administrador → Docentes → 🔗 Vincular cuenta.</p></div>`;

  window.teacherAttendancePortal24=async function(){

        </div>
        <div style="overflow:auto">

    </tr>`).join("")||`<tr><td colspan="4" class="empty">No hay registros de asistencia.</td></tr>`;
  };

  window.attendanceSession24=async function(){
    const r=await loadTeacherAttendance();
    if(!r.ok){alert(r.message);return;}
    if(!r.linked){noLink();return;}
    app.innerHTML=`
      <div class="head"><div><h1>Nueva sesión de asistencia</h1><div class="muted">Seleccione curso y fecha.</div></div><button class="secondary" onclick="teacherAttendancePortal24()">← Volver</button></div>
      <div class="panel">
        <div class="form">
          <label>Fecha<input id="attDate24" type="date" value="${new Date().toISOString().slice(0,10)}" required></label>
          <label>Curso<select id="attCourse24" required><option value="">Seleccione un curso</option>${r.courses.map(c=>`<option value="${c.id}">${esc(c.name)} · ${esc(c.grade)} ${esc(c.section)} · ${esc(c.code)}</option>`).join("")}</select></label>
        </div>
        <div id="attRoster24" style="margin-top:18px"></div>

    const draw=()=>{

      rosterEl.innerHTML=list.length?`
        <div style="overflow:auto"><table class="table"><thead><tr><th>Código</th><th>Estudiante</th><th>Estado</th></tr></thead><tbody>
        ${list.map(s=>`<tr><td>${esc(s.code)}</td><td><b>${esc(s.full_name)}</b></td><td>
          <select id="as_${s.id}">
            <option value="Presente">Presente</option>
            <option value="Tardanza">Tardanza</option>
            <option value="Falta">Falta</option>
          </select>
        </td></tr>`).join("")}</tbody></table></div>`:
        `<div class="empty">No hay estudiantes matriculados en este curso.</div>`;
    };
