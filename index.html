<script>
"use strict";
const KEY="skt_students_stable";let students;
try{students=JSON.parse(localStorage.getItem(KEY))||null}catch(e){students=null}
if(!Array.isArray(students))students=[{id:"SKT-001",name:"Ana Torres",grade:"1.º",section:"A",avg:15.8,attendance:97,status:"Activo"},{id:"SKT-002",name:"Luis Mendoza",grade:"2.º",section:"B",avg:13.4,attendance:93,status:"Activo"},{id:"SKT-003",name:"María Quispe",grade:"3.º",section:"A",avg:17.2,attendance:98,status:"Activo"},{id:"SKT-004",name:"Carlos Rojas",grade:"4.º",section:"A",avg:10.9,attendance:82,status:"Alerta"},{id:"SKT-005",name:"Sofía Díaz",grade:"5.º",section:"A",avg:18.1,attendance:99,status:"Activo"},{id:"SKT-006",name:"Diego Flores",grade:"4.º",section:"B",avg:12.1,attendance:86,status:"Alerta"}];
function save(){localStorage.setItem(KEY,JSON.stringify(students))}
function active(p){
/* ===== v0.7: integración académica ===== */
function studentsOfCourse(courseId){
  const c=acad.courses.find(x=>x.id===courseId);
  return c ? students.filter(s=>s.grade===c.grade && s.section===c.section) : [];
}
function studentGradeValues(studentId){
  return acad.evals.filter(e=>studentsOfCourse(e.course).some(s=>s.id===studentId))
    .map(e=>acad.grades[e.id+"_"+studentId]).filter(v=>typeof v==="number");
}
function calcStudentAvg(studentId){
  const v=studentGradeValues(studentId);
  return v.length ? v.reduce((a,b)=>a+b,0)/v.length : 0;
}
function calcStudentAttendance(studentId){
  const a=acad.attendance.filter(x=>x.student===studentId);
  if(!a.length) return null;
  const good=a.filter(x=>x.state==="Presente"||x.state==="Tardanza").length;
  return Math.round(good/a.length*100);
}
function syncStudentStats(){
  students.forEach(s=>{
    const av=calcStudentAvg(s.id);
    const at=calcStudentAttendance(s.id);
    if(av>0) s.avg=Number(av.toFixed(1));
    if(at!==null) s.attendance=at;
    s.status=(s.avg<11 || s.attendance<85)?"Alerta":"Activo";
  });
  save();
}
function courseDetail(id){
  const c=acad.courses.find(x=>x.id===id);
  if(!c){page("cursos");return}
  const roster=studentsOfCourse(id);
  const ev=acad.evals.filter(x=>x.course===id);
  const vals=ev.flatMap(e=>roster.map(s=>acad.grades[e.id+"_"+s.id]).filter(v=>typeof v==="number"));
  const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
  app.innerHTML=`<div class="head"><div><h1>${c.name} · ${c.grade} ${c.section}</h1><div class="muted">${c.teacher||"Sin docente"} · ${roster.length} estudiantes vinculados automáticamente por grado y sección</div></div><button class="secondary" onclick="page('cursos')">← Volver</button></div>
  <div class="cards">
    <div class="card"><small>ESTUDIANTES</small><div class="num">${roster.length}</div></div>
    <div class="card"><small>EVALUACIONES</small><div class="num">${ev.length}</div></div>
    <div class="card"><small>NOTAS</small><div class="num">${vals.length}</div></div>
    <div class="card"><small>PROMEDIO</small><div class="num">${avg.toFixed(1)}</div></div>
  </div>
  <div class="grid">
    <div class="panel"><h3>Estudiantes del curso</h3>
      ${roster.map(s=>`<div class="row"><span><b>${s.name}</b><br><span class="muted">${s.id}</span></span><span><b>${calcStudentAvg(s.id).toFixed(1)}</b> · ${calcStudentAttendance(s.id)===null?"—":calcStudentAttendance(s.id)+"%"}</span></div>`).join("")||`<div class="empty">No hay estudiantes con ${c.grade} ${c.section}.</div>`}
    </div>
    <div class="panel"><h3>Evaluaciones</h3>
      ${ev.map(e=>{let v=roster.map(s=>acad.grades[e.id+"_"+s.id]).filter(x=>typeof x==="number");let a=v.length?v.reduce((x,y)=>x+y,0)/v.length:0;return `<div class="row"><span><b>${e.title}</b><br><span class="muted">${e.date}</span></span><span>${a.toFixed(1)} <button class="actions button" onclick="gradeBook('${e.id}')">Calificar</button></span></div>`}).join("")||`<div class="empty">No hay evaluaciones.</div>`}
    </div>
  </div>`;
}
function coursesModule(){
  app.innerHTML=`<div class="head"><div><h1>Cursos</h1><div class="muted">Cursos conectados con estudiantes, evaluaciones y calificaciones.</div></div><button class="primary" onclick="courseForm()">+ Nuevo curso</button></div>
  <div class="cards">${acad.courses.map(c=>{let n=studentsOfCourse(c.id).length;let ev=acad.evals.filter(e=>e.course===c.id).length;return `<div class="card"><small>${c.grade} · ${c.section}</small><div class="num" style="font-size:20px">${c.name}</div><div class="muted">${c.teacher||"Sin docente asignado"}</div><br><b>${n}</b> estudiantes · <b>${ev}</b> evaluaciones<br><br><button class="primary" onclick="courseDetail('${c.id}')">Ver curso</button> <button class="secondary" onclick="courseForm('${c.id}')">Editar</button></div>`}).join("")}</div>`;
}
function gradeBook(eid){
  const e=acad.evals.find(x=>x.id===eid), roster=studentsOfCourse(e.course);
  app.innerHTML=`<div class="head"><div><h1>Calificador</h1><div class="muted">${e.title} · ${cLabel(e.course)} · escala 0–20 · ${roster.length} estudiantes</div></div><button class="secondary" onclick="courseDetail('${e.course}')">← Volver al curso</button></div>
  <div class="panel"><div style="overflow:auto"><table class="table"><thead><tr><th>Código</th><th>Estudiante</th><th>Nota</th></tr></thead><tbody>${roster.map(s=>{let k=eid+"_"+s.id,v=acad.grades[k]??"";return `<tr><td>${s.id}</td><td><b>${s.name}</b></td><td><input id="n_${k}" type="number" min="0" max="20" step=".1" value="${v}" style="width:90px;padding:7px;border:1px solid #dce4ee;border-radius:7px"></td></tr>`}).join("")||`<tr><td colspan="3" class="empty">No hay estudiantes vinculados a este curso.</td></tr>`}</tbody></table></div><br><button class="primary" onclick="saveBook('${eid}')">Guardar calificaciones</button></div>`;
}
function saveBook(eid){
  const e=acad.evals.find(x=>x.id===eid);
  studentsOfCourse(e.course).forEach(s=>{let k=eid+"_"+s.id,el=document.getElementById("n_"+k);if(el&&el.value!=="")acad.grades[k]=Number(el.value);else delete acad.grades[k]});

async function loadAdminDashboardStats(){
  const client = window.sktSupabase || window.client;
  const defaults = { profiles: 0, students: 0, teachers: 0, courses: 0, enrollments: 0, evaluations: 0, attendance: 0 };
  if(!client) return defaults;
  const tables = [
    {key:"profiles", table:"profiles"},
    {key:"students", table:"students"},
    {key:"teachers", table:"teachers"},
    {key:"courses", table:"courses"},
    {key:"enrollments", table:"enrollments"},
    {key:"evaluations", table:"evaluations"},
    {key:"attendance", table:"attendance"}
  ];
  const results = await Promise.allSettled(tables.map(async ({key, table}) => {
    const { count, error } = await client.from(table).select('id', { count: 'exact', head: true });
    if(error) throw error;
    return { key, count: Number(count || 0) };
  }));
  const out = {...defaults};
  results.forEach(r => {
    if(r.status === 'fulfilled') out[r.value.key] = Number(r.value.count || 0);
  });
  return out;
}

<script id="skt-virtual-classes-supabase">
(function(){
  'use strict';
  const db=()=>window.sktSupabase||window.client||null;
  const app=()=>document.getElementById('app');
  const role=()=>String(window.currentUser?.role||'').trim();
  const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const classesTable=()=>{const client=db();return client?client.schema('public').from('virtual_classes'):null;};
  const classFields='id,title,course_id,class_date,class_time,topic,description,meet_url,created_by,created_at,updated_at';
  let courses=[];

  function fail(error,message){
    console.error('SKT virtual classes:',error);
    alert(message+(error?.message?`\n\n${error.message}`:''));
  }

  async function loadCourses(){
    const client=db();
    if(!client) throw new Error('Supabase no está conectado.');
    let query=client.from('courses').select('id,code,name,grade,section,teacher_id,active').eq('active',true).order('code',{ascending:true});
    if(role()==='Docente'){
      const teacher=await client.from('teachers').select('id').eq('user_id',window.currentUser?.id).eq('active',true).maybeSingle();
      if(teacher.error) throw teacher.error;
      if(!teacher.data){courses=[];return courses;}
      query=query.eq('teacher_id',teacher.data.id);
    }
    const result=await query;
    if(result.error) throw result.error;
    courses=result.data||[];
    return courses;
  }

  function courseLabel(id){
    const c=courses.find(x=>String(x.id)===String(id));
    return c?`${c.name||''} · ${c.grade||''} ${c.section||''} · ${c.code||''}`.replace(/ · $/,''):String(id||'Curso');
  }

  async function loadStudentCourseIds(){
    const client=db(),uid=window.currentUser?.id;
    if(!client||!uid) throw new Error('No se encontró la sesión del estudiante.');
    const student=await client.from('students').select('id').eq('user_id',uid).eq('active',true).maybeSingle();
    if(student.error) throw student.error;
    if(!student.data)return [];
    const enrollments=await client.from('enrollments').select('course_id').eq('student_id',student.data.id);
    if(enrollments.error) throw enrollments.error;
    return (enrollments.data||[]).map(x=>x.course_id);
  }

  async function loadClasses(){
    const table=classesTable();
    if(!table) throw new Error('Supabase no está conectado.');
    const result=await table.select(classFields).order('class_date',{ascending:true}).order('class_time',{ascending:true});
    if(result.error) throw result.error;
    return result.data||[];
  }

  function formatTime(value){return String(value||'').slice(0,5);}
  function validMeetUrl(value){
    try{return new URL(value).protocol==='https:'&&new URL(value).hostname==='meet.google.com';}catch{return false;}
  }

  function classCard(item,canManage){
    const manage=canManage&&String(item.created_by||'')===String(window.currentUser?.id||'')||role()==='Administrador';
    return `<div class="skt-class"><b>${esc(item.title)}</b><span>${esc(courseLabel(item.course_id))}</span><small>${esc(item.class_date)} · ${esc(formatTime(item.class_time))}</small><small>${esc(item.topic)}</small>${item.description?`<small>${esc(item.description)}</small>`:''}${role()==='Estudiante'?`<button class="primary" type="button" onclick='sktEnterGoogleMeet(${JSON.stringify(item.meet_url)})'>🎥 ENTRAR A GOOGLE MEET</button>`:''}${manage?`<button class="skt-mini" type="button" onclick="sktVirtualClassForm('${esc(item.id)}')">Editar</button> <button class="skt-mini" type="button" onclick="sktVirtualClassDelete('${esc(item.id)}')">Eliminar</button>`:''}</div>`;
  }

  async function render(){
    const target=app();if(!target)return;
    try{
      const currentRole=role();
      if(!db())throw new Error('Supabase no está conectado.');
      await loadCourses();
      let allowedCourseIds=null;
      if(currentRole==='Estudiante')allowedCourseIds=await loadStudentCourseIds();
      let data=await loadClasses();
      if(allowedCourseIds)data=data.filter(x=>allowedCourseIds.some(id=>String(id)===String(x.course_id)));
      const canManage=currentRole==='Administrador'||currentRole==='Docente';
      target.innerHTML=`<div class="head"><div><h1>Clases Virtuales</h1><div class="muted">${data.length} clases disponibles</div></div>${canManage?'<button class="primary" type="button" onclick="sktVirtualClassForm()">+ Nueva clase virtual</button>':''}</div><div class="panel"><div class="skt-schedule">${data.length?data.map(x=>classCard(x,canManage)).join(''):'<div class="skt-empty">No hay clases virtuales disponibles.</div>'}</div></div>`;
    }catch(error){fail(error,'No se pudieron cargar las clases virtuales.');}
  }

  window.sktEnterGoogleMeet=function(url){if(validMeetUrl(url))window.open(url,'_blank','noopener,noreferrer');else alert('El enlace de Google Meet no es válido.');};

  window.sktVirtualClassForm=async function(id){
    if(role()!=='Administrador'&&role()!=='Docente'){alert('No tienes permisos para gestionar clases virtuales.');return;}
    try{
      await loadCourses();
      const current=id?(await classesTable().select(classFields).eq('id',id).maybeSingle()).data:{title:'',course_id:'',class_date:new Date().toISOString().slice(0,10),class_time:'08:00',topic:'',description:'',meet_url:''};
      if(id&&!current)throw new Error('La clase virtual no existe o no está disponible.');
      app().innerHTML=`<div class="head"><div><h1>${id?'Editar':'Nueva'} clase virtual</h1><div class="muted">Datos de la sesión y enlace de Google Meet</div></div><button class="secondary" type="button" onclick="sktRenderClases()">← Volver</button></div><div class="panel"><form id="sktVirtualClassForm" class="form"><label>Título<input name="title" required maxlength="160" value="${esc(current.title)}"></label><label>Curso<select name="course_id" required><option value="">Seleccione</option>${courses.map(c=>`<option value="${esc(c.id)}" ${String(c.id)===String(current.course_id)?'selected':''}>${esc(courseLabel(c.id))}</option>`).join('')}</select></label><label>Fecha<input name="class_date" type="date" required value="${esc(current.class_date)}"></label><label>Hora<input name="class_time" type="time" required value="${esc(formatTime(current.class_time))}"></label><label>Tema<input name="topic" required maxlength="200" value="${esc(current.topic)}"></label><label>Enlace de Google Meet<input name="meet_url" type="url" required placeholder="https://meet.google.com/..." value="${esc(current.meet_url)}"></label><label class="full">Descripción<textarea name="description" rows="4">${esc(current.description)}</textarea></label><div class="full"><button class="primary" type="submit">Guardar clase virtual</button> <button class="secondary" type="button" onclick="sktRenderClases()">Cancelar</button></div></form></div>`;
      document.getElementById('sktVirtualClassForm').onsubmit=async event=>{
        event.preventDefault();
        const form=event.currentTarget,button=form.querySelector('button[type="submit"]'),values=new FormData(form),payload={title:String(values.get('title')).trim(),course_id:String(values.get('course_id')),class_date:String(values.get('class_date')),class_time:String(values.get('class_time')),topic:String(values.get('topic')).trim(),description:String(values.get('description')||'').trim(),meet_url:String(values.get('meet_url')).trim()};
        if(!validMeetUrl(payload.meet_url)){alert('Ingresa un enlace válido de Google Meet.');return;}
        button.disabled=true;button.textContent='Guardando...';
        const result=id?await classesTable().update(payload).eq('id',id).select(classFields).single():await classesTable().insert({...payload,created_by:window.currentUser?.id}).select(classFields).single();
        if(result.error){button.disabled=false;button.textContent='Guardar clase virtual';fail(result.error,'No se pudo guardar la clase virtual.');return;}
        await render();
      };
    }catch(error){fail(error,'No se pudo abrir la clase virtual.');}
  };

  window.sktVirtualClassDelete=async function(id){
    if(role()!=='Administrador'&&role()!=='Docente')return;
    if(!confirm('¿Eliminar esta clase virtual?'))return;
    const result=await classesTable().delete().eq('id',id);
    if(result.error){fail(result.error,'No se pudo eliminar la clase virtual.');return;}
    await render();
  };

  window.sktVirtualClassesRender=render;
  window.sktRenderClases=render;
  const previousPage=window.page;
  window.page=function(page){if(page==='clases')return render();return previousPage&&previousPage(page);};

  function addStudentMenuItem(){
    if(role()!=='Estudiante')return;
    const menu=document.querySelector('#nav .skt48-menu');
    if(!menu||menu.querySelector('[data-skt-virtual-classes]'))return;
    const button=document.createElement('button');button.type='button';button.textContent='🎥  Clases Virtuales';button.setAttribute('data-skt-virtual-classes','1');button.setAttribute('data-role-page','clases');button.onclick=()=>{menu.querySelectorAll('button').forEach(x=>x.classList.remove('active'));button.classList.add('active');render();};menu.appendChild(button);
  }
  const nav=document.getElementById('nav');
  if(nav)new MutationObserver(addStudentMenuItem).observe(nav,{childList:true,subtree:true});
  window.addEventListener('skt:role-ready',()=>setTimeout(addStudentMenuItem,50));
  window.addEventListener('skt:student-ready',()=>setTimeout(addStudentMenuItem,50));
  setTimeout(addStudentMenuItem,1000);
})();
</script>
<script>
/* ===== v1.0 SUPABASE AUTH =====
   Configuración inicial:
   - SUPABASE_URL: URL del proyecto
   - SUPABASE_PUBLISHABLE_KEY: clave sb_publishable_...
*/
(function(){
  "use strict";
  const CFG="skt_supabase_config";
  const DEFAULT_CONFIG = window.DEFAULT_CONFIG || {url:"https://svuqgecqrsscaucflfme.supabase.co", key:"sb_publishable_YLEmVaVVpOnlVyhGCJRQbA_Y7MN-Wqb"};
  const saved=JSON.parse(localStorage.getItem(CFG)||"null");
  let config=saved||{url:"",key:""};
  let client=null;
  let authBooting=false;

  function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

  function loadSupabaseScript(timeoutMs=15000){
    return new Promise((resolve,reject)=>{
      if(window.supabase && typeof window.supabase.createClient==='function') return resolve(true);

      let settled=false;
      const settle=(ok, msg)=>{
        if(settled) return;
        settled=true;
        clearTimeout(timer);
        if(ok) resolve(true); else reject(new Error(msg));
      };

      const existing=document.getElementById('sktSupabaseScript');
      if(existing){
        existing.addEventListener('load',()=>{
          if(window.supabase && typeof window.supabase.createClient==='function') return settle(true);
          settle(false,'La librería de Supabase cargó, pero no expuso createClient().');
        },{once:true});
        existing.addEventListener('error',()=>settle(false,'No se pudo cargar la librería de Supabase desde el CDN.'),{once:true});
        return;
      }

      const s=document.createElement('script');
      s.id='sktSupabaseScript';
      // Usa el bundle UMD oficial para que exista window.supabase en un HTML estático sin Node/Vite.
      s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
      s.async=true;
      s.type='text/javascript';
      s.onload=()=>{
        if(window.supabase && typeof window.supabase.createClient==='function') return settle(true);
        settle(false,'La librería de Supabase cargó, pero no expuso createClient().');
      };
      s.onerror=()=>settle(false,'No se pudo cargar la librería de Supabase. Comprueba Internet o la CDN y vuelve a intentar.');

      const timer=setTimeout(()=>settle(false,'Tiempo agotado al cargar @supabase/supabase-js desde el CDN.'),timeoutMs);
      document.head.appendChild(s);
    });
  }
  async function setClient(){
    const cfg = window.DEFAULT_CONFIG || DEFAULT_CONFIG || {url:"", key:""};
    const url=String((cfg.url || window.DEFAULT_CONFIG?.url || DEFAULT_CONFIG.url || "") || "").trim().replace(/\/+$/, "");
    const key=String((cfg.key || window.DEFAULT_CONFIG?.key || DEFAULT_CONFIG.key || "") || "").trim();
    config={url, key};
    if(!url || !key) return false;
    try{
      await loadSupabaseScript(15000);
      if(!window.supabase || typeof window.supabase.createClient !== 'function'){
        throw new Error('La librería oficial de Supabase no está disponible en el navegador.');
      }
      if(!/^https:\/\//.test(url)){
        throw new Error('La URL de Supabase no es válida.');
      }
      if(!/^sb_publishable_[A-Za-z0-9_-]+$/.test(key) || /(service_role|secret)/i.test(key)){
        throw new Error('La clave de Supabase no parece una Publishable Key válida.');
      }
      client=window.supabase.createClient(url, key, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: false
        }
      });
      window.sktSupabase=client;
      window.client=client;
      localStorage.setItem(CFG, JSON.stringify({url, key}));
      return true;
    }catch(e){
      console.error('Supabase init error:', e);
      client=null;window.client=null;window.sktSupabase=null;
      return false;
    }
  }

  function configScreen(msg=""){
    document.body.innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eef4ff,#f8fafc);font-family:Arial,sans-serif;padding:20px">
      <div style="width:520px;max-width:100%;background:#fff;border:1px solid #e1e7f0;border-radius:18px;padding:30px;box-shadow:0 18px 50px #17203318">
        <div style="text-align:center;font-size:42px">📐</div>
        <h1 style="text-align:center;margin:8px 0">Matemática Virtual “SKT”</h1>
        <p style="text-align:center;color:#64748b">Pisco · Conexión inicial con Supabase</p>
        ${msg?`<div style="background:#fff1f2;color:#be123c;padding:11px;border-radius:8px;margin:15px 0">${esc(msg)}</div>`:""}
        <label style="display:block;margin:16px 0 6px;font-weight:700">Project URL</label>
        <input id="sktUrl" value="${esc(config.url)}" placeholder="https://xxxxxxxx.supabase.co" style="width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8e0eb;border-radius:8px">
        <label style="display:block;margin:16px 0 6px;font-weight:700">Publishable Key</label>
        <input id="sktKey" value="${esc(config.key)}" placeholder="sb_publishable_..." type="password" style="width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8e0eb;border-radius:8px">
        <button id="saveCfg" style="width:100%;margin-top:20px;padding:12px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer">Conectar con Supabase</button>
        <button id="clearSupabaseCfg" type="button" style="width:100%;margin-top:12px;padding:10px;border:1px solid #d9e1ec;background:#fff;color:#31527f;border-radius:8px;cursor:pointer">Limpiar configuración de Supabase</button>
        <p style="font-size:12px;color:#94a3b8;text-align:center;margin:16px 0 0">Usa únicamente la Publishable Key. No uses una clave secret o service_role.</p>
      </div></div>`;
    document.getElementById("clearSupabaseCfg").onclick=()=>{
      try{
        window.clearLegacyStorage();
        const safeConfig = window.DEFAULT_CONFIG || DEFAULT_CONFIG;
        config={url:safeConfig.url, key:safeConfig.key};
        localStorage.setItem(CFG, JSON.stringify(config));
        configScreen('Se restableció la configuración limpia de Supabase.');
      }catch(e){ configScreen('No se pudo limpiar la configuración de Supabase.'); }
    };
    document.getElementById("saveCfg").onclick=async()=>{
      const next={
        url:document.getElementById("sktUrl").value.trim(),
        key:document.getElementById("sktKey").value.trim()
      };
      const safeConfig = window.DEFAULT_CONFIG || DEFAULT_CONFIG;
      const url=String(next.url || safeConfig.url).trim().replace(/\/+$/, "");
      const key=String(next.key || safeConfig.key).trim();
      if(!url || !key) return configScreen("Completa Project URL y Publishable Key.");
      if(!/^https:\/\//.test(url)) return configScreen('La URL de Supabase debe empezar con https://');
      if(!/^sb_publishable_[A-Za-z0-9_-]+$/.test(key) || /(service_role|secret)/i.test(key)) return configScreen('La clave ingresada no parece una Publishable Key válida.');
      config={url,key};
      clearLegacyStorage();
      localStorage.setItem(CFG, JSON.stringify(config));
      const btn=document.getElementById('saveCfg');
      btn.disabled=true; btn.textContent='Conectando...';
      if(!(await setClient())){btn.disabled=false;btn.textContent='Conectar con Supabase';return configScreen('No se pudo inicializar Supabase. Verifica la URL, la Publishable Key y el acceso a Internet.');}
      loginScreen();
    };
  }

  window.sktTestSupabaseConnection = async function(){
    try{
      if(!config.url || !config.key) throw new Error("Falta la Publishable Key.");
      const ok=await setClient();
      if(!ok) throw new Error("No se pudo inicializar el cliente de Supabase en el navegador.");
      const {data,error}=await client.auth.getSession();
      if(error) throw error;
      return !!(data && data.session);
    }catch(e){
      const msg=e?.name==="AbortError"?"Tiempo agotado al conectar con Supabase.":(e?.message||"No se pudo conectar con Supabase.");
      throw new Error(msg);
    }
  };

  window.loginScreen = function loginScreen(msg=""){
    // IMPORTANTE: nunca reemplazar document.body. El portal completo debe permanecer
    // en el DOM para que sus referencias (#app, #nav, .profile, etc.) sigan siendo válidas.
    let overlay=document.getElementById("sktLoginOverlay");
    if(!overlay){
      overlay=document.createElement("div");
      overlay.id="sktLoginOverlay";
      overlay.style.cssText="position:fixed;inset:0;z-index:999999;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,.62);font-family:Arial,sans-serif;padding:20px;box-sizing:border-box";
      overlay.innerHTML=`
        <div style="width:410px;max-width:100%;background:#fff;border:1px solid #e1e7f0;border-radius:18px;padding:34px;box-shadow:0 18px 50px rgba(23,32,51,.24)">
          <div style="text-align:center;font-size:42px">📐</div>
          <h1 style="text-align:center;margin:8px 0">Matemática Virtual “SKT”</h1>
          <p style="text-align:center;color:#64748b">Pisco · Acceso seguro</p>
          <div id="sktLoginMsg"></div>
          <form id="sktLogin">
            <label style="display:block;margin:14px 0 6px">Correo</label>
            <input name="email" type="email" required placeholder="admin@skt.edu.pe" style="width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8e0eb;border-radius:8px">
            <label style="display:block;margin:14px 0 6px">Contraseña</label>
            <input name="password" type="password" required placeholder="••••••••" style="width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8e0eb;border-radius:8px">
            <button id="loginBtn" type="submit" style="width:100%;margin-top:20px;padding:12px;border:0;border-radius:8px;background:#2563eb;color:white;font-weight:700;cursor:pointer">Ingresar</button>
          </form>
          <p style="font-size:12px;color:#94a3b8;text-align:center;margin-top:18px">Autenticación mediante Supabase Auth</p>
          <button id="changeCfg" type="button" style="width:100%;padding:9px;border:1px solid #d9e1ec;background:#fff;color:#31527f;border-radius:8px;cursor:pointer">Cambiar conexión</button>
        </div>`;
      document.body.appendChild(overlay);

      document.getElementById("changeCfg").onclick=()=>{
        overlay.remove();
        localStorage.setItem(CFG, JSON.stringify({url:"https://svuqgecqrsscaucflfme.supabase.co", key:""}));
        window.DEFAULT_CONFIG = {url:"https://svuqgecqrsscaucflfme.supabase.co", key:""};
        config={url:"https://svuqgecqrsscaucflfme.supabase.co", key:""};
        configScreen();
      };

      document.getElementById("sktLogin").onsubmit=async(e)=>{
        e.preventDefault();
        const btn=document.getElementById("loginBtn");
        const msgBox=document.getElementById("sktLoginMsg");
        const f=new FormData(e.target);
        const email=String(f.get("email")||"").trim();
        const password=String(f.get("password")||"");
        btn.disabled=true; btn.textContent="Verificando...";
        msgBox.innerHTML="";
        try{
          if(!config.url || !config.key) throw new Error("Falta la configuración de Supabase.");
          if(!client && !(await setClient())) throw new Error("No se pudo conectar con Supabase.");

          // Autenticación nativa de Supabase: evita fetch manual y problemas de CORS.
          const {data,error}=await client.auth.signInWithPassword({email,password});
          if(error) throw error;
          if(!data?.user) throw new Error("Supabase no devolvió el usuario autenticado.");

          // Cargamos el portal SIN recargar la página y SIN destruir el DOM.
          await loadApp(data.user);
          overlay.remove();
          document.body.style.overflow="";
        }catch(err){
          console.error("LOGIN SKT:",err);
          btn.disabled=false; btn.textContent="Ingresar";
          const raw=String(err?.message||"");
          const text=err?.name==="AbortError"
            ? "La conexión con Supabase tardó demasiado. Comprueba Internet."
            : (/failed to fetch/i.test(raw)
              ? "No se pudo comunicar con Supabase. La URL es correcta; comprueba que la Publishable Key corresponda a este proyecto y que el navegador tenga Internet. Detalle: "+raw
              : raw||"No se pudo iniciar sesión.");
          msgBox.innerHTML=`<div style="background:#fff1f2;color:#be123c;padding:10px;border-radius:8px;margin:15px 0;font-size:13px">${esc(text)}</div>`;
        }
      };
    }

    const msgBox=document.getElementById("sktLoginMsg");
    if(msgBox){
      msgBox.innerHTML=msg?`<div style="background:#fff1f2;color:#be123c;padding:10px;border-radius:8px;margin:15px 0;font-size:13px">${esc(msg)}</div>`:"";
    }
    overlay.style.display="flex";
  }


  function normalizeRole(raw){
    const value=String(raw ?? "").trim();
    const map={
      administrador:"Administrador",
      admin:"Administrador",
      docente:"Docente",
      profesor:"Docente",
      teacher:"Docente",
      estudiante:"Estudiante",
      alumno:"Estudiante",
      student:"Estudiante"
    };
    const key=value.toLowerCase().normalize("NFKC");
    return map[key] || value;
  }

  async function loadApp(user){
    window.currentUser={id:user.id,email:user.email||"",name:user.email||"Usuario",role:"Estudiante"};
    try{
      const q=client.from("profiles").select("full_name,role").eq("id",user.id).single();
      const r=await Promise.race([q,new Promise((_,rej)=>setTimeout(()=>rej(new Error("Tiempo agotado al consultar profiles.")),10000))]);
      if(!r.error && r.data){
        window.currentUser.name=r.data.full_name||user.email||"Usuario";
        window.currentUser.role=normalizeRole(r.data.role)||"Estudiante";
      }
    }catch(e){ console.warn("profiles:",e); }

    const role=normalizeRole(window.currentUser.role||"");
    window.currentUser.role=role;
    if(!["Administrador","Docente","Estudiante"].includes(role)){
      throw new Error("El usuario no tiene un rol válido en public.profiles.");
    }

    const prof=document.querySelector(".profile");
    if(prof){
      const initials=(window.currentUser.name||window.currentUser.email).split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();
      prof.innerHTML=`🔔 <div class="avatar">${esc(initials)}</div><div><b>${esc(window.currentUser.name)}</b><div class="muted">${esc(role)} · SKT</div></div>`;
    }
    document.title='Matemática Virtual “SKT” – Pisco | '+role;
    window.dispatchEvent(new CustomEvent("skt:role-ready",{detail:window.currentUser}));

    // Enrutamiento explícito por rol, sin recargar la página.
    try{
      if(role==="Administrador"){
        const n=document.getElementById("nav");
        if(n){ n.style.display="block"; n.style.visibility="visible"; }
        if(typeof window.dashboard==="function") await window.dashboard();
        else if(typeof window.page==="function") window.page("dashboard");
        // Reaplicar el menú administrativo después de que el dashboard termine.
        setTimeout(function(){
          try{ if(typeof window.sktForceRoleMenu==="function") window.sktForceRoleMenu(); }catch(e){ console.warn("Menú admin:",e); }
        },50);
      }else if(role==="Estudiante"){
        if(typeof window.skt34Dashboard==="function") await window.skt34Dashboard();
        window.dispatchEvent(new CustomEvent("skt:student-ready",{detail:window.currentUser}));
      }else{
        window.dispatchEvent(new CustomEvent("skt:teacher-ready",{detail:window.currentUser}));
        if(typeof window.dashboard==="function") await window.dashboard();
      }
    }catch(e){ console.warn("Router SKT:",e); }
  }

  window.sktIsAuthenticated=function(){
    return !!(window.currentUser && window.currentUser.id);
  };

  function attachAuthStateListener(){
    if(!client || !client.auth || client.__sktAuthListenerAttached) return;
    client.__sktAuthListenerAttached = true;
    client.auth.onAuthStateChange(async (event, session)=>{
      if(event === "SIGNED_IN" && session?.user){
        if(window.currentUser?.id === session.user.id) return;
        try{
          await loadApp(session.user);
          const overlay=document.getElementById("sktLoginOverlay");
          if(overlay) overlay.remove();
        }catch(err){
          console.warn("Supabase auth state:",err);
        }
        return;
      }
      if(event === "SIGNED_OUT"){
        window.currentUser=null;
        const overlay=document.getElementById("sktLoginOverlay");
        if(!overlay && !authBooting) loginScreen();
      }
    });
  }

  async function boot(){
    if(!(await setClient())) return configScreen();
    attachAuthStateListener();
    authBooting=true;
    try{
      const {data:{session}, error}=await client.auth.getSession();
      if(error) throw error;
      if(session && session.user){
        await loadApp(session.user);
        return;
      }
    }catch(err){
      console.warn("Supabase session check:", err);
    } finally {
      authBooting=false;
    }
    window.currentUser=null;
    if(!document.getElementById("sktLoginOverlay")) loginScreen();
  }


  window.loginScreen=loginScreen;
  window.logout=async function(){
    try{
      if(client) await client.auth.signOut({scope:"local"});
    }catch(e){ console.warn("Supabase signOut:", e); }
    try{
      sessionStorage.clear();
      const keys=[];
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        if(k && (k.startsWith("sb-") || k==="skt_session")) keys.push(k);
      }
      keys.forEach(k=>localStorage.removeItem(k));
    }catch(e){}
    window.currentUser=null;
    if(typeof window.loginScreen==="function") window.loginScreen();
    else location.reload();
  };

  // Delay so the existing application code can finish defining its functions.
  boot();
})();
</script>

<script>
/* ===== v1.1 SUPABASE DATABASE — ESTUDIANTES ===== */
(function(){
  "use strict";
  let dbReady=false;
  const escDB=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  const db=()=>window.sktSupabase;
  function localFallback(){
    try{const raw=localStorage.getItem("skt_students_stable");return Array.isArray(JSON.parse(raw))?JSON.parse(raw):[];}catch(e){return []}
  }
  function mapStudent(x){
    const active = x.active !== false;
    return {
      id: x.id ?? x.code ?? "",
      code: String(x.code ?? "").trim(),
      name: String(x.full_name ?? "").trim(),
      grade: String(x.grade ?? "1.º").trim(),
      section: String(x.section ?? "A").trim().toUpperCase(),
      email: String(x.email ?? "").trim(),
      phone: String(x.phone ?? "").trim(),
      active,
      status: active ? "Activo" : "Inactivo",
      _dbId: x.id ?? null
    };
  }
  async function loadStudentsDB(){
    if(!db()) return false;
    const {data,error}=await db().from("students").select("id,code,full_name,grade,section,email,phone,active").order("code", { ascending: true });
    if(error){
      console.error("SKT students:",error);
      showRuntimeNotice("No se pudieron cargar los estudiantes: "+error.message);
      return false;
    }
    students=(data||[]).map(mapStudent);
    dbReady=true;
    return true;
  }
  function studentStats(s){
    const vals=acad&&acad.grades?Object.keys(acad.grades).filter(k=>k.endsWith("_"+s.id)).map(k=>acad.grades[k]).filter(v=>typeof v==="number"):[];
    s.avg=vals.length?Number((vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1)):0;
    return s;
  }
  function getFilteredStudents(){
    const q=(document.getElementById("sq")?.value||"").trim().toLowerCase();
    const g=(document.getElementById("gf")?.value||"").trim();
    const sec=(document.getElementById("secf")?.value||"").trim();
    const st=(document.getElementById("sf")?.value||"").trim();
    return students.filter(x=>{
      const matchQuery=!q || (x.name||"").toLowerCase().includes(q) || (x.code||"").toLowerCase().includes(q);
      const matchGrade=!g || x.grade===g;
      const matchSection=!sec || x.section===sec;
      const matchStatus=!st || x.status===st;
      return matchQuery && matchGrade && matchSection && matchStatus;
    });
  }
  function renderDB(){
    const a=getFilteredStudents();
    const el=document.getElementById("rows");
    if(!el) return;
    el.innerHTML=a.map(x=>`<tr><td><b>${escDB(x.code || x.id)}</b></td><td><b>${escDB(x.name)}</b><div class="muted">Sección ${escDB(x.section)}</div></td><td>${escDB(x.grade)}</td><td>${escDB(x.email||"—")}</td><td><span class="badge ${x.status==="Activo"?"":"warn"}">${x.status}</span></td><td class="actions"><button onclick="studentFormDB('${escDB(String(x._dbId ?? x.id))}')">Editar</button><button onclick="toggleStudentStatusDB('${escDB(String(x._dbId ?? x.id))}')">${x.status==="Activo"?"Desactivar":"Activar"}</button></td></tr>`).join("")||`<tr><td colspan="6" class="empty">No hay estudiantes.</td></tr>`;
  }
  window.renderDB = renderDB;
  async function renderStudentsDB(){
    if(!dbReady && !(await loadStudentsDB())){
      students=localFallback();
      if(!students.length){
        app.innerHTML=`<div class="head"><div><h1>Estudiantes</h1><div class="muted">Sin datos disponibles.</div></div></div><div class="panel"><div class="empty">No se pudieron cargar estudiantes desde Supabase.</div></div>`;
        return;
      }
    }
    students=students.map(studentStats);
    app.innerHTML=`<div class="head"><div><h1>Estudiantes</h1><div class="muted">Gestión conectada a Supabase · ${students.length} registros reales</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="secondary" onclick="refreshStudentsDB()">Actualizar</button><button class="primary" onclick="openStudentModalDB()">+ Nuevo estudiante</button></div></div>
    <div class="panel"><div class="toolbar"><input id="sq" placeholder="Buscar nombre o código..." oninput="renderDB()"><select id="gf" onchange="renderDB()"><option value="">Todos los grados</option>${["1.º","2.º","3.º","4.º","5.º"].map(x=>`<option>${x}</option>`).join("")}</select><select id="secf" onchange="renderDB()"><option value="">Todas las secciones</option>${["A","B","C","D"].map(x=>`<option>${x}</option>`).join("")}</select><select id="sf" onchange="renderDB()"><option value="">Todos los estados</option><option>Activo</option><option>Inactivo</option></select></div><div style="overflow:auto"><table class="table"><thead><tr><th>Código</th><th>Estudiante</th><th>Grado</th><th>Correo</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="rows"></tbody></table></div></div>`;
    renderDB();
  }
  async function refreshStudentsDB(){
    if(!db()){
      showRuntimeNotice("La sesión de Supabase no está activa.");
      return;
    }
    const ok=await loadStudentsDB();
    if(!ok){
      showRuntimeNotice("No se pudo actualizar la lista desde Supabase.");
      return;
    }
    await renderStudentsDB();
    showRuntimeNotice("Lista de estudiantes actualizada desde Supabase.");
  }
  window.refreshStudentsDB = refreshStudentsDB;
  function findStudentById(id){
    if(!id) return null;
    return students.find(x => String(x._dbId ?? x.id) === String(id) || x.code === String(id) || x.id === String(id)) || null;
  }
  function validateStudentPayload(payload, {allowEmptyEmailPhone=true}={}){
    const code=String(payload.code||"").trim();
    const name=String(payload.full_name||"").trim();
    const grade=String(payload.grade||"").trim();
    const section=String(payload.section||"").trim();
    if(!code || !name || !grade || !section){
      return "Completa código, nombre, grado y sección para guardar el estudiante.";
    }
    if(code.length < 2){
      return "El código del estudiante es muy corto.";
    }
    if(name.length < 3){
      return "El nombre del estudiante es demasiado corto.";
    }
    if(!["1.º","2.º","3.º","4.º","5.º"].includes(grade)){
      return "Selecciona un grado válido.";
    }
    if(!["A","B","C","D"].includes(section.toUpperCase())){
      return "Selecciona una sección válida.";
    }
    if(payload.email){
      const email = String(payload.email).trim();
      if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
        return "El correo no tiene un formato válido.";
      }
    }
    return "";
  }
  function closeStudentModalDB(){
    const modal=document.getElementById("sktStudentModal");
    if(modal) modal.remove();
  }
  function openStudentModalDB(studentId=null){
    const current = findStudentById(studentId) || {id:"", code:"", name:"", grade:"1.º", section:"A", email:"", phone:"", active:true, _dbId:null};
    const isEdit = !!studentId && !!current._dbId;
    const modal = document.createElement("div");
    modal.id = "sktStudentModal";
    modal.style.position="fixed"; modal.style.inset="0"; modal.style.background="rgba(15,23,42,.45)"; modal.style.display="flex"; modal.style.alignItems="center"; modal.style.justifyContent="center"; modal.style.zIndex="99999"; modal.style.padding="20px";
    modal.innerHTML=`<div style="width:min(560px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 20px 50px rgba(15,23,42,.18);padding:22px;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;">
        <div>
          <div style="font-size:12px;color:#64748b;text-transform:uppercase;letter-spacing:.12em;font-weight:700;">Estudiantes</div>
          <h3 style="margin:6px 0 0;font-size:26px;color:#0f172a;">${isEdit?"Editar estudiante":"Nuevo estudiante"}</h3>
        </div>
        <button type="button" class="secondary" onclick="closeStudentModalDB()" style="border:1px solid #d0d7de;background:#fff;color:#0f172a;padding:8px 12px;border-radius:10px;cursor:pointer;">Cerrar</button>
      </div>
      <form id="studentDBForm" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;">
        <label style="display:flex;flex-direction:column;gap:6px;color:#334155;font-size:13px;font-weight:600;grid-column:1 / -1;">
          Código
          <input name="code" value="${escDB(current.code || current.id || "")}" required style="padding:10px 12px;border:1px solid #d0d7de;border-radius:10px;outline:none;font:inherit;" ${isEdit?"readonly":""}>
        </label>
        <label style="display:flex;flex-direction:column;gap:6px;color:#334155;font-size:13px;font-weight:600;grid-column:1 / -1;">
          Nombre completo
          <input name="name" value="${escDB(current.name || "")}" required style="padding:10px 12px;border:1px solid #d0d7de;border-radius:10px;outline:none;font:inherit;" />
        </label>
        <label style="display:flex;flex-direction:column;gap:6px;color:#334155;font-size:13px;font-weight:600;">
          Grado
          <select name="grade" required style="padding:10px 12px;border:1px solid #d0d7de;border-radius:10px;outline:none;font:inherit;">
            ${["1.º","2.º","3.º","4.º","5.º"].map(x=>`<option value="${x}" ${x===current.grade?"selected":""}>${x}</option>`).join("")}
          </select>
        </label>
        <label style="display:flex;flex-direction:column;gap:6px;color:#334155;font-size:13px;font-weight:600;">
          Sección
          <select name="section" required style="padding:10px 12px;border:1px solid #d0d7de;border-radius:10px;outline:none;font:inherit;">
            ${["A","B","C","D"].map(x=>`<option value="${x}" ${x===String(current.section||"A").toUpperCase()?"selected":""}>${x}</option>`).join("")}
          </select>
        </label>
        <label style="display:flex;flex-direction:column;gap:6px;color:#334155;font-size:13px;font-weight:600;grid-column:1 / -1;">
          Correo
          <input name="email" type="email" value="${escDB(current.email || "")}" style="padding:10px 12px;border:1px solid #d0d7de;border-radius:10px;outline:none;font:inherit;" />
        </label>
        <label style="display:flex;flex-direction:column;gap:6px;color:#334155;font-size:13px;font-weight:600;grid-column:1 / -1;">
          Teléfono
          <input name="phone" value="${escDB(current.phone || "")}" style="padding:10px 12px;border:1px solid #d0d7de;border-radius:10px;outline:none;font:inherit;" />
        </label>
        <label style="display:flex;flex-direction:column;gap:6px;color:#334155;font-size:13px;font-weight:600;grid-column:1 / -1;">
          Estado
          <select name="active" style="padding:10px 12px;border:1px solid #d0d7de;border-radius:10px;outline:none;font:inherit;">
            <option value="true" ${current.active!==false?"selected":""}>Activo</option>
            <option value="false" ${current.active===false?"selected":""}>Inactivo</option>
          </select>
        </label>
        <div style="grid-column:1 / -1;display:flex;justify-content:flex-end;gap:8px;margin-top:10px;">
          <button type="button" class="secondary" onclick="closeStudentModalDB()" style="padding:10px 14px;border:1px solid #d0d7de;border-radius:10px;background:#fff;color:#0f172a;cursor:pointer;">Cancelar</button>
          <button type="submit" class="primary" style="padding:10px 14px;border:none;border-radius:10px;background:#2563eb;color:#fff;cursor:pointer;">${isEdit?"Guardar cambios":"Guardar estudiante"}</button>
        </div>
      </form>
    </div>`;
    document.body.appendChild(modal);
    const form=document.getElementById("studentDBForm");
    form.addEventListener("submit", async (e)=>{
      e.preventDefault();
      const f=new FormData(form);
      const payload = {
        code:String(f.get("code")||"").trim().toUpperCase(),
        full_name:String(f.get("name")||"").trim(),
        grade:String(f.get("grade")||"").trim(),
        section:String(f.get("section")||"").trim().toUpperCase(),
        email:(String(f.get("email")||"").trim()||null),
        phone:(String(f.get("phone")||"").trim()||null),
        active:String(f.get("active"))!=="false"
      };
      const validationError = validateStudentPayload(payload);
      if(validationError){
        alert(validationError);
        return;
      }
      const submitBtn=form.querySelector('button[type="submit"]');
      submitBtn.disabled=true; submitBtn.textContent = isEdit ? "Guardando..." : "Guardando...";
      try {
        let result;
        if(isEdit && current._dbId){
          result = await db().from("students").update(payload).eq("id", current._dbId).select().single();
        }else{
          result = await db().from("students").insert(payload).select().single();
        }
        if(result?.error){ throw result.error; }
        await loadStudentsDB();
        await renderStudentsDB();
        closeStudentModalDB();
        showRuntimeNotice(isEdit ? "Estudiante actualizado correctamente en Supabase." : "Estudiante guardado correctamente en Supabase.");
      }catch(err){
        console.error("studentDB save:", err);
        showRuntimeNotice("Error de Supabase: "+(err?.message || "No se pudo guardar el estudiante."));
        submitBtn.disabled=false; submitBtn.textContent = isEdit ? "Guardar cambios" : "Guardar estudiante";
      }
    });
  }
  window.toggleStudentStatusDB=async function(code){
    const st=findStudentById(code);
    if(!st || !st._dbId){
      alert("No se encontró el estudiante para cambiar su estado.");
      return;
    }
    const nextActive=!st.active;
    const label = nextActive ? "activar" : "desactivar";
    const ok = confirm(`¿Deseas ${label} a ${st.name}?`);
    if(!ok) return;
    try{
      const {error}=await db().from("students").update({active: nextActive}).eq("id", st._dbId);
      if(error){ throw error; }
      await loadStudentsDB();
      await renderStudentsDB();
      showRuntimeNotice(`Estado actualizado: ${nextActive ? "activado" : "desactivado"}.`);
    }catch(err){
      console.error("toggleStudentStatusDB:", err);
      showRuntimeNotice("Error de Supabase: "+(err?.message || "No se pudo actualizar el estado."));
    }
  };
  window.studentsPageDB=renderStudentsDB;
  window.studentFormDB=openStudentModalDB;
  window.openStudentModalDB=openStudentModalDB;
  window.closeStudentModalDB=closeStudentModalDB;
  window.studentForm=function(id){return window.studentFormDB(id)};
  async function bootDB(){
    if(!db())return;
    if(await loadStudentsDB()){
      const original=window.page;
      window.page=function(p){if(p==="estudiantes")return renderStudentsDB();return original(p)};
      window.dashboard=async function(){
        const n=students.filter(s=>s.status!=="Inactivo").length;app.innerHTML=`<div class="head"><div><h1>Panel principal</h1><div class="muted">Matemática Virtual “SKT” – Pisco · Supabase conectado</div></div></div><div class="cards"><div class="card"><small>ESTUDIANTES</small><div class="num">${n}</div><div class="good">● Base de datos</div></div><div class="card"><small>CURSOS</small><div class="num">${acad.courses.length}</div><div class="good">● Académicos</div></div><div class="card"><small>DOCENTES</small><div class="num">${acad.teachers.length}</div><div class="good">● Registrados</div></div><div class="card"><small>ESTADO</small><div class="num" style="font-size:20px">CONECTADO</div><div class="good">● Supabase</div></div></div><div class="panel"><h3>Base de datos</h3><div class="row"><span>Estudiantes</span><b>${n} registros</b></div><div class="row"><span>Autenticación</span><b>Supabase Auth</b></div><div class="row"><span>Rol actual</span><b>${escDB(window.currentUser?.role||"Administrador")}</b></div><br><button class="primary" onclick="studentFormDB()">+ Registrar estudiante</button></div>`;
      };
      setTimeout(()=>{if(typeof window.dashboard==="function")window.dashboard()},80);
    }
  }
  // No consultar tablas antes de autenticar: el archivo abre primero el login.
  // La carga real comienza únicamente después de skt:role-ready.
  window.addEventListener("skt:role-ready",()=>setTimeout(bootDB,50),{once:true});
})();
</script>

<script>
window.addEventListener('error',function(e){
  try{
    var box=document.getElementById('sktRuntimeError');
    if(!box){box=document.createElement('div');box.id='sktRuntimeError';box.style='position:fixed;bottom:10px;left:10px;right:10px;background:#fff1f2;color:#9f1239;border:1px solid #fecdd3;padding:10px 12px;border-radius:8px;font:13px Arial,sans-serif;z-index:99999';document.body.appendChild(box);}
    box.textContent='Error de ejecución: '+(e.message||'Error desconocido');
  }catch(_){}
});
</script>
<script>
function showRuntimeNotice(msg){
  console.warn("SKT:",msg);
  let b=document.getElementById("sktRuntimeNotice");
  if(!b){b=document.createElement("div");b.id="sktRuntimeNotice";b.style="position:fixed;right:18px;bottom:18px;z-index:999998;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;padding:10px 14px;border-radius:10px;box-shadow:0 8px 25px rgba(0,0,0,.12);font:13px Arial;max-width:420px";document.body.appendChild(b);}
  b.textContent=msg; setTimeout(()=>b?.remove(),7000);
}

<script>
/* ===== v1.2 SUPABASE DATABASE — DOCENTES ===== */
(function(){
  "use strict";
  const db=()=>window.sktSupabase;
  let teachersDB=[];

  const escT=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

  function mapTeacher(x){
    return {
      id:x.id,
      code:x.code||"",
      name:x.full_name||"",
      specialty:x.specialty||"",
      email:x.email||"",
      phone:x.phone||"",
      active:x.active!==false,
      user_id:x.user_id ?? null
    };
  }

  async function loadTeachersDB(){
    if(!db()) return false;
    const {data,error}=await db()
      .from("teachers")
      .select("id,code,full_name,specialty,email,phone,active,user_id")
      .order("code");
    if(error){
      console.error("SKT teachers:",error);
      showRuntimeNotice("No se pudieron cargar los docentes: "+error.message);
      return false;
    }
    teachersDB=(data||[]).map(mapTeacher);

    /* Mantener una copia en la estructura académica para los módulos siguientes. */
    if(window.acad){
      acad.teachers=teachersDB.map(t=>({
        id:t.id,
        code:t.code,
        name:t.name,
        specialty:t.specialty,
        email:t.email
      }));
    }
    return true;
  }

  function teacherCount(){
    return teachersDB.filter(t=>t.active).length;
  }

  async function refreshTeachersDB(){
    if(!db()){
      showRuntimeNotice("La sesión de Supabase no está activa.");
      return;
    }
    const ok=await loadTeachersDB();
    if(!ok){
      showRuntimeNotice("No se pudo actualizar la lista desde Supabase.");
      return;
    }
    await renderTeachersDB();
    showRuntimeNotice("Lista de docentes actualizada desde Supabase.");
  }

  window.refreshTeachersDB = refreshTeachersDB;

  window.renderTeachersDB=async function(){
    if(!(await loadTeachersDB())) return;

    app.innerHTML=`
      <div class="head">
        <div>
          <h1>Docentes</h1>
          <div class="muted">Registro conectado a Supabase · ${teachersDB.length} registros reales</div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="secondary" onclick="refreshTeachersDB()">Actualizar</button>
          <button class="primary" onclick="teacherFormDB()">+ Nuevo docente</button>
        </div>
      </div>

      <div class="panel">
        <div class="toolbar">
          <input id="tq" placeholder="Buscar nombre, código o correo..." oninput="renderTeacherRowsDB()">
          <select id="tst" onchange="renderTeacherRowsDB()">
            <option value="">Todos los estados</option>
            <option value="Activo">Activos</option>
            <option value="Inactivo">Inactivos</option>
          </select>
        </div>

        <div style="overflow:auto">
          <table class="table">
            <thead>
              <tr>
                <th>Código</th>
                <th>Docente</th>
                <th>Especialidad</th>
                <th>Correo</th>
                <th>Teléfono</th>
                <th>Cuenta</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="teacherRowsDB"></tbody>
          </table>
        </div>
      </div>`;
    renderTeacherRowsDB();
  };

  window.renderTeacherRowsDB=function(){
    const q=(document.getElementById("tq")?.value||"").toLowerCase();
    const st=document.getElementById("tst")?.value||"";

    const rows=teachersDB.filter(t=>{
      const hay=[t.code,t.name,t.specialty,t.email,t.phone].join(" ").toLowerCase();
      const state=t.active?"Activo":"Inactivo";
      return (!q||hay.includes(q)) && (!st||state===st);
    });

    const el=document.getElementById("teacherRowsDB");
    if(!el) return;

    el.innerHTML=rows.map(t=>`
      <tr>
        <td><b>${escT(t.code)}</b></td>
        <td><b>${escT(t.name)}</b></td>
        <td>${escT(t.specialty||"—")}</td>
        <td>${escT(t.email||"—")}</td>
        <td>${escT(t.phone||"—")}</td>
        <td>${t.user_id != null ? "Vinculada" : "Sin vincular"}</td>
        <td><span class="badge ${t.active?"":"warn"}">${t.active?"Activo":"Inactivo"}</span></td>
        <td class="actions">
          <button onclick="teacherFormDB('${t.id}')">Editar</button>
          <button onclick="toggleTeacherStatusDB('${t.id}')">${t.active?"Desactivar":"Activar"}</button>
        </td>
      </tr>`).join("") ||
      `<tr><td colspan="8" class="empty">No hay docentes que coincidan con la búsqueda.</td></tr>`;
  };

  window.teacherFormDB=function(id){
    const t=teachersDB.find(x=>x.id===id) || {
      id:null,code:"",name:"",specialty:"",email:"",phone:"",active:true
    };

    app.innerHTML=`
      <div class="head">
        <div>
          <h1>${id?"Editar":"Nuevo"} docente</h1>
          <div class="muted">Registro académico en Supabase</div>
        </div>
        <button class="secondary" onclick="renderTeachersDB()">← Volver</button>
      </div>

      <div class="panel">
        <form id="teacherDBForm" class="form">
          <label>Código
            <input name="code" required value="${escT(t.code)}" ${id?"readonly":""}>
          </label>

          <label>Nombre completo
            <input name="name" required value="${escT(t.name)}">
          </label>

          <label>Especialidad
            <input name="specialty" value="${escT(t.specialty)}">
          </label>

          <label>Correo
            <input name="email" type="email" value="${escT(t.email)}">
          </label>

          <label>Teléfono
            <input name="phone" value="${escT(t.phone)}">
          </label>

          <label>Estado
            <select name="active">
              <option value="true" ${t.active?"selected":""}>Activo</option>
              <option value="false" ${!t.active?"selected":""}>Inactivo</option>
            </select>
          </label>

          <div class="full">
            <button class="primary" id="saveTeacherDB">Guardar en Supabase</button>
            <button type="button" class="secondary" onclick="renderTeachersDB()">Cancelar</button>
          </div>
        </form>
      </div>`;

    document.getElementById("teacherDBForm").onsubmit=async e=>{
      e.preventDefault();

      const btn=document.getElementById("saveTeacherDB");
      btn.disabled=true;
      btn.textContent="Guardando...";

      const f=new FormData(e.target);
      const payload={
        code:String(f.get("code")||"").trim().toUpperCase(),
        full_name:String(f.get("name")||"").trim(),
        specialty:String(f.get("specialty")||"").trim()||null,
        email:String(f.get("email")||"").trim()||null,
        phone:String(f.get("phone")||"").trim()||null,
        active:String(f.get("active"))==="true"
      };

      if(!payload.code || !payload.full_name){
        alert("Completa el código y el nombre del docente.");
        btn.disabled=false;
        btn.textContent="Guardar en Supabase";
        return;
      }

      try{
        const result=id
          ? await db().from("teachers").update(payload).eq("id",id).select().single()
          : await db().from("teachers").insert(payload).select().single();

        if(result.error){ throw result.error; }

        await loadTeachersDB();
        await renderTeachersDB();
        showRuntimeNotice(id ? "Docente actualizado correctamente en Supabase." : "Docente guardado correctamente en Supabase.");
      }catch(err){
        console.error("teacherFormDB:", err);
        showRuntimeNotice("Error de Supabase: "+(err?.message || "No se pudo guardar el docente."));
        btn.disabled=false;
        btn.textContent="Guardar en Supabase";
      }
    };
  };

  window.toggleTeacherStatusDB=async function(id){
    const t=teachersDB.find(x=>x.id===id);
    if(!t) return;

    const nextActive=!t.active;
    const actionLabel=nextActive?"activar":"desactivar";
    if(!confirm("¿Deseas "+actionLabel+" a "+t.name+"?")) return;

    try{
      const {error}=await db().from("teachers")
        .update({active:nextActive})
        .eq("id",id);

      if(error){ throw error; }

      await loadTeachersDB();
      await renderTeachersDB();
      showRuntimeNotice("Estado actualizado: "+(nextActive?"activo":"inactivo")+".");
    }catch(err){
      console.error("toggleTeacherStatusDB:", err);
      showRuntimeNotice("Error de Supabase: "+(err?.message || "No se pudo actualizar el estado."));
    }
  };

  window.deleteTeacherDB=window.toggleTeacherStatusDB;

  /* Sustituir solo el módulo Docentes sin alterar los demás módulos. */
  const oldPage=window.page;
  window.page=function(p){
    if(p==="docentes") return renderTeachersDB();
    return oldPage(p);
  };

  /* Cargar docentes reales y actualizar el contador del dashboard cuando exista. */
  async function bootTeachersDB(){
    if(!db()) return;
    await loadTeachersDB();
    if(window.currentUser) setTimeout(()=>{
      const buttons=document.querySelectorAll("#nav button");
      buttons.forEach(b=>{
        if(b.dataset.page==="docentes") b.title=teachersDB.length+" docentes en Supabase";
      });
    },200);
  }

  // Evita consultas de Docentes antes de que exista una sesión autenticada.
  window.addEventListener("skt:role-ready",()=>{if(window.currentUser?.role==="Administrador") setTimeout(bootTeachersDB,100);},{once:true});
})();
</script>

<script>
/* ===== v1.3 SUPABASE DATABASE — CURSOS ===== */
(function(){
  "use strict";
  const db=()=>window.sktSupabase;
  let coursesDB=[], teachersDB=[];
  const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

  async function loadCourses(){
    if(!db()) return false;
    const [cr,tr]=await Promise.all([
      db().from("courses").select("id,code,name,grade,section,teacher_id,active").order("code"),
      db().from("teachers").select("id,code,full_name,specialty,active").order("code")
    ]);
    if(cr.error){showRuntimeNotice("No se pudieron cargar los cursos: "+cr.error.message);console.error(cr.error);return false;}
    if(tr.error){alert("No se pudieron cargar los docentes: "+tr.error.message);console.error(tr.error);return false;}
    coursesDB=cr.data||[]; teachersDB=tr.data||[];
    window.__sktCoursesDB=coursesDB;
    return true;
  }
  const teacherName=id=>{const t=teachersDB.find(x=>x.id===id);return t?.full_name||"Sin docente"};

  window.renderCoursesDB=async function(){
    if(!(await loadCourses())) return;
    app.innerHTML=`<div class="head"><div><h1>Cursos</h1><div class="muted">Cursos conectados a Supabase · ${coursesDB.length} registros reales</div></div><button class="primary" onclick="courseFormDB()">+ Nuevo curso</button></div>
      <div class="panel"><div class="toolbar"><input id="cq" placeholder="Buscar código, curso, grado o sección..." oninput="renderCourseRowsDB()"><select id="cst" onchange="renderCourseRowsDB()"><option value="">Todos los estados</option><option value="Activo">Activos</option><option value="Inactivo">Inactivos</option></select></div>
      <div style="overflow:auto"><table class="table"><thead><tr><th>Código</th><th>Curso</th><th>Grado</th><th>Sección</th><th>Docente</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="courseRowsDB"></tbody></table></div></div>`;
    renderCourseRowsDB();
  };

  window.renderCourseRowsDB=function(){
    const q=(document.getElementById("cq")?.value||"").toLowerCase(), st=document.getElementById("cst")?.value||"";
    const rows=coursesDB.filter(c=>{
      const hay=[c.code,c.name,c.grade,c.section,teacherName(c.teacher_id)].join(" ").toLowerCase();
      const state=c.active?"Activo":"Inactivo";
      return (!q||hay.includes(q))&&(!st||state===st);
    });
    const el=document.getElementById("courseRowsDB"); if(!el)return;
    el.innerHTML=rows.map(c=>`<tr><td><b>${esc(c.code)}</b></td><td><b>${esc(c.name)}</b></td><td>${esc(c.grade)}</td><td>${esc(c.section)}</td><td>${esc(teacherName(c.teacher_id))}</td><td><span class="badge ${c.active?"":"warn"}">${c.active?"Activo":"Inactivo"}</span></td><td class="actions"><button onclick="courseFormDB('${c.id}')">Editar</button><button onclick="toggleCourseStatusDB('${c.id}')">${c.active?"Desactivar":"Activar"}</button></td></tr>`).join("")||`<tr><td colspan="7" class="empty">No hay cursos que coincidan con la búsqueda.</td></tr>`;
  };

  window.courseFormDB=function(id){
    const c=coursesDB.find(x=>x.id===id)||{id:null,code:"",name:"",grade:"1.º",section:"A",teacher_id:"",active:true};
    app.innerHTML=`<div class="head"><div><h1>${id?"Editar":"Nuevo"} curso</h1><div class="muted">Registro académico en Supabase</div></div><button class="secondary" onclick="renderCoursesDB()">← Volver</button></div>
      <div class="panel"><form id="courseDBForm" class="form">
        <label>Código<input name="code" required value="${esc(c.code)}" ${id?"readonly":""}></label>
        <label>Nombre del curso<input name="name" required value="${esc(c.name)}"></label>
        <label>Grado<select name="grade">${["1.º","2.º","3.º","4.º","5.º"].map(x=>`<option ${x===c.grade?"selected":""}>${x}</option>`).join("")}</select></label>
        <label>Sección<select name="section">${["A","B","C","D"].map(x=>`<option ${x===c.section?"selected":""}>${x}</option>`).join("")}</select></label>
        <label>Docente<select name="teacher_id"><option value="">Sin docente</option>${teachersDB.map(t=>`<option value="${t.id}" ${t.id===c.teacher_id?"selected":""}>${esc(t.full_name)} · ${esc(t.code)}</option>`).join("")}</select></label>
        <label>Estado<select name="active"><option value="true" ${c.active?"selected":""}>Activo</option><option value="false" ${!c.active?"selected":""}>Inactivo</option></select></label>
        <div class="full"><button class="primary" id="saveCourseDB">Guardar en Supabase</button> <button type="button" class="secondary" onclick="renderCoursesDB()">Cancelar</button></div>
      </form></div>`;
    document.getElementById("courseDBForm").onsubmit=async e=>{
      e.preventDefault(); const btn=document.getElementById("saveCourseDB");btn.disabled=true;btn.textContent="Guardando...";
      const f=new FormData(e.target);
      const payload={code:String(f.get("code")).trim().toUpperCase(),name:String(f.get("name")).trim(),grade:String(f.get("grade")),section:String(f.get("section")).trim().toUpperCase(),teacher_id:String(f.get("teacher_id"))||null,active:String(f.get("active"))==="true"};
      if(!payload.teacher_id) payload.teacher_id=null;
      try{
        const result=id
          ? await db().from("courses").update(payload).eq("id",id).select().single()
          : await db().from("courses").insert(payload).select().single();
        if(result?.error){ throw result.error; }
        const ok = await loadCourses();
        if(!ok){ throw new Error("No se pudo recargar la lista desde Supabase."); }
        window.__sktCoursesDB = coursesDB;
        await renderCoursesDB();
        showRuntimeNotice(id ? "Curso actualizado correctamente en Supabase." : "Curso guardado correctamente en Supabase.");
      }catch(err){
        console.error("courseFormDB:", err);
        showRuntimeNotice("Error de Supabase: "+(err?.message || "No se pudo guardar el curso."));
        btn.disabled=false; btn.textContent="Guardar en Supabase";
      }
    };
  };

  window.toggleCourseStatusDB=async function(id){
    const c=coursesDB.find(x=>x.id===id);if(!c)return;
    const nextActive=!c.active;
    const action=nextActive?"activar":"desactivar";
    if(!confirm("¿Deseas "+action+" el curso "+c.name+"?"))return;
    const {error}=await db().from("courses").update({active:nextActive}).eq("id",id);
    if(error){alert("No se pudo actualizar el estado:\n"+error.message);return;}
    await loadCourses();renderCoursesDB();
  };
  window.deleteCourseDB=window.toggleCourseStatusDB;

  const oldPage=window.page;
  window.page=function(p){if(p==="cursos") return renderCoursesDB(); return oldPage(p)};
  window.addEventListener("skt:role-ready",()=>setTimeout(()=>{if(db())loadCourses();},120),{once:true});
})();
</script>


<script>
/* ===== v1.4 SUPABASE DATABASE — MATRÍCULA ===== */
(function(){
  "use strict";
  const db=()=>window.sktSupabase;
  let studentsDB=[], coursesDB=[], enrollmentsDB=[];

  const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

  async function loadMatriculaData(){
    if(!db()) return false;

    const [s,c,e]=await Promise.all([
      db().from("students").select("id,code,full_name,grade,section,active").eq("active",true).order("code"),
      db().from("courses").select("id,code,name,grade,section,teacher_id,active").eq("active",true).order("code"),
      db().from("enrollments").select("id,student_id,course_id,enrolled_at").order("enrolled_at",{ascending:false})
    ]);

    if(s.error){showRuntimeNotice("No se pudieron cargar los estudiantes: "+s.error.message);return false;}
    if(c.error){showRuntimeNotice("No se pudieron cargar los cursos: "+c.error.message);return false;}
    if(e.error){showRuntimeNotice("No se pudieron cargar las matrículas: "+e.error.message);return false;}

    studentsDB=s.data||[];
    coursesDB=c.data||[];
    enrollmentsDB=e.data||[];
    return true;
  }

  function studentName(id){
    const s=studentsDB.find(x=>x.id===id);
    return s ? `${s.full_name} · ${s.code}` : "Estudiante";
  }

  function courseName(id){
    const c=coursesDB.find(x=>x.id===id);
    return c ? `${c.name} · ${c.grade} ${c.section} · ${c.code}` : "Curso";
  }

  window.renderEnrollmentDB=async function(){
    if(!(await loadMatriculaData())) return;

    app.innerHTML=`
      <div class="head">
        <div>
          <h1>Matrícula y asignación</h1>
          <div class="muted">Asignación real de estudiantes a cursos · ${enrollmentsDB.length} matrículas</div>
        </div>
        <button class="primary" onclick="enrollmentFormDB()">+ Nueva matrícula</button>
      </div>

      <div class="panel">
        <div class="toolbar">
          <input id="eq" placeholder="Buscar estudiante o curso..." oninput="renderEnrollmentRowsDB()">
        </div>

        <div style="overflow:auto">
          <table class="table">
            <thead>
              <tr>
                <th>Estudiante</th>
                <th>Grado / Sección</th>
                <th>Curso</th>
                <th>Fecha de matrícula</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="enrollmentRowsDB"></tbody>
          </table>
        </div>
      </div>`;
    renderEnrollmentRowsDB();
  };

  window.renderEnrollmentRowsDB=function(){
    const q=(document.getElementById("eq")?.value||"").toLowerCase();
    const rows=enrollmentsDB.filter(e=>{
      const s=studentsDB.find(x=>x.id===e.student_id);
      const c=coursesDB.find(x=>x.id===e.course_id);
      const hay=[s?.full_name,s?.code,s?.grade,s?.section,c?.name,c?.code,c?.grade,c?.section].join(" ").toLowerCase();
      return !q || hay.includes(q);
    });

    const el=document.getElementById("enrollmentRowsDB");
    if(!el) return;

    el.innerHTML=rows.map(e=>{
      const s=studentsDB.find(x=>x.id===e.student_id);
      const c=coursesDB.find(x=>x.id===e.course_id);
      return `<tr>
        <td><b>${esc(s?.full_name||"")}</b><div class="muted">${esc(s?.code||"")}</div></td>
        <td>${esc(s?.grade||"")} ${esc(s?.section||"")}</td>
        <td><b>${esc(c?.name||"")}</b><div class="muted">${esc(c?.code||"")}</div></td>
        <td>${e.enrolled_at ? new Date(e.enrolled_at).toLocaleDateString("es-PE") : "—"}</td>
        <td class="actions"><button onclick="deleteEnrollmentDB('${e.id}')">Quitar</button></td>
      </tr>`;
    }).join("") || `<tr><td colspan="5" class="empty">No hay matrículas registradas.</td></tr>`;
  };

  window.enrollmentFormDB=function(){
    app.innerHTML=`
      <div class="head">
        <div>
          <h1>Nueva matrícula</h1>
          <div class="muted">Selecciona un estudiante y un curso existentes.</div>
        </div>
        <button class="secondary" onclick="renderEnrollmentDB()">← Volver</button>
      </div>

      <div class="panel">
        <form id="enrollmentDBForm" class="form">
          <label>Estudiante
            <select name="student_id" required>
              <option value="">Seleccione un estudiante</option>
              ${studentsDB.map(s=>`<option value="${s.id}">${esc(s.full_name)} · ${esc(s.code)} · ${esc(s.grade)} ${esc(s.section)}</option>`).join("")}
            </select>
          </label>

          <label>Curso
            <select name="course_id" required>
              <option value="">Seleccione un curso</option>
              ${coursesDB.map(c=>`<option value="${c.id}">${esc(c.name)} · ${esc(c.grade)} ${esc(c.section)} · ${esc(c.code)}</option>`).join("")}
            </select>
          </label>

          <div class="full">
            <div id="enrollHint" class="muted" style="padding:10px 0"></div>
            <button class="primary" id="saveEnrollmentDB">Guardar matrícula</button>
            <button type="button" class="secondary" onclick="renderEnrollmentDB()">Cancelar</button>
          </div>
        </form>
      </div>`;

    const form=document.getElementById("enrollmentDBForm");
    const hint=document.getElementById("enrollHint");
    const studentSelect=form.querySelector('[name="student_id"]');
    const courseSelect=form.querySelector('[name="course_id"]');

    function updateHint(){
      const sid=studentSelect.value, cid=courseSelect.value;
      if(!sid || !cid){ hint.textContent="Selecciona ambos elementos para verificar la asignación."; return; }

      const s=studentsDB.find(x=>x.id===sid), c=coursesDB.find(x=>x.id===cid);
      const exists=enrollmentsDB.some(x=>x.student_id===sid && x.course_id===cid);

      if(exists){
        hint.textContent="⚠ Esta matrícula ya existe.";
        hint.style.color="#b45309";
      }else{
        hint.textContent=`Se asignará ${s?.full_name||"el estudiante"} al curso ${c?.name||"seleccionado"} ${c?.grade||""} ${c?.section||""}.`;
        hint.style.color="";
      }
    }

    studentSelect.onchange=updateHint;
    courseSelect.onchange=updateHint;

    form.onsubmit=async ev=>{
      ev.preventDefault();

      const btn=document.getElementById("saveEnrollmentDB");
      btn.disabled=true;
      btn.textContent="Guardando...";

      const f=new FormData(form);
      const student_id=String(f.get("student_id"));
      const course_id=String(f.get("course_id"));

      const exists=enrollmentsDB.some(x=>x.student_id===student_id && x.course_id===course_id);
      if(exists){
        alert("Esta matrícula ya existe.");
        btn.disabled=false;
        btn.textContent="Guardar matrícula";
        return;
      }

      const {error}=await db().from("enrollments").insert({student_id,course_id}).select().single();

      if(error){
        alert("No se pudo guardar la matrícula:\n"+error.message);
        btn.disabled=false;
        btn.textContent="Guardar matrícula";
        return;
      }

      alert("Matrícula guardada correctamente en Supabase.");
      await renderEnrollmentDB();
    };
  };

  window.deleteEnrollmentDB=async function(id){
    const e=enrollmentsDB.find(x=>x.id===id);
    if(!e) return;

    if(!confirm(`¿Quitar la matrícula de ${studentName(e.student_id)} en ${courseName(e.course_id)}?`)) return;

    const {error}=await db().from("enrollments").delete().eq("id",id);
    if(error){
      alert("No se pudo quitar la matrícula:\n"+error.message);
      return;
    }

    alert("Matrícula eliminada correctamente.");
    renderEnrollmentDB();
  };

  /* El menú Clases funcionará ahora como Matrícula y asignación. */
  const oldPage=window.page;

  };

  window.addEventListener("skt:role-ready",()=>setTimeout(()=>{if(db())loadMatriculaData()},150),{once:true});
})();
</script>
